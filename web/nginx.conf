server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  # The page is one ~380 KB HTML file; gzip cuts it to roughly a quarter on the wire.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_vary on;
  location = /healthz { access_log off; return 200 "ok\n"; }
  # Revalidate on every load so a rebuild shows up without a hard refresh.
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
  # Live data: the collector (homedeck-api, see LIVE_DATA.md). Resolved per request through Docker's DNS so
  # nginx starts (and keeps serving the page) even while the collector is down or being recreated.
  gzip_proxied any;
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $homedeck_api http://homedeck-api:8000;
    proxy_pass $homedeck_api;
    proxy_read_timeout 15s;
    proxy_connect_timeout 3s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }
}
