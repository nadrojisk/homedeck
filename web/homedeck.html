<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#cfc8f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a40" media="(prefers-color-scheme: dark)">
<title>HomeDeck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='9' fill='%23b79cf0'/%3E%3Cpath d='M9 22V10h6a6 6 0 0 1 0 12z' fill='%23f4a97f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* Theme routing, decided before anything else loads: it picks which front end boots (the 3D map with glass panels, or
   the full-screen LCARS app) and whether three.js is fetched at all. This is the one place the public URLs are defined:
     /starbase  /ds9  /lcars        (nginx serves this file for them; ?theme=<slug> works too, e.g. from file://)
   Anything else (/) uses the theme saved by the last visit, else the first map theme. src/core.js (HD.route) and
   src/app.js read window.HomeDeckBoot; nothing else parses the URL. */
(function () {
  var SLUGS = { starbase: 'startrek', ds9: 'ds9', lcars: 'lcars' };      // URL slug -> theme id (the id is what localStorage keeps)
  var APP = { lcars: true };                                            // themes that are a whole app, not a 3D map
  var m = /^\/(starbase|ds9|lcars)\/?$/.exec(location.pathname) || /[?&]theme=(starbase|ds9|lcars)(?:&|#|$)/.exec(location.search);
  var id = m ? SLUGS[m[1]] : '', from = id ? 'url' : '';
  if (!id) {
    try { id = JSON.parse(localStorage.getItem('homedeck:theme')); } catch (e) { id = ''; }
    for (var slug in SLUGS) if (SLUGS[slug] === id) from = 'saved';
    if (from !== 'saved') id = '';
  }
  var mode = APP[id] ? id : 'scene';
  var boot = window.HomeDeckBoot = { id: id, from: from, mode: mode, slugs: SLUGS, three: null };
  document.documentElement.setAttribute('data-mode', mode);
  var head = document.head;
  function font(family) {                                               // non-blocking web font, same trick as a rel=preload swap
    var l = document.createElement('link');
    l.rel = 'preload'; l.as = 'style'; l.href = 'https://fonts.googleapis.com/css2?family=' + family + '&display=swap';
    l.onload = function () { l.onload = null; l.rel = 'stylesheet'; };
    head.appendChild(l);
  }
  if (mode === 'lcars') {                                               // black page chrome, Antonio instead of Inter
    var tc = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < tc.length; i++) tc[i].parentNode.removeChild(tc[i]);
    var meta = document.createElement('meta');
    meta.name = 'theme-color'; meta.content = '#000000'; head.appendChild(meta);
    document.querySelector('link[rel="icon"]').href = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M3 29V11a8 8 0 0 1 8-8h18v7H14a4 4 0 0 0-4 4v15z' fill='%23cc99cc'/%3E%3Crect x='14' y='14' width='15' height='6' rx='3' fill='%23f0a040'/%3E%3C/svg%3E";
    font('Antonio:wght@400;600;700');
  } else {
    font('Inter:wght@400;500;600;700');
    /* three.js is only needed by the 3D map themes (the LCARS app is plain DOM and never downloads it). It starts here, in
       parallel with the rest of the page, and app.js waits on this promise before building the scene. */
    boot.three = new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
      s.integrity = 'sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==';
      s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
      s.onload = function () { resolve(!!window.THREE); };
      s.onerror = function () { resolve(false); };
      head.appendChild(s);
    });
  }
})();
</script>
<style>/* ==== core.css ==== */
/* HomeDeck design tokens + base layout. Shared by every module and theme.
   Themes may override the --hd-accent-* and --hd-sky-* variables at runtime
   via document.documentElement.style, but never the status or ink tokens. */
:root {
  color-scheme: light dark;
  --hd-font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* Ink */
  --hd-ink: #262a52;
  --hd-ink-2: #555b8c;
  --hd-ink-3: #7d82ad;
  --hd-ink-invert: #ffffff;

  /* Glass surfaces */
  --hd-glass: rgba(249, 248, 255, 0.76);
  --hd-glass-strong: rgba(255, 255, 255, 0.92);
  --hd-glass-sunken: rgba(232, 230, 250, 0.7);
  --hd-glass-border: rgba(255, 255, 255, 0.8);
  --hd-hairline: rgba(38, 42, 82, 0.1);
  --hd-blur: 18px;
  --hd-shadow: 0 22px 44px -22px rgba(48, 40, 130, 0.5), 0 2px 8px rgba(48, 40, 130, 0.08);
  --hd-shadow-sm: 0 8px 18px -10px rgba(48, 40, 130, 0.45);

  /* LCARS-inspired pastel accents (panel elbows, highlights) */
  --hd-peach: #f4a97f;
  --hd-lilac: #b79cf0;
  --hd-sky: #8ec5f5;
  --hd-butter: #f6d27d;
  --hd-rose: #ef8a9a;
  --hd-mint: #7fd6b0;
  --hd-accent: var(--hd-lilac);      /* primary interactive accent */
  --hd-accent-ink: #5b3fc4;           /* accent used for text/icons on glass */

  /* Status (text color / soft background / solid dot) */
  --hd-ok: #23845f;    --hd-ok-bg: rgba(127, 214, 176, 0.3);   --hd-ok-dot: #4cc495;
  --hd-warn: #9a6400;  --hd-warn-bg: rgba(246, 210, 125, 0.42); --hd-warn-dot: #f0b23c;
  --hd-down: #c23651;  --hd-down-bg: rgba(239, 138, 154, 0.3);  --hd-down-dot: #ec5a74;
  --hd-idle: #6c7099;  --hd-idle-bg: rgba(125, 130, 173, 0.18); --hd-idle-dot: #9aa0c8;

  /* Shape + rhythm */
  --hd-r-xl: 24px;   /* floating panels */
  --hd-r-lg: 18px;   /* cards inside panels */
  --hd-r-md: 12px;   /* rows, inputs */
  --hd-r-sm: 8px;
  --hd-r-pill: 999px;
  --hd-gap: 14px;
  --hd-edge: 16px;   /* distance of panels from viewport edge */

  /* Type scale */
  --hd-fs-xs: 11px;
  --hd-fs-sm: 12.5px;
  --hd-fs-md: 14px;
  --hd-fs-lg: 16px;
  --hd-fs-xl: 21px;
  --hd-fs-2xl: 28px;

  /* Safe areas */
  --hd-safe-t: env(safe-area-inset-top, 0px);
  --hd-safe-r: env(safe-area-inset-right, 0px);
  --hd-safe-b: env(safe-area-inset-bottom, 0px);
  --hd-safe-l: env(safe-area-inset-left, 0px);

  /* Scene backdrop (themes override these) */
  --hd-sky-css: linear-gradient(180deg, #c9c3f0 0%, #e9e2f7 100%);

  --hd-ease: cubic-bezier(.2, .8, .2, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --hd-ink: #eeecff;
    --hd-ink-2: #bcb8e6;
    --hd-ink-3: #8e8ac0;
    --hd-ink-invert: #1b1d42;
    --hd-glass: rgba(30, 31, 72, 0.66);
    --hd-glass-strong: rgba(38, 39, 86, 0.9);
    --hd-glass-sunken: rgba(16, 17, 46, 0.5);
    --hd-glass-border: rgba(255, 255, 255, 0.12);
    --hd-hairline: rgba(255, 255, 255, 0.1);
    --hd-shadow: 0 24px 50px -24px rgba(0, 0, 10, 0.75), 0 2px 8px rgba(0, 0, 10, 0.25);
    --hd-shadow-sm: 0 8px 18px -10px rgba(0, 0, 10, 0.7);
    --hd-accent-ink: #cbb8ff;
    --hd-ok: #8fe6c0;   --hd-ok-bg: rgba(76, 196, 149, 0.2);
    --hd-warn: #ffd27a; --hd-warn-bg: rgba(240, 178, 60, 0.2);
    --hd-down: #ff9fb0; --hd-down-bg: rgba(236, 90, 116, 0.22);
    --hd-idle: #a9a6d4; --hd-idle-bg: rgba(154, 160, 200, 0.16);
    --hd-sky-css: linear-gradient(180deg, #151a40 0%, #3b3a7a 100%);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--hd-font);
  font-size: var(--hd-fs-md);
  line-height: 1.4;
  color: var(--hd-ink);
  background: var(--hd-sky-css);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "cv11", "ss01";
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hd-accent-ink); outline-offset: 2px; }
.hd-num { font-variant-numeric: tabular-nums; }

/* Layering: stage (WebGL) < pins (HTML markers) < ui (panels) < fade */
#hd-app { position: fixed; inset: 0; overflow: hidden; }
#hd-stage { position: absolute; inset: 0; background: var(--hd-sky-css); touch-action: none; }
#hd-stage canvas { display: block; width: 100%; height: 100%; outline: none; }
#hd-pins { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
#hd-ui { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
#hd-ui > * { pointer-events: auto; }
#hd-fade {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: var(--hd-sky-css); opacity: 0; transition: opacity 280ms var(--hd-ease);
}
#hd-fade.is-on { opacity: 1; }
.hd-noscript { position: absolute; inset: auto 0 50% 0; text-align: center; }

/* The LCARS app (src/lcars-*.js, lcars.css) is a separate front end: black page, condensed face. <html data-mode> is set
   by the inline script in shell.html. Everything else LCARS draws is inside .lc, so none of this leaks into the map themes. */
html[data-mode="lcars"], html[data-mode="lcars"] body { background: #000; }
html[data-mode="lcars"] body {
  color: #f6f0ff;
  font-family: "Antonio", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", "Liberation Sans Narrow", sans-serif;
  font-stretch: condensed;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
html[data-mode="lcars"] .hd-noscript { color: #f0a040; font-size: 20px; letter-spacing: .1em; text-transform: uppercase; }

/* Global red-alert mood: set on <html data-alert="red"> by the scene engine. Subtle. */
html[data-mode="scene"] #hd-app::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  box-shadow: inset 0 0 140px rgba(236, 90, 116, 0); transition: box-shadow 600ms ease;
}
html[data-mode="scene"][data-alert="red"] #hd-app::after { box-shadow: inset 0 0 160px rgba(236, 90, 116, 0.28); animation: hd-redalert 3.2s ease-in-out infinite; }
@keyframes hd-redalert { 50% { box-shadow: inset 0 0 110px rgba(236, 90, 116, 0.14); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
.hd-stage-error {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 36ch; margin: 0;
  padding: 16px 20px; border-radius: var(--hd-r-lg); background: var(--hd-glass); color: var(--hd-ink); text-align: center;
}
</style>
<style>/* ==== ui.css ==== */
/* HomeDeck UI panels (Agent B). Theme-independent; colors come from core.css tokens. */
/* Layout vars live on #hd-app so the scene's host view (#hd-hostview) can align with the panels too. */
#hd-app {
  --ui-l: calc(var(--hd-safe-l) + var(--hd-edge));
  --ui-r: calc(var(--hd-safe-r) + var(--hd-edge));
  --ui-t: calc(var(--hd-safe-t) + var(--hd-edge));
  --ui-b: calc(var(--hd-safe-b) + var(--hd-edge));
  --ui-bar-h: 56px;
  --ui-below: calc(var(--ui-t) + var(--ui-bar-h) + 12px);
  --ui-rcol-w: clamp(300px, 26vw, 360px);
  --ui-tl-w: clamp(280px, 25vw, 340px);
  --ui-ring: color-mix(in srgb, var(--hd-accent-ink) 55%, transparent);
}
#hd-ui {
  font-size: var(--hd-fs-md);
  color: var(--hd-ink);
}
#hd-ui > .hd-top, #hd-ui > .hd-rcol { pointer-events: none; }
.hd-top > *, .hd-rcol > * { pointer-events: auto; }

/* ---------- Shared primitives ---------- */
.hd-pill, .hd-panel, .hd-kpi, .hd-roundbtn {
  background: var(--hd-glass);
  -webkit-backdrop-filter: blur(var(--hd-blur)) saturate(1.6);
  backdrop-filter: blur(var(--hd-blur)) saturate(1.6);
  border: 1px solid var(--hd-glass-border);
  box-shadow: var(--hd-shadow);
}
.hd-visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.hd-i { display: block; flex: none; }
.hd-num { font-variant-numeric: tabular-nums; }
.hd-muted { color: var(--hd-ink-3); }
.hd-break { overflow-wrap: anywhere; }
.hd-clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
:where(#hd-ui) button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
#hd-ui :focus-visible { outline: 2px solid var(--hd-accent-ink); outline-offset: 2px; }
:where(#hd-ui) h2 { margin: 0; font-size: inherit; font-weight: 600; }
:where(#hd-ui) p { margin: 0; }

.is-ok   { --st: var(--hd-ok);   --st-bg: var(--hd-ok-bg);   --st-dot: var(--hd-ok-dot); }
.is-warn { --st: var(--hd-warn); --st-bg: var(--hd-warn-bg); --st-dot: var(--hd-warn-dot); }
.is-down { --st: var(--hd-down); --st-bg: var(--hd-down-bg); --st-dot: var(--hd-down-dot); }
.is-idle { --st: var(--hd-idle); --st-bg: var(--hd-idle-bg); --st-dot: var(--hd-idle-dot); }
.is-sky  { --st: var(--hd-ink);  --st-bg: color-mix(in srgb, var(--hd-sky) 38%, transparent); --st-dot: var(--hd-sky); }
.is-lilac{ --st: var(--hd-ink);  --st-bg: color-mix(in srgb, var(--hd-lilac) 38%, transparent); --st-dot: var(--hd-lilac); }

.hd-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-dot, var(--hd-idle-dot)); flex: none; }
.hd-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px;
  border-radius: var(--hd-r-pill); background: var(--st-bg); color: var(--st);
  font-size: var(--hd-fs-sm); font-weight: 600; white-space: nowrap;
}
.hd-chip-sm { height: 20px; font-size: var(--hd-fs-xs); padding: 0 8px 0 6px; gap: 5px; }
.hd-chip-sm .hd-dot { width: 6px; height: 6px; }
.hd-tag {
  display: inline-flex; align-items: center; height: 18px; padding: 0 7px; margin-left: 6px;
  border-radius: var(--hd-r-pill); background: var(--st-bg, var(--hd-glass-sunken)); color: var(--st, var(--hd-ink-2));
  font-size: var(--hd-fs-xs); font-weight: 600; vertical-align: 1px; white-space: nowrap;
}
.hd-mini { display: inline-flex; align-items: center; gap: 5px; color: var(--st); font-weight: 600; }
.hd-mini + .hd-mini { margin-left: 10px; }
.hd-mini .hd-dot { width: 6px; height: 6px; }

.hd-meter {
  --v: 0%;
  position: relative; display: block; height: 6px; border-radius: var(--hd-r-pill);
  background: var(--hd-glass-sunken); overflow: hidden;
}
.hd-meter > span {
  position: absolute; inset: 0 auto 0 0; width: var(--v); border-radius: inherit;
  background: linear-gradient(90deg, var(--hd-sky), var(--hd-lilac));
  transition: width 600ms var(--hd-ease);
}
.hd-meter.is-ok > span, .hd-meter.is-warn > span, .hd-meter.is-down > span { background: var(--st-dot); }

/* The one bold motif: an LCARS elbow (a bar that bends) in the panel's accent. */
.hd-elbow {
  --elbow: var(--hd-accent);
  position: relative; display: inline-block; flex: none;
  width: 26px; height: 16px; margin-right: 10px; vertical-align: -3px;
  border-top: 6px solid var(--elbow); border-left: 6px solid var(--elbow);
  border-top-left-radius: 13px;
}
.hd-elbow::after {
  content: ""; position: absolute; top: -6px; right: -3px; width: 6px; height: 6px;
  border-radius: 0 3px 3px 0; background: var(--elbow);
}
.hd-kpi .hd-elbow { --elbow: var(--hd-peach); }
.hd-tl .hd-elbow { --elbow: var(--hd-lilac); }
.hd-list .hd-elbow { --elbow: var(--hd-sky); }

.hd-iconbtn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  color: var(--hd-ink-2); position: relative; flex: none;
  transition: background 160ms ease, color 160ms ease;
}
.hd-iconbtn:hover { background: var(--hd-glass-sunken); color: var(--hd-ink); }
.hd-iconbtn .hd-i { width: 20px; height: 20px; }

.hd-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: var(--hd-r-pill); font-weight: 600; font-size: var(--hd-fs-md); text-decoration: none;
  color: var(--hd-ink); background: var(--hd-glass-sunken); border: 1px solid var(--hd-hairline);
  transition: background 160ms ease, transform 160ms var(--hd-ease);
}
#hd-ui .hd-btn { border: 1px solid var(--hd-hairline); }
.hd-btn:hover { background: var(--hd-glass-strong); }
.hd-btn:active { transform: scale(.97); }
.hd-btn-primary { background: var(--hd-accent); color: #1f1745; }
#hd-ui .hd-btn-primary { border-color: transparent; background: var(--hd-accent); }
.hd-btn-primary:hover { background: color-mix(in srgb, var(--hd-accent) 85%, white); }
.hd-btn[hidden] { display: none; }

/* ---------- Top bar ---------- */
.hd-top {
  position: absolute; z-index: 4; top: var(--ui-t); left: var(--ui-l); right: var(--ui-r);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.hd-pill {
  display: flex; align-items: center; gap: 6px; height: var(--ui-bar-h); padding: 0 8px;
  border-radius: var(--hd-r-xl);
}
.hd-top-l { padding-left: 16px; gap: 14px; min-width: 0; }
.hd-brand { display: flex; align-items: center; gap: 10px; flex: none; }
.hd-brand-name { font-weight: 700; font-size: var(--hd-fs-lg); letter-spacing: -0.01em; }
.hd-brand-mark {
  position: relative; width: 26px; height: 24px; flex: none;
  border-top: 7px solid var(--hd-peach); border-left: 7px solid var(--hd-peach); border-top-left-radius: 14px;
}
.hd-brand-mark::before {
  content: ""; position: absolute; left: 4px; bottom: 0; width: 14px; height: 6px; border-radius: var(--hd-r-pill);
  background: var(--hd-lilac);
}
.hd-brand-mark::after {
  content: ""; position: absolute; top: -7px; right: -4px; width: 7px; height: 7px; border-radius: 0 4px 4px 0;
  background: var(--hd-peach);
}

.hd-search { position: relative; display: flex; align-items: center; min-width: 0; }
.hd-search-field {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 12px;
  width: clamp(220px, 24vw, 340px); border-radius: var(--hd-r-pill);
  background: var(--hd-glass-sunken); border: 1px solid var(--hd-hairline); color: var(--hd-ink-3);
  transition: border-color 160ms ease, background 160ms ease;
}
.hd-search-field:focus-within { border-color: var(--hd-accent); background: var(--hd-glass-strong); }
.hd-search-field input {
  flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--hd-ink);
  font-size: var(--hd-fs-md);
}
.hd-search-field input::placeholder { color: var(--hd-ink-3); }
.hd-search-field input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
#hd-ui .hd-search-field input:focus-visible { outline: none; }
.hd-kbd {
  display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 7px;
  font: 600 var(--hd-fs-xs)/1 var(--hd-font); color: var(--hd-ink-2);
  background: var(--hd-glass-strong); border: 1px solid var(--hd-hairline);
}
.hd-search-field:focus-within .hd-kbd { opacity: 0; }
.hd-search-open, .hd-search-close { display: none; }

.hd-top-r { gap: 4px; }
.hd-menu-wrap { position: relative; }
.hd-tbtn {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 12px;
  border-radius: var(--hd-r-pill); font-weight: 600; white-space: nowrap;
  transition: background 160ms ease;
}
.hd-tbtn:hover, .hd-tbtn[aria-expanded="true"], .hd-iconbtn[aria-expanded="true"] { background: var(--hd-glass-sunken); }
.hd-chev { width: 16px; height: 16px; color: var(--hd-ink-3); transition: transform 200ms var(--hd-ease); }
[aria-expanded="true"] > .hd-chev { transform: rotate(180deg); }
.hd-hostbtn-c { color: var(--hd-ink-3); font-weight: 500; font-size: var(--hd-fs-sm); }
.hd-themebtn .hd-i:first-child { color: var(--hd-accent-ink); }

.hd-live {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; margin: 0 4px;
  border-left: 1px solid var(--hd-hairline); border-right: 1px solid var(--hd-hairline);
  font-size: var(--hd-fs-sm); color: var(--hd-ink-2); white-space: nowrap;
}
.hd-live-dot {
  position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--hd-ok-dot);
}

.hd-badge {

/* Popovers */
.hd-pop {

  padding: 6px; border-radius: var(--hd-r-lg);

}

.hd-bellpop { width: 360px; }

.hd-optlist { list-style: none; margin: 0; padding: 0; }

.hd-mi, .hd-opt {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 7px 10px;

}

.hd-mi-ic, .hd-opt-ic {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; flex: none;
  background: var(--st-bg, var(--hd-glass-sunken)); color: var(--st, var(--hd-ink-2)); align-self: flex-start;
}

.hd-opt-tag { flex: none; font-size: var(--hd-fs-xs); color: var(--hd-ink-3); }
.hd-opt-empty, .hd-mi-empty { padding: 12px; color: var(--hd-ink-2); font-size: var(--hd-fs-sm); }
.hd-mgroup { padding: 10px 10px 4px; font-size: var(--hd-fs-xs); font-weight: 600; color: var(--hd-ink-3); }
.hd-mgroup:first-child { padding-top: 6px; }
.hd-mi-foot { padding: 10px; margin-top: 4px; border-top: 1px solid var(--hd-hairline); font-size: var(--hd-fs-sm); color: var(--hd-ink-2); }

/* ---------- KPI cards ---------- */
.hd-kpis {
  position: absolute; z-index: 1; top: var(--ui-below); left: var(--ui-l);
  display: flex; gap: 12px;
  width: min(672px, calc(100vw - var(--ui-rcol-w) - 120px));
}

}

.hd-kpi-h .hd-elbow { width: 20px; height: 13px; border-width: 5px; margin-right: 8px; vertical-align: 0; }

.hd-kpi-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-top: 2px; }
.hd-kpi-v { display: flex; align-items: baseline; white-space: nowrap; }
.hd-big { font-size: var(--hd-fs-2xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.hd-kpi-of { font-size: var(--hd-fs-lg); font-weight: 600; color: var(--hd-ink-3); margin-left: 1px; }

.hd-delta {

}
.hd-delta-l { font-weight: 500; color: var(--hd-ink-3); margin-left: 2px; }
.hd-delta.is-bad { color: var(--hd-down); }
.hd-delta.is-good { color: var(--hd-ok); }
.hd-delta.is-meh { color: var(--hd-warn); }

/* ---------- Panels ---------- */
.hd-panel { border-radius: var(--hd-r-xl); display: flex; flex-direction: column; min-height: 0; }
.hd-ph { display: flex; align-items: center; gap: 0; padding: 14px 16px 8px; font-size: var(--hd-fs-md); }
.hd-ph h2 { font-weight: 600; }

/* Timeline (stepper) */
.hd-tl {
  position: absolute; z-index: 1; left: var(--ui-l); bottom: var(--ui-b); width: var(--ui-tl-w);

}
.hd-steps { list-style: none; margin: 0; padding: 2px 8px 10px; overflow: auto; min-height: 0; }

}

.hd-step-meta span:not(:empty) + time::before { content: ""; display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: currentColor; margin-right: 8px; vertical-align: 3px; opacity: .6; }
.is-new { animation: hd-new-in 700ms var(--hd-ease); }

.hd-empty { display: flex; gap: 12px; align-items: flex-start; padding: 14px 12px; color: var(--hd-ink-2); font-size: var(--hd-fs-sm); }
.hd-empty strong { color: var(--hd-ink); }
.hd-empty-ic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; flex: none; background: var(--st-bg); color: var(--st); }
.hd-empty-ic .hd-i { width: 16px; height: 16px; }

/* Right column */
.hd-rcol {
  position: absolute; z-index: 2; top: var(--ui-below); right: var(--ui-r); bottom: var(--ui-b); width: var(--ui-rcol-w);
  display: flex; flex-direction: column; gap: 12px;
}

/* Inventory list */
.hd-list { flex: 0 1 auto; margin-top: auto; min-height: 58px; max-height: min(460px, 100%); overflow: hidden; }
.hd-list-h { padding: 10px 10px 6px 16px; }
.hd-tabs { display: flex; gap: 2px; flex: 1; min-width: 0; padding: 3px; border-radius: var(--hd-r-pill); background: var(--hd-glass-sunken); }
.hd-tab {

  border-radius: var(--hd-r-pill); font-size: var(--hd-fs-sm); font-weight: 600; color: var(--hd-ink-2); white-space: nowrap;

}

}

.hd-rows { list-style: none; margin: 0; padding: 0; }
.hd-group { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 10px 4px; font-size: var(--hd-fs-xs); color: var(--hd-ink-3); }

.hd-row {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 7px 8px 7px 10px;
  border-radius: var(--hd-r-md); transition: background 140ms ease;
}

.hd-row-t { font-weight: 600; font-size: var(--hd-fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd-row-s { font-size: var(--hd-fs-sm); color: var(--hd-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd-row-s.hd-clamp2 { white-space: normal; }
.hd-row-s.is-warn, .hd-row-s.is-down { color: var(--st); }
.hd-row-end { flex: none; display: flex; align-items: center; }
.hd-row-metric, .hd-row-time { font-size: var(--hd-fs-sm); color: var(--hd-ink-2); }
.hd-row-metric { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; max-width: 110px; }
.hd-row-metric .hd-num { font-weight: 600; color: var(--hd-ink); }

.hd-row-ic { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; flex: none; background: var(--st-bg, var(--hd-glass-sunken)); color: var(--st, var(--hd-ink-2)); align-self: flex-start; }
.hd-row-ic .hd-i { width: 17px; height: 17px; }
.hd-row-host, .hd-row-alert { align-items: flex-start; }
.hd-row-host .hd-row-end, .hd-row-alert .hd-row-end, .hd-row-host .hd-row-chev, .hd-row-alert .hd-row-chev { margin-top: 6px; }

.hd-row-host .hd-tag { display: block; flex: 0 1 auto; min-width: 0; line-height: 18px; overflow: hidden; text-overflow: ellipsis; }
.hd-row-up { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; padding-left: 8px; font-size: var(--hd-fs-sm); font-weight: 600; color: var(--st); white-space: nowrap; }

.hd-mm { display: grid; grid-template-columns: 50px 1fr 76px; align-items: center; gap: 8px; font-size: var(--hd-fs-xs); color: var(--hd-ink-2); }

/* Detail card */
.hd-detail {

  padding: 16px 16px 14px 40px;
}

.hd-detail.is-enter { animation: hd-detail-in 320ms var(--hd-ease); }
@keyframes hd-detail-in { from { opacity: 0; transform: translateX(16px); } }
/* LCARS rail: an elbow bar that runs down the card's left side, tinted by status */
.hd-detail-rail {
  position: absolute; left: 12px; top: 16px; bottom: 16px; width: 30px; pointer-events: none;
  border-left: 8px solid var(--elbow); border-top: 8px solid var(--elbow); border-bottom: 8px solid var(--elbow);
  border-radius: 18px 0 0 18px;
  transition: border-color 400ms ease;
}
.hd-detail-rail::before, .hd-detail-rail::after {
  content: ""; position: absolute; right: -4px; width: 8px; height: 8px; border-radius: 0 4px 4px 0; background: var(--elbow);
}
.hd-detail-rail::before { top: -8px; }
.hd-detail-rail::after { bottom: -8px; }
.hd-detail-h { display: flex; align-items: flex-start; gap: 8px; padding-left: 12px; }
.hd-detail-title { flex: 1; min-width: 0; padding-top: 2px; }

#hd-ui .hd-detail-title h2 { font-weight: 700; }
.hd-detail-sub { color: var(--hd-ink-3); font-size: var(--hd-fs-sm); margin-top: 2px; }
.hd-detail-x { margin: -4px -6px 0 0; }
.hd-detail-body { display: flex; flex-direction: column; gap: 14px; padding: 12px 0 0 12px; }
.hd-d-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.hd-d-status .hd-tag { margin-left: 0; height: 24px; padding: 0 9px; font-size: var(--hd-fs-sm); }
.hd-d-reason { flex-basis: 100%; padding: 8px 10px; border-radius: var(--hd-r-md); background: var(--st-bg); color: var(--st); font-size: var(--hd-fs-sm); font-weight: 500; }
.hd-d-desc { flex-basis: 100%; color: var(--hd-ink-2); font-size: var(--hd-fs-sm); }
.hd-d-metrics { padding: 12px 14px; border-radius: var(--hd-r-lg); background: var(--hd-glass-sunken); }
.hd-hero { display: flex; flex-direction: column; }
.hd-hero-v { font-size: var(--hd-fs-2xl); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.hd-hero-v small { font-size: var(--hd-fs-md); color: var(--hd-ink-3); font-weight: 600; margin-left: 3px; }
.hd-hero-l { font-size: var(--hd-fs-sm); color: var(--hd-ink-2); }
.hd-mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--hd-hairline); }
.hd-mgrid dt, .hd-sgrid dt, .hd-kv dt { font-size: var(--hd-fs-xs); color: var(--hd-ink-3); }
.hd-mgrid dd, .hd-sgrid dd { margin: 0; font-weight: 600; font-size: var(--hd-fs-md); }
.hd-mgrid dd small, .hd-sgrid dd small { color: var(--hd-ink-3); font-weight: 500; font-size: var(--hd-fs-sm); margin-left: 2px; }
.hd-sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin: 0; }
.hd-sgrid .hd-meter { margin-top: 6px; height: 5px; }
.hd-kv { margin: 0; display: grid; gap: 8px; }
.hd-kv > div { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: baseline; }
.hd-kv dd { margin: 0; font-size: var(--hd-fs-sm); min-width: 0; }
.hd-ports { display: flex; flex-wrap: wrap; gap: 4px; }
.hd-port { height: 22px; padding: 0 8px; border-radius: var(--hd-r-pill); background: var(--hd-glass-sunken); border: 1px solid var(--hd-hairline); display: inline-flex; align-items: center; font-size: var(--hd-fs-xs); font-weight: 500; }
.hd-link { color: var(--hd-accent-ink); font-weight: 500; text-decoration: none; }
.hd-link:hover { text-decoration: underline; }
#hd-ui .hd-linkbtn { color: var(--hd-accent-ink); font-weight: 600; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--hd-accent-ink) 35%, transparent); text-underline-offset: 3px; }
.hd-detail-f { display: flex; gap: 8px; padding: 14px 0 0 12px; flex-wrap: wrap; }
/* Detail extras from the live collector: containers, health checks, recent logs */
.hd-d-sec { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hd-d-h { display: flex; align-items: baseline; gap: 8px; margin: 0; font-size: var(--hd-fs-sm); font-weight: 600; color: var(--hd-ink); }
.hd-d-hm { margin-left: auto; font-size: var(--hd-fs-xs); font-weight: 500; color: var(--hd-ink-3); }
.hd-d-note { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--hd-r-md); background: var(--hd-glass-sunken); color: var(--hd-ink-3); font-size: var(--hd-fs-sm); }
.hd-d-spin { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 2px solid var(--hd-hairline); border-top-color: var(--hd-accent-ink); animation: hd-spin 900ms linear infinite; }
@keyframes hd-spin { to { transform: rotate(360deg); } }
.hd-cts { list-style: none; margin: 0; padding: 4px; display: flex; flex-direction: column; gap: 2px; border-radius: var(--hd-r-md); background: var(--hd-glass-sunken); }

.hd-ct + .hd-ct, .hd-ck + .hd-ck { box-shadow: 0 -1px 0 var(--hd-hairline); }
.hd-ct-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

<style>/* ==== scene.css ==== */
/* HomeDeck scene layer (Agent A): HTML map pins over the WebGL stage. */
.hd-pin {
  position: absolute; left: 0; top: 0; width: 0; height: 0; margin: 0; padding: 0; border: 0;
  background: none; color: inherit; pointer-events: none; cursor: pointer;
  transform: translate3d(-200px, -200px, 0); will-change: transform; contain: layout style;
  --pin-ring: var(--hd-ok-dot);

.hd-pin[data-status="down"] { --pin-ring: var(--hd-down-dot); }
.hd-pin:focus-visible { outline: none; }

.hd-pin__wrap {
  position: absolute; left: 0; bottom: 0; display: block; padding: 4px 4px 0;
  pointer-events: auto; touch-action: none; transform: translate(-50%, 0);
  animation: hd-pin-bob 3.6s ease-in-out infinite; animation-delay: var(--hd-pin-delay, 0s);
}
@keyframes hd-pin-bob { 50% { transform: translate(-50%, -3px); } }

.hd-pin__head {
  position: relative; display: grid; place-items: center; width: 28px; height: 28px; margin: 0 auto 6px;
  border-radius: 50% 50% 50% 5px; transform: rotate(-45deg);
  background: var(--hd-glass-strong); border: 2px solid var(--pin-ring);
  box-shadow: 0 6px 14px -6px rgba(30, 24, 90, 0.55), 0 1px 2px rgba(30, 24, 90, 0.18);
  transition: transform 220ms var(--hd-ease), width 220ms var(--hd-ease), height 220ms var(--hd-ease),
    background-color 200ms ease, border-color 200ms ease, opacity 200ms ease;
}
.hd-pin__icon {
  width: 15px; height: 15px; transform: rotate(45deg); fill: none; stroke: var(--hd-ink);
  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: opacity 160ms ease;
}
.hd-pin__label {
  position: absolute; left: calc(50% + 17px); top: 4px; display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px 3px 8px; border-radius: var(--hd-r-pill); white-space: nowrap;
  background: var(--hd-glass-strong); color: var(--hd-ink); box-shadow: var(--hd-shadow-sm);
  font-size: var(--hd-fs-xs); font-weight: 600; line-height: 16px; letter-spacing: 0.01em;
  opacity: 0; transform: translateX(-4px); pointer-events: none;
  transition: opacity 180ms ease, transform 220ms var(--hd-ease);

.hd-pin__dot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--pin-ring); flex: none; }
.hd-pin[data-status="degraded"] .hd-pin__dot, .hd-pin[data-status="down"] .hd-pin__dot { display: block; }

.hd-pin.is-hover .hd-pin__label, .hd-pin.is-selected .hd-pin__label, .hd-pin:focus-visible .hd-pin__label,
.hd-pin[data-status="degraded"] .hd-pin__label, .hd-pin[data-status="down"] .hd-pin__label { opacity: 1; transform: none; }

.hd-pin.is-hover .hd-pin__head { transform: rotate(-45deg) scale(1.1); }
.hd-pin:focus-visible .hd-pin__head { outline: 2px solid var(--hd-accent-ink); outline-offset: 3px; }

.hd-pin.is-selected .hd-pin__icon { stroke: #fff; }
.hd-pin.is-selected .hd-pin__label { left: calc(50% + 20px); }

#hd-pins.is-mini .hd-pin.is-selected .hd-pin__label, #hd-pins.is-mini .hd-pin.is-hover .hd-pin__label { left: calc(50% + 17px); }

@media (prefers-reduced-motion: reduce) {

.hd-pin__count { display: none; margin-left: 2px; padding-left: 7px; border-left: 1px solid var(--hd-hairline); color: var(--hd-ink-2); font-weight: 600; }

#hd-pins.is-mini .hd-pin--host .hd-pin__head { width: 30px; height: 30px; margin-bottom: 6px; background: var(--hd-glass-strong); border-color: var(--pin-ring); }
#hd-pins.is-mini .hd-pin--host .hd-pin__icon { opacity: 1; }
.hd-pin--host .hd-pin__head { width: 30px; height: 30px; }
.hd-pin--host.is-hover .hd-pin__label { box-shadow: 0 0 0 2px var(--pin-ring), var(--hd-shadow-sm); }
html[data-hostview] #hd-pins { opacity: 0; transition: opacity 200ms ease; }

/* Host view container (theme.hostView). Sits over the scene in the space the secondary panels leave,
   under the top bar and the right column (detail card + list). */
.hd-hostview {
  position: absolute; z-index: 1;
  top: var(--ui-below, 84px); left: var(--ui-l, 16px); bottom: var(--ui-b, 16px);
  right: calc(var(--ui-r, 16px) + var(--ui-rcol-w, 340px) + 14px);

.hd-pin.is-flip .hd-pin__label, #hd-pins.is-mini .hd-pin.is-flip .hd-pin__label,
.hd-pin--host.is-flip .hd-pin__label, #hd-pins.is-mini .hd-pin--host.is-flip .hd-pin__label { left: auto; right: calc(50% + 19px); }

  position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; color: var(--lc-ink); font-family: var(--lc-font);
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));

  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* search */
.lc-search { position: relative; flex: 0 1 400px; min-width: 220px; display: flex; height: 34px; }
.lc-search-l { flex: none; display: flex; align-items: center; gap: 7px; padding: 0 12px 0 18px; border-radius: 17px 0 0 17px; background: var(--lc-3); color: #000;

.lc-q-pop { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; width: max(100%, 440px); max-width: calc(100vw - 20px); max-height: min(60vh, 440px); overflow: auto;
  margin: 0; padding: 6px 6px 10px; list-style: none; background: #000; border: 2px solid var(--lc-5); border-radius: 0 0 0 22px; box-shadow: 0 18px 40px rgba(0, 0, 0, .8); }

.lc-opt { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 4px 10px; border-left: 6px solid transparent; cursor: pointer; }

.lc-opt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---------------------------------------------------------------- frame: rail */

.lc-nb.is-down { --c: var(--lc-down); }

.lc-key-fill { flex: 1 1 auto; min-height: 40px; display: flex; align-items: flex-start; padding: 8px; overflow: hidden; background: var(--lc-5); }
.lc-inset { width: 100%; max-height: 100%; background: #000; border-radius: 0 0 0 14px; padding: 2px; }
.lc-inset text { font-family: var(--lc-font); }
.lc-in-title { fill: var(--lc-or); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
.lc-in-oval { fill: none; stroke: var(--lc-2); stroke-width: 1.4; }
.lc-in-br { fill: none; stroke: var(--lc-2); stroke-width: 2.2; }
.lc-in-ship { fill: none; stroke: var(--lc-line); stroke-width: 1; vector-effect: non-scaling-stroke; }

.lc-in-v { fill: var(--lc-ink); font-size: 11px; font-weight: 600; }

/* ---------------------------------------------------------------- frame: main + bottom */

.lc-out { --c: var(--lc-2); flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px;
  background: color-mix(in srgb, var(--c) 22%, transparent); border-left: 6px solid var(--c); }
.lc-out > span { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); filter: brightness(1.15); white-space: nowrap; }
.lc-out > b { font-size: 16px; font-weight: 600; letter-spacing: .03em; color: var(--lc-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }

.lc-out.is-down > b { color: var(--lc-down); }
.lc-l-short { display: none; }
.lc-standby { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.lc-standby b { font-size: 26px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--lc-or); animation: lc-pulse 1.4s ease-in-out infinite; text-align: center; }
.lc-standby-bars { display: flex; gap: var(--gap); }

.lc-standby-bars i:nth-child(2) { animation-delay: .15s; background: var(--lc-6); } .lc-standby-bars i:nth-child(3) { animation-delay: .3s; background: var(--lc-3); }
.lc-standby-bars i:nth-child(4) { animation-delay: .45s; background: var(--lc-4); } .lc-standby-bars i:nth-child(5) { animation-delay: .6s; background: var(--lc-1); }

/* ---------------------------------------------------------------- list screens (shared) */

.lc-sh::before { content: ""; flex: none; width: 40px; height: 100%; border-radius: 14px 0 0 14px; background: var(--lc-2); }

.lc-sh span { order: 1; font-size: 20px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--lc-or); }

.lc-rows { display: flex; flex-direction: column; gap: 4px; }

/* systems table */
.lc-table { display: flex; flex-direction: column; }
.lc-tr { display: grid; grid-template-columns: 38px minmax(170px, 2.2fr) minmax(90px, .9fr) minmax(120px, 1.3fr) minmax(120px, 1.4fr) 62px minmax(96px, 1fr) 104px;
  align-items: center; gap: 12px; min-height: 48px; padding: 4px 12px 4px 10px; border-left: 8px solid var(--lc-2); text-decoration: none; }
.lc-tbody { display: flex; flex-direction: column; gap: 3px; }

.lc-tbody .lc-tr:hover { background: rgba(204, 153, 204, .14); }
.lc-tr.is-warn { border-left-color: var(--lc-warn); } .lc-tr.is-down { border-left-color: var(--lc-down); }
.lc-tr.is-ph { opacity: .78; }

.lc-th span { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--lc-or); }
.lc-tr > span { min-width: 0; }
.lc-tbody .c-n { font-size: 18px; font-weight: 600; color: var(--lc-or); }

.c-name small, .c-ship small { display: block; font-size: 12.5px; letter-spacing: .04em; color: var(--lc-ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.c-st { justify-self: end; }

/* alerts */
.lc-arow { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto 90px; align-items: center; gap: 14px; min-height: 54px; padding: 4px 14px 4px 0;
  background: rgba(255, 255, 255, .045); text-decoration: none; }

.lc-sev { align-self: stretch; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; background: var(--lc-warn); color: #000; font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

.lc-ar-main { min-width: 0; display: flex; flex-direction: column; }

.lc-ar-t { justify-self: end; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--lc-ink); }

/* log */

.lc-ev { --k: var(--lc-1); display: grid; grid-template-columns: 76px 112px minmax(0, 1fr) minmax(120px, 200px); align-items: center; gap: 14px; min-height: 46px;
  padding: 3px 14px 3px 0; background: rgba(255, 255, 255, .04); text-decoration: none; }

.lc-ev.is-restart { --k: var(--lc-6); } .lc-ev.is-deploy { --k: var(--lc-or); } .lc-ev.is-ok { --k: var(--lc-2); }
.lc-ev.is-warn { --k: var(--lc-warn); } .lc-ev.is-down { --k: var(--lc-down); } .lc-ev.is-info, .lc-ev.is-idle { --k: var(--lc-1); }
.lc-ev-t { display: flex; flex-direction: column; align-items: flex-end; font-size: 17px; font-weight: 600; line-height: 1.1; color: var(--lc-ink); }

.lc-kind { align-self: stretch; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 15px 0 0 15px; background: var(--k); color: #000;
  font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

.lc-ev-m { font-size: 16px; letter-spacing: .03em; color: var(--lc-ink); overflow-wrap: anywhere; }
.lc-ev-s { min-width: 0; display: flex; flex-direction: column; align-items: flex-end; text-align: right; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--lc-or); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc-ev-s small { font-size: 11.5px; color: var(--lc-ink2); letter-spacing: .1em; }

/* ops */
.lc-ops { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px 22px; align-items: start; }
.lc-panel { display: flex; flex-direction: column; gap: 12px; padding: 0 0 14px 16px; border-left: 10px solid var(--lc-2); border-bottom: 2px solid #2a1830; border-radius: 0 0 0 22px; min-width: 0; }
.lc-panel.is-warn { border-left-color: var(--lc-warn); } .lc-panel.is-down { border-left-color: var(--lc-down); }
.lc-panel-k { border-left-color: var(--lc-6); }
.lc-ph { display: flex; align-items: center; gap: 10px; height: 30px; margin: 0 0 0 -16px; padding-left: 16px; background: var(--lc-5); font-weight: 400; min-width: 0; }
.lc-ph span { font-size: 19px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--lc-ink); white-space: nowrap; }
.lc-ph small { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--lc-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc-ph-go { align-self: stretch; display: flex; align-items: center; padding: 0 14px; border-radius: 0 15px 15px 0; background: var(--lc-3); color: #000 !important; font-size: 14px; font-weight: 700; letter-spacing: .1em; text-decoration: none; }
.lc-ph-go:hover { filter: brightness(1.12); }
.lc-meters { display: flex; flex-direction: column; gap: 8px; }
.lc-mrow { display: grid; grid-template-columns: 66px minmax(0, 1fr) 64px; grid-template-areas: "l m v" ". s s"; align-items: center; column-gap: 10px; }
.lc-ml { grid-area: l; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--lc-or); }
.lc-mrow .lc-meter { grid-area: m; }
.lc-mv { grid-area: v; justify-self: end; font-size: 18px; font-weight: 600; white-space: nowrap; }
.lc-ms { grid-area: s; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--lc-ink2); }
.lc-meter { --c: var(--lc-2); position: relative; display: block; height: 14px;
  background: repeating-linear-gradient(90deg, #2a1830 0 9px, transparent 9px 12px); }
.lc-meter i { display: block; height: 100%; width: var(--v); background: repeating-linear-gradient(90deg, var(--c) 0 9px, transparent 9px 12px); transition: width 600ms ease; }
.lc-meter.is-warn { --c: var(--lc-warn); } .lc-meter.is-down { --c: var(--lc-down); }
.lc-panel-k .lc-meter { --c: var(--lc-3); height: 18px; }
.lc-panel-k .lc-meter.is-warn { --c: var(--lc-warn); } .lc-panel-k .lc-meter.is-down { --c: var(--lc-down); }
.lc-tally { display: flex; flex-wrap: wrap; gap: var(--gap); }
.lc-tally span { --c: var(--lc-2); flex: 1 1 0; min-width: 80px; display: flex; flex-direction: column; padding: 4px 10px; border-left: 6px solid var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
  font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.lc-tally span b { font-size: 20px; font-weight: 600; letter-spacing: .04em; color: var(--lc-ink); }
.lc-tally .is-warn { --c: var(--lc-1); } .lc-tally .is-down { --c: var(--lc-1); }
.lc-tally .is-warn.is-on { --c: var(--lc-warn); } .lc-tally .is-down.is-on { --c: var(--lc-down); }
.lc-facts { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }

.lc-none { margin: 4px 0 0; padding: 12px 14px; border-left: 6px solid var(--lc-1); background: rgba(255, 255, 255, .05); font-size: 18px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--lc-ink2); }

/* ---------------------------------------------------------------- ship screen (MSD) */
.lc-ship { flex: 1; min-width: 0; min-height: 0; display: flex; }

/* compartments */

.lc-co:hover .lc-co-svc, .lc-co.is-hover .lc-co-svc, .lc-co.is-selected .lc-co-svc { fill: #fff; text-decoration: underline; }
/* systems list (compact) and auxiliary bays (desktop) */

  background: rgba(255, 255, 255, .05); color: var(--lc-ink); text-align: left; }

.lc-row-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lc-row-room { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--lc-or); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.lc-row-m { font-size: 13px; color: var(--lc-ink2); text-align: right; max-width: 42%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .04em; }

.lc-row.is-warn .lc-row-m { color: var(--lc-warn); } .lc-row.is-down .lc-row-m { color: var(--lc-down); }

/* ---------------------------------------------------------------- service detail panel */
.lc-det { --st: var(--lc-ok); flex: 0 0 0px; min-width: 0; display: flex; overflow: hidden; transition: flex-basis 300ms ease; }
.lc-det[data-status="degraded"] { --st: var(--lc-warn); } .lc-det[data-status="down"] { --st: var(--lc-down); }
.lc-ship.has-det .lc-det { flex-basis: clamp(330px, 34%, 480px); }

  opacity: 0; transform: translateX(28px); transition: opacity 180ms ease, transform 300ms ease; }
.lc-ship.has-det .lc-det-in { opacity: 1; transform: none; transition: opacity 240ms ease 60ms, transform 300ms ease; }
.lc-det-head { flex: none; display: flex; gap: var(--gap); height: 30px; }

.lc-det-cap { flex: none; width: 30px; border-radius: 0 15px 15px 0; background: var(--st); }
.lc-det-name { flex: none; margin: 2px 0 0; font-size: 30px; line-height: 1.05; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--lc-or); overflow-wrap: anywhere; }

.lc-det-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px; padding-right: 4px;
  scrollbar-width: thin; scrollbar-color: var(--lc-5) transparent; padding-bottom: 12px;
  -webkit-mask-image: linear-gradient(#000 calc(100% - 14px), transparent); mask-image: linear-gradient(#000 calc(100% - 14px), transparent); }
.lc-det-st { flex: none; display: flex; flex-direction: column; gap: 3px; padding: 8px 14px; border-left: 10px solid var(--st); border-radius: 0 18px 18px 0;
  background: color-mix(in srgb, var(--st) 18%, transparent); }
.lc-det-st b { font-size: 21px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--st); line-height: 1.1; }
.lc-det[data-status="down"] .lc-det-st b { animation: lc-blink 1s steps(2, start) infinite; }
.lc-det-st p { margin: 0; font-size: 14.5px; line-height: 1.3; letter-spacing: .03em; color: var(--lc-ink); }
.lc-det-desc { flex: none; margin: 0; font-size: 14.5px; line-height: 1.35; letter-spacing: .03em; color: var(--lc-ink2); }
.lc-det-outs { flex: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: var(--gap); }
.lc-det-kv { flex: none; margin: 0; display: grid; gap: 7px; }
.lc-det-kv > div { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: baseline; }
.lc-det-kv dt { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--lc-or); }
.lc-det-kv dd { margin: 0; min-width: 0; font-size: 15px; letter-spacing: .03em; color: var(--lc-ink); }
.lc-break { overflow-wrap: anywhere; }
.lc-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.lc-pill { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 11px; background: var(--lc-6); color: #000; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
.lc-det-muted { color: var(--lc-ink2); }
.lc-det-link { color: var(--lc-4) !important; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--lc-4) 45%, transparent); text-underline-offset: 3px; }
.lc-det-link:hover { color: #fff !important; }
.lc-det-acts { flex: none; order: 10; display: flex; gap: var(--gap); }
.lc-det-sec { flex: none; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lc-det-sh { display: flex; align-items: center; gap: 8px; margin: 2px 0 0; height: 20px; font-weight: 400; }
.lc-det-sh::before { content: ""; flex: none; width: 26px; height: 14px; border-radius: 7px 0 0 7px; background: var(--lc-6); }
.lc-det-sh span { font-size: 12.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--lc-or); }
.lc-det-sh b { margin-left: auto; font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--lc-ink2); }
.lc-cts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.lc-ct { --t: var(--lc-2); display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 3px 10px; border-left: 6px solid var(--t); background: rgba(255, 255, 255, .05); }
.lc-ct.is-warn { --t: var(--lc-warn); } .lc-ct.is-down { --t: var(--lc-down); } .lc-ct.is-idle { --t: var(--lc-1); }
.lc-ct-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lc-ct-n { font-size: 14.5px; font-weight: 600; letter-spacing: .03em; color: var(--lc-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc-ct-sub { font-size: 12px; letter-spacing: .05em; color: var(--lc-ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc-ct-chips { flex: none; display: flex; gap: 4px; }
.lc-ck-end { flex: none; display: flex; flex-direction: column; align-items: flex-end; max-width: 48%; }
.lc-tag { padding: 1px 8px; border-radius: 9px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: rgba(204, 153, 204, .22); color: var(--lc-ok); white-space: nowrap; }

.lc-det-more { align-self: flex-start; min-height: 30px; padding: 0 16px; border: 0; border-radius: 15px; cursor: pointer; background: var(--lc-5); color: var(--lc-ink);

.lc-btn { flex: 1; display: inline-flex; align-items: center; justify-content: flex-end; height: 44px; padding: 0 18px; border: 0; border-radius: 22px; cursor: pointer;

.lc-det-back { display: none; }
.lc-ship.has-det:not(.is-compact) [data-k="hw"], .lc-ship.has-det:not(.is-compact) [data-k="os"] { display: none; }

/* detail open on a wide screen: ship cropped to its outline, numbered systems list below, detail beside */
.lc-ship.has-det:not(.is-compact) .lc-callouts, .lc-ship.has-det:not(.is-compact) .lc-leaders { display: none; }
.lc-ship.has-det:not(.is-compact) .lc-msd { flex: none; margin: 18px 0 14px; }
.lc-ship.has-det:not(.is-compact) .lc-svg { height: auto; max-height: 34vh; }
.lc-ship.has-det:not(.is-compact) .lc-aux-h { display: none; }
.lc-ship.has-det:not(.is-compact) .lc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); align-content: start; gap: var(--gap); margin: 0; max-height: none; flex: 1 1 auto; }
.lc-ship.has-det:not(.is-compact) .lc-list li { display: block !important; }
.lc-ship.has-det:not(.is-compact) .lc-row { margin: 0; min-height: 44px; padding: 4px 10px; gap: 8px; }
.lc-ship.has-det:not(.is-compact) .lc-row-m { display: none; }
.lc-zoom { display: none; }

/* compact ship screen (narrow main area: phones, small tablets) */
.lc-ship.is-compact { flex-direction: column; flex: none; }
.lc-ship.is-compact .lc-callouts, .lc-ship.is-compact .lc-leaders, .lc-ship.is-compact .lc-view, .lc-ship.is-compact [data-k="hw"], .lc-ship.is-compact [data-k="os"] { display: none; }
.lc-ship.is-compact .lc-diag { flex: none; }

.lc-ship.is-compact .lc-list { display: block; flex: none; overflow: visible; }
.lc-ship.is-compact .lc-det { display: none; flex: none; overflow: visible; transition: none; scroll-margin-top: 6px; }

.lc-ship.is-compact .lc-det-acts { order: 0; }
.lc-ship.is-compact .lc-det-x { display: none; } .lc-ship.is-compact .lc-det-back { display: inline; }
.lc-ship.is-compact .lc-logs { max-height: 240px; }
.lc-ship.is-compact .lc-sub { align-items: center; }
.lc-ship.is-compact .lc-zoom { display: inline-flex; align-items: center; margin-left: auto; height: 32px; padding: 0 16px; border: 0; border-radius: 16px; background: var(--lc-5);
  color: var(--lc-ink); font-size: 14px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.lc-ship.is-compact.is-zoom .lc-zoom { background: var(--lc-3); color: #000; }
.lc-ship.is-compact.is-zoom .lc-svg { width: 240%; max-width: none; }

<script>/* ==== core.js ==== */
/* HomeDeck core: namespace, event bus, theme registry, shared utils.
   Loaded first. Everything else hangs off window.HomeDeck. */
(function () {
  'use strict';
  const HD = (window.HomeDeck = window.HomeDeck || {});
  HD.version = '1.0.0';

  /* ---------- Load timing (shown by the ?perf overlay) ---------- */
  HD.perf = {
    marks: [],
    mark(name) { const t = performance.now(); HD.perf.marks.push([name, t]); return t; },
    /** Time fn and record it as `name` (ms). */
    acc: {},
    info: {},
    /** Accumulate repeated work (e.g. every geometry weld) under one name; reset each scene build. */
    add(name, ms) { HD.perf.acc[name] = (HD.perf.acc[name] || 0) + ms; },
    time(name, fn) { const t0 = performance.now(); try { return fn(); } finally { HD.perf.marks.push([name, performance.now() - t0, 'dur']); } },
  };
  HD.perf.mark('js start');
  HD.build = HD.build || 'dev';      // stamped by tools/build.mjs (hash of all sources)

  /* ---------- Geometry cache (IndexedDB) ----------
     Themes can store finished, deterministic mesh buffers under a content signature and skip regenerating them on
     the next visit. Loaded once before the scene builds (get/put are synchronous against the in-memory map);
     new entries are written back after the build. Cleared automatically whenever the build id changes.
     ?nocache disables it. Any IndexedDB failure (private mode, quota) silently falls back to no cache. */
  HD.geoCache = (() => {
    const map = new Map(), dirty = new Map();
    let db = null;
    const enabled = !/[?&]nocache\b/.test(location.search) && !!window.indexedDB;
    const stats = { hits: 0, misses: 0 };
    function load(build) {
      if (!enabled) { HD.perf.info.cache = 'off'; return Promise.resolve(); }
      const t0 = performance.now();
      return new Promise(resolve => {
        const done = msg => { HD.perf.info.cache = msg; HD.perf.marks.push(['cache load', performance.now() - t0, 'dur']); resolve(); };
        let req;
        try { req = indexedDB.open('homedeck', 1); } catch (e) { done('unavailable'); return; }
        req.onupgradeneeded = () => { req.result.createObjectStore('geo'); req.result.createObjectStore('meta'); };
        req.onerror = () => done('unavailable');
        req.onsuccess = () => {
          db = req.result;
          try {
            const tx = db.transaction(['geo', 'meta'], 'readwrite'), geo = tx.objectStore('geo'), meta = tx.objectStore('meta');
            const m = meta.get('build');
            m.onsuccess = () => {
              if (m.result !== build) { geo.clear(); meta.put(build, 'build'); tx.oncomplete = () => done('empty (new build)'); return; }
              const ks = geo.getAllKeys();
              ks.onsuccess = () => {
                const vs = geo.getAll();
                vs.onsuccess = () => { ks.result.forEach((k, i) => map.set(k, vs.result[i])); done(`${map.size} meshes stored`); };
              };
            };
            tx.onerror = () => done('unavailable');
          } catch (e) { db = null; done('unavailable'); }
        };
      });
    }
    return {
      load,
      get(k) { const v = map.get(k); v ? stats.hits++ : stats.misses++; return v; },
      put(k, v) { map.set(k, v); dirty.set(k, v); },
      flush() {
        if (!db || !dirty.size) return;
        try { const st = db.transaction('geo', 'readwrite').objectStore('geo'); dirty.forEach((v, k) => st.put(v, k)); } catch (e) { /* ignore */ }
        dirty.clear();
      },
      stats,
    };
  })();

  /* ---------- Event bus ---------- */
  const handlers = new Map();
  HD.bus = {
    on(evt, fn) {
      if (!handlers.has(evt)) handlers.set(evt, new Set());
      handlers.get(evt).add(fn);
      return () => HD.bus.off(evt, fn);
    },
    off(evt, fn) { handlers.get(evt)?.delete(fn); },
    once(evt, fn) { const off = HD.bus.on(evt, p => { off(); fn(p); }); return off; },
    emit(evt, payload) {
      handlers.get(evt)?.forEach(fn => {
        try { fn(payload); } catch (e) { console.error('[HomeDeck bus]', evt, e); }
      });
    },
  };

  /* ---------- Theme registry ----------
     Two kinds of theme. A map theme (the default) builds the 3D scene and is drawn under the glass panels; it must
     implement THEMES.md. An app theme ({ kind: 'app' }) is a whole front end with its own DOM and routing (the LCARS
     display): it is only listed here so the theme menu offers it, and choosing it navigates to its URL. */
  const themes = new Map();
  const REQUIRED = ['palette', 'layout', 'buildService', 'buildHost', 'applyStatus', 'ambient'];
  const BOOT = window.HomeDeckBoot || { id: '', from: '', mode: 'scene', slugs: {} };   // set by the inline script in shell.html
  HD.themes = {
    register(theme) {
      const missing = theme.kind === 'app' ? [] : REQUIRED.filter(k => !(k in theme));
      if (!theme.id || missing.length) {
        console.error('[HomeDeck] theme rejected, missing:', theme.id || '(no id)', missing);
        return;
      }
      themes.set(theme.id, theme);
    },
    get(id) { return themes.get(id); },
    list() { return [...themes.values()].map(t => ({ id: t.id, name: t.name, description: t.description || '', kind: t.kind || 'map' })); },
    /** First registered map theme: what "/" shows when nothing is saved. */
    get defaultId() { for (const t of themes.values()) if (t.kind !== 'app') return t.id; },
  };

  /* ---------- Theme URLs ----------
     /starbase, /ds9 and /lcars each open that theme directly. The slug table lives in the inline script in shell.html
     (it has to run before anything else); this is the runtime side: building URLs and keeping the address bar in sync. */
  const slugOf = id => Object.keys(BOOT.slugs).find(k => BOOT.slugs[k] === id) || '';
  const hasPathRoutes = () => /^https?:$/.test(location.protocol) && (location.pathname === '/' || /^\/(starbase|ds9|lcars)\/?$/.test(location.pathname));
  HD.route = {
    boot: BOOT,
    slugOf,
    /** Theme id the current address asks for ('' when it names none, e.g. "/"). */
    idFromLocation() {
      const m = /^\/(starbase|ds9|lcars)\/?$/.exec(location.pathname) || /[?&]theme=(starbase|ds9|lcars)(?:&|#|$)/.exec(location.search);
      return m ? BOOT.slugs[m[1]] : '';
    },
    /** URL for a theme, keeping other query flags (?perf, ?mock, ...). Path form where a server routes it, else ?theme=. */
    urlOf(id) {
      const slug = slugOf(id);
      const rest = location.search.replace(/([?&])theme=[^&#]*&?/, '$1').replace(/[?&]$/, '');
      if (!slug) return location.pathname + rest;
      if (hasPathRoutes()) return '/' + slug + rest;
      return location.pathname + (rest ? rest + '&' : '?') + 'theme=' + slug;
    },
    /** Point the address bar at a theme without reloading (push = new history entry, else replace). */
    set(id, push) {
      const url = HD.route.urlOf(id);
      if (url === location.pathname + location.search) return;
      try { history[push ? 'pushState' : 'replaceState']({ theme: id }, '', url); } catch (e) { /* sandboxed frames */ }
    },
  };

  /* ---------- Utils ---------- */
  const PREFIX = 'homedeck:';
  HD.util = {
    storage: {
      get(key, fallback = null) {
        try { const v = localStorage.getItem(PREFIX + key); return v == null ? fallback : JSON.parse(v); }
        catch (e) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; }
        catch (e) { return false; }
      },
    },
    clamp: (v, a, b) => Math.min(b, Math.max(a, v)),
    lerp: (a, b, t) => a + (b - a) * t,
    prefersDark: () => !!window.matchMedia?.('(prefers-color-scheme: dark)').matches,
    reducedMotion: () => !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches,
    escapeHtml: s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    /** 93784 -> "1d 2h" ; 3900 -> "1h 5m" ; 42 -> "42s" */
    fmtUptime(sec) {
      if (sec == null || sec <= 0) return '—';
      const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
      if (d) return `${d}d ${h}h`;
      if (h) return `${h}h ${m}m`;
      if (m) return `${m}m`;
      return `${Math.floor(sec)}s`;
    },
    /** MB -> "512 MB" / "1.4 GB" */
    fmtMem(mb) {
      if (mb == null) return '—';
      return mb >= 1024 ? `${(mb / 1024).toFixed(mb >= 10240 ? 0 : 1)} GB` : `${Math.round(mb)} MB`;
    },
    /** ms timestamp -> "just now" / "4m ago" / "3h ago" / "2d ago" */
    relTime(ts, now = Date.now()) {
      const s = Math.max(0, (now - ts) / 1000);
      if (s < 45) return 'just now';
      if (s < 3600) return `${Math.round(s / 60)}m ago`;
      if (s < 86400) return `${Math.round(s / 3600)}h ago`;
      return `${Math.round(s / 86400)}d ago`;
    },
    /** Kelvin-timeline stardate: year + fraction of year, e.g. 2026.7593 */
    stardate(date = new Date()) {
      const y = date.getFullYear();
      const start = new Date(y, 0, 1), end = new Date(y + 1, 0, 1);
      return (y + (date - start) / (end - start)).toFixed(2);
    },
  };
})();
</script>
<script>/* ==== data.js ==== */
/* HomeDeck data layer: live collector snapshots with a mock homelab fallback, behind HD.data.
   Consumers (scene, UI) only ever see Snapshot-shaped deep copies (see CONTRACT.md, LIVE_DATA.md).

   SOURCES
   - live: GET /api/homedeck.json (same origin; nginx proxies /api/ to the collector). start() probes it with
     a 2.5 s timeout. If it answers with a Snapshot, we poll every 5 s (30 s while the tab is hidden) and diff
     consecutive snapshots into Change objects: { kind:'status' } per service whose status changed,
     { kind:'event' } per event id not seen before, { kind:'alert' } per new or changed alert, and always
     { kind:'metrics' }. Three failed polls in a row drop back to mock.
   - mock: the simulated dataset below (mockSource.load / mockSource.tick). Used when the probe fails, when the
     page is opened from file:// (no API there), or with ?mock in the URL. While on mock we retry live every
     30 s and switch over, with a full snapshot notification, as soon as it answers.
   The mock dataset's placeholder host (enterprise-d) and its 4 placeholder services are appended to live
   snapshots so the DS9 theme keeps its docked Enterprise. HD.data.source says which one is showing. */

  // Numbers behind the metric tiles. walk: [step, min, max, decimals] for the 2 s jitter.
  const LIVE = {
    rpm: 1240, routers: 14, certsValid: 3, certsTotal: 3, sessions: 6, authRpm: 42,
    qpm: 284, blocklist: 1214503, ncUsers: 5, ncStorageTB: 1.84, streams: 2, libraryItems: 4812, transcodes: 1,

  const ZERO_WHEN_DOWN = { traefik: ['rpm'], 'oauth2-proxy': ['authRpm', 'sessions'], pihole: ['qpm'], jellyfin: ['streams', 'transcodes'],
    qbittorrent: ['down', 'up'], minecraft: ['players', 'tps'] };

  const REASONS = {
    down: { traefik: 'Traefik stopped: entrypoints :80/:443 are not listening', 'oauth2-proxy': 'oauth2-proxy crashed; protected routes return 502',

      minecraft: 'TPS dropped to 14.2 (chunk generation lag)', default: 'Health check slow (2.4 s); responding intermittently' },
  };
  const RESTART_CAUSES = ['health check failed', 'OOM-killed, restarted by Docker', 'restart policy: unless-stopped', 'manual restart via docker compose'];
  const PLAYERS = ['nova_kat', 'ensign_ro', 'pixelpaws', 'TheRealGeordi', 'bedrock_bea', 'quarkbar', 'mossy_tim', 'lt_yar'];
  const UPDATES = [['prowlarr', '2.0.6', 'Prowlarr'], ['radarr', '5.27.6', 'Radarr'], ['qbittorrent', '5.1.3', 'qBittorrent'],
    ['grafana', '12.1.2', 'Grafana'], ['uptime-kuma', '1.23.17', 'Uptime Kuma'], ['jellyfin', '10.10.8', 'Jellyfin'], ['sonarr', '4.0.16', 'Sonarr']];

  /* ---------------- State ---------------- */
  let state = null;      // { hosts, services, events, alerts, sim, live, dns, zfs, baseline, seq }
  const subs = new Set();
  let timer = null, lastTick = 0, nextNotableAt = 0;

  const svcById = id => state.services.find(s => s.id === id);
  const nextId = p => `${p}${++state.seq}`;

  function computeKpis() {
    const sv = state.services, { dns, zfs, baseline } = state;
    const up = sv.filter(s => s.status === 'healthy').length;
    const blockedPct = round((dns.blocked / Math.max(1, dns.queries)) * 100, 1);
    const usedPct = round((zfs.usedTB / zfs.sizeTB) * 100, 1);
    return {
      servicesTotal: sv.length, servicesUp: up,
      servicesDegraded: sv.filter(s => s.status === 'degraded').length, servicesDown: sv.filter(s => s.status === 'down').length,
      dnsQueries24h: Math.round(dns.queries), dnsBlocked24h: Math.round(dns.blocked), dnsBlockedPct: blockedPct,
      zfsUsedPct: usedPct, zfsUsedTB: round(zfs.usedTB, 2), zfsSizeTB: zfs.sizeTB, zfsHealth: zfs.health,
      deltas: { servicesUp: up - baseline.servicesUp, dnsBlockedPct: round(blockedPct - baseline.dnsBlockedPct, 1),
        zfsUsedPct: round(usedPct - baseline.zfsUsedPct, 1) },
    };
  }

  // Recompute everything derived: metrics, uptimes, host totals. Cheap; runs every tick.
  function derive(now) {
    const kpis = computeKpis();
    state.services.forEach(s => {
      s.uptimeSec = s.status === 'down' ? 0 : Math.floor((now - s.lastRestart) / S);
      s.metrics = METRICS[s.id] ? METRICS[s.id](state.live, kpis, state.zfs) : [];
    });
    state.hosts.forEach(h => {
      const mine = state.services.filter(s => s.host === h.id), cfg = HOSTS.find(x => x.id === h.id);
      h.cpu = round(cfg.osCpu + mine.reduce((a, s) => a + s.cpu, 0), 1);
      h.memUsedMB = Math.round(cfg.osMemMB + mine.reduce((a, s) => a + s.memMB, 0));
      h.uptimeSec = Math.floor((now - h.bootTs) / S);
    });
    return kpis;
  }

  /* ---------------- Mutations (shared by mock tick + simulate) ---------------- */
  function pushEvent(changes, e) {
    const svc = svcById(e.serviceId);
    const event = Object.assign({ id: nextId('e'), ts: Date.now(), serviceId: e.serviceId, hostId: svc ? svc.host : null }, e);
    state.events.unshift(event);
    if (state.events.length > MAX_EVENTS) state.events.length = MAX_EVENTS;
    changes.push({ kind: 'event', event });
    return event;
  }

  function syncAlert(changes, svc, prevReason) {
    const now = Date.now();
    const active = state.alerts.find(a => a.active && a.serviceId === svc.id);
    if (svc.status === 'healthy') {
      if (!active) return;
      active.active = false;
      active.resolvedAt = now;
      active.message = `Resolved: ${svc.name} recovered (${prevReason || active.message})`;
      changes.push({ kind: 'alert', alert: active });
      return;
    }
    const severity = svc.status === 'down' && svc.critical ? 'critical' : 'warning';
    const message = `${svc.name} ${svc.status}: ${svc.statusReason}`;
    if (active && active.severity === severity) { active.message = message; changes.push({ kind: 'alert', alert: active }); return; }
    if (active) { active.active = false; active.resolvedAt = now; changes.push({ kind: 'alert', alert: active }); }
    const alert = { id: nextId('a'), serviceId: svc.id, severity, message, ts: now, active: true };
    state.alerts.unshift(alert);
    while (state.alerts.length > MAX_ALERTS) {
      const i = state.alerts.map(a => a.active).lastIndexOf(false);
      if (i < 0) break;
      state.alerts.splice(i, 1);
    }
    changes.push({ kind: 'alert', alert });
  }

  // Single path for status transitions: updates service, emits status + event + alert changes.
  function setStatus(changes, svc, to, reason, opts = {}) {
    const from = svc.status, prevReason = svc.statusReason, sim = state.sim[svc.id];
    if (from === to && svc.statusReason === (reason || null)) return;
    svc.status = to;
    svc.statusReason = to === 'healthy' ? null : reason;
    if (to === 'down') { svc.cpu = 0; svc.memMB = 0; }
    else if (from === 'down') { svc.cpu = sim.cpuBase; svc.memMB = Math.round(sim.memBase * 0.7); }
    if (svc.id === 'zfs-tank') state.zfs.health = to === 'healthy' ? 'ONLINE' : to === 'down' ? 'FAULTED' : 'DEGRADED';
    if (from !== to) changes.push({ kind: 'status', serviceId: svc.id, from, to });
    const message = opts.message || (to === 'healthy' ? `${svc.name} recovered` : `${svc.name} ${to}: ${reason}`);
    pushEvent(changes, { kind: opts.eventKind || 'status', serviceId: svc.id, from, to, message });
    syncAlert(changes, svc, prevReason);
  }

  function restart(changes, svc, cause, now) {
    const sim = state.sim[svc.id];
    svc.lastRestart = now;
    sim.restoreAt = now + rand(5, 8) * S;
    sim.pinned = false;
    setStatus(changes, svc, 'down', 'Restarting…', { eventKind: 'restart', message: `${svc.name} restarted (${cause})` });
  }

  function jitterService(svc) {
    const sim = state.sim[svc.id];
    if (svc.status === 'down') return;
    svc.cpu = round(clamp(svc.cpu + (sim.cpuBase - svc.cpu) * 0.25 + rand(-0.3, 0.3) * Math.max(0.2, sim.cpuBase * 0.35), 0.05, 40), 1);
    const target = sim.memBase * (1 + rand(-0.015, 0.015));
    const cap = svc.memLimitMB ? svc.memLimitMB * 0.95 : Infinity;
    svc.memMB = Math.round(clamp(svc.memMB + (target - svc.memMB) * 0.3, 1, cap));
  }

  function jitterLive(dtSec) {
    const L = state.live, isDown = id => svcById(id).status === 'down';
    Object.entries(WALK).forEach(([k, [step, lo, hi, dec]]) => {
      const mean = LIVE[k];
      L[k] = round(clamp(L[k] + (mean - L[k]) * 0.15 + rand(-step, step), lo, hi), dec);
    });
    if (Math.random() < 0.03) L.players = clamp(L.players + (Math.random() < 0.5 ? -1 : 1), 0, L.maxPlayers);
    if (L.players > 10) L.tps = round(clamp(L.tps - 0.1, 19.8, 20), 2);
    Object.entries(ZERO_WHEN_DOWN).forEach(([id, keys]) => { if (isDown(id)) keys.forEach(k => { L[k] = 0; }); });
    L.ratio = round(L.ratio + L.up / 400000 * dtSec, 2);
    // DNS counters grow with the live query rate; block ratio wobbles around ~18.7%.
    const q = (L.qpm * dtSec) / 60;
    state.dns.queries += q;
    state.dns.blocked += q * rand(0.15, 0.225);
    // Finished downloads slowly fill the pool.
    if (!isDown('zfs-tank')) state.zfs.usedTB = Math.min(state.zfs.sizeTB, state.zfs.usedTB + (L.down * dtSec * 0.3) / 1e6);
  }

  /* ---------------- Mock source ---------------- */
  const mockSource = {
    id: 'mock',
    load(now) {
      const st = { seq: 100, sim: {}, live: clone(LIVE), events: [], alerts: [] };
      st.hosts = HOSTS.map(h => {

      st.baseline = { servicesUp: st.services.length, dnsBlockedPct: 18.1, zfsUsedPct: 61.8 };   // 24 h ago
      const ev = (ago, serviceId, kind, message, extra) => Object.assign({ id: `e${st.seq++}`, ts: now - ago, serviceId,
        hostId: SERVICES.find(s => s.id === serviceId).host, kind, message }, extra);
      st.events = [
        ev(12 * M, 'minecraft', 'info', 'nova_kat joined the Minecraft server (3/20 online)'),
        ev(48 * M, 'jellyfin', 'info', 'Jellyfin started 2 streams (1 transcoding to 1080p)'),
        ev(2 * H + 4 * M, 'radarr', 'status', 'Radarr degraded: DNS resolution failing for api.radarr.video (SERVFAIL via Pi-hole)', { from: 'healthy', to: 'degraded' }),
        ev(2 * H + 9 * M, 'pihole', 'info', 'Pi-hole logged repeated SERVFAIL answers from upstream for radarr.video'),
        ev(5 * H + 6 * M, 'traefik', 'restart', 'Traefik restarted (static config change: new entrypoint middleware)'),
        ev(9 * H + 21 * M, 'qbittorrent', 'restart', 'qBittorrent restarted (health check failed)'),

        ev(26 * H + 3 * M, 'sonarr', 'deploy', 'Sonarr updated to 4.0.15'),
        ev(30 * H + 12 * M, 'jellyfin', 'deploy', 'Jellyfin updated to 10.10.7'),
        ev(36 * H + 40 * M, 'prowlarr', 'status', 'Prowlarr recovered: all indexers responding', { from: 'degraded', to: 'healthy' }),
        ev(38 * H + 15 * M, 'prowlarr', 'status', 'Prowlarr degraded: 3 indexers unreachable (Cloudflare challenge)', { from: 'healthy', to: 'degraded' }),
        ev(44 * H + 10 * M, 'home-assistant', 'deploy', 'Home Assistant updated to 2025.9.4'),
      ];
      st.alerts = [
        { id: 'a1', serviceId: 'radarr', severity: 'warning', message: 'Radarr degraded: DNS resolution failing for api.radarr.video (SERVFAIL via Pi-hole)', ts: now - 2 * H - 4 * M, active: true },
        { id: 'a2', serviceId: 'prowlarr', severity: 'warning', message: 'Resolved: Prowlarr recovered (3 indexers unreachable)', ts: now - 38 * H - 15 * M, active: false, resolvedAt: now - 36 * H - 40 * M },
      ];
