      return `<text class="lc-in-k" x="8" y="${by + 8}">${label}</text><rect class="lc-in-track" x="36" y="${by}" width="74" height="8" rx="1"/>` +
        `<rect class="lc-in-bar" data-bar="${k}" x="36" y="${by}" width="0" height="8" rx="1"/><path class="lc-in-tick" d="${ticks}"/>` +
        `<text class="lc-in-v" data-barv="${k}" x="146" y="${by + 8}" style="text-anchor:end"></text>`;
    };
    return `<svg class="lc-inset" viewBox="0 0 150 186" aria-hidden="true"><text class="lc-in-title" x="8" y="14" data-in="title">HOST STATUS</text>` +
      `<g transform="translate(75 50)"><ellipse class="lc-in-oval" rx="50" ry="27"/>` +
      `<path class="lc-in-br" d="M-56 -17 h-5 v12 M-56 17 h-5 v-12 M56 -17 h5 v12 M56 17 h5 v-12"/>${def(kind).plan || ''}</g>` +
      bar('cpu', 'CPU', 0) + bar('mem', 'MEM', 1) + bar('sys', 'SYS', 2) + bar('upt', 'UPT', 3) + `</svg>`;
  }

  function spread(xs, min, lo, hi) {
    const o = xs.slice();
    for (let i = 1; i < o.length; i++) o[i] = Math.max(o[i], o[i - 1] + min);
    if (o.length) o[o.length - 1] = Math.min(o[o.length - 1], hi);
    for (let i = o.length - 2; i >= 0; i--) o[i] = Math.min(o[i], o[i + 1] - min);
    if (o.length && o[0] < lo) { const d = lo - o[0]; for (let i = 0; i < o.length; i++) o[i] += d; }
    return o;
  }
  const clip = (str, w, px) => { const n = Math.max(3, Math.floor((w - 10) / px)); return str.length > n ? str.slice(0, n - 1) + '…' : str; };

  /* ============================================================ ship screen */
  /** ctx: { select(id|null), snapshot, selected }. Returns { el, update(snapshot), select(id), dispose() }. */
  function view(host, ctx) {
    const kind = kindOf(host), D0 = def(kind);
    const [VW, VH] = D0.vb;
    const root = document.createElement('div');
    root.className = 'lc-ship';
    root.dataset.kind = kind;
    root.innerHTML =
      '<div class="lc-diag">' +
        '<div class="lc-sub"><span>Master systems display</span><span data-k="hw"></span><span data-k="os"></span><span class="lc-view">' + esc(D0.view) + '</span>' +
          '<button type="button" class="lc-zoom" data-act="zoom" aria-pressed="false">Zoom</button></div>' +
        '<div class="lc-msd"><svg class="lc-svg" viewBox="0 0 ' + VW + ' ' + VH + '" role="group" aria-label="' + esc(names(host).title) + ' systems diagram"></svg></div>' +
        '<h3 class="lc-aux-h"><span>Auxiliary bays</span><b data-k="auxn" class="hd-num"></b></h3>' +
        '<ol class="lc-list" aria-label="Ship systems"></ol>' +
      '</div>' + DETAIL_HTML;
    const svg = root.querySelector('.lc-svg'), list = root.querySelector('.lc-list');
    const det = root.querySelector('.lc-det'), D = k => det.querySelector(`[data-d="${k}"]`);
    det.inert = true;
    let sig = '', layoutRooms = [], overflow = [], selected = ctx.selected || null, hovered = null, curHost = host;
    const yTop = 66, yBot = VH - 64;

    function render(services) {
      const L = layout(host, services);
      layoutRooms = L.rooms; overflow = L.overflow;
      const used = L.used;
      let leaders = '', callouts = '';
      if (D0.callouts === 'lists') {
        // MSD-style label lists. Leaders go room -> vertical -> horizontal to a dot in a list column.
        // Within a band, rooms split left/right by anchor x (left half -> left list). Right lists: rooms sorted
        // left->right take rows far->near; left lists mirror that. With every horizontal ending at a shared column,
        // that order guarantees no vertical ever crosses another leader's horizontal.
        const LS = D0.lists, MAX = LS.max || 6;
        const hitsV = (r, x, y0, y1) => used.some(o => o !== r && x > o.x - 3 && x < o.x + o.w + 3 && Math.max(y0, o.y) < Math.min(y1, o.y + o.h));
        used.forEach(r => {
          const xs = [0.5, 0.3, 0.7, 0.15, 0.85].map(f => r.x + r.w * f);
          let best = null;
          [0, 1].forEach(bi => xs.forEach((x, k) => {
            const blocked = bi === 0 ? hitsV(r, x, LS.topLane, r.y) : hitsV(r, x, r.y + r.h, LS.botLane);
            const pref = (bi === 0) === (r.y + r.h / 2 < D0.mid) ? 0 : 1;
            const sc = (blocked ? 100 : 0) + pref * 10 + k;
            if (!best || sc < best.sc) best = { sc, bi, x };
          }));
          r.band = best.bi; r.ax = best.x;
        });
        [0, 1].forEach(bi => {       // more than two full lists in a band: the excess moves to the other band
          const grp = used.filter(r => r.band === bi);
          if (grp.length > 2 * MAX) grp.sort((a, c) => bi ? a.y - c.y : c.y - a.y).slice(0, grp.length - 2 * MAX).forEach(r => { r.band = 1 - bi; });
        });
        [0, 1].forEach(bi => {
          const grp = used.filter(r => r.band === bi).sort((a, c) => a.ax - c.ax);
          const nl = Math.min(MAX, Math.max(grp.length - MAX, Math.ceil(grp.length / 2)));
          grp.forEach((r, i) => { r.side = i < nl ? 'l' : 'r'; });
        });
        ['0l', '0r', '1l', '1r'].forEach(g => {
          const bi = +g[0], sd = g[1];
          const grp = used.filter(r => r.band === bi && r.side === sd).sort((a, c) => sd === 'r' ? a.ax - c.ax : c.ax - a.ax);
          const n = grp.length;
          if (!n) return;
          // list column as close to its rooms as allowed, so labels get the room they need
          const dot = sd === 'r' ? Math.max(LS.rightMin || LS.rightDot, Math.min(LS.rightDot, Math.max(...grp.map(r => r.ax)) + 16))
            : Math.min(LS.leftMax || LS.leftDot, Math.max(LS.leftDot, Math.min(...grp.map(r => r.ax)) - 16));
          grp.forEach((r, k) => {
            const y = bi === 0 ? LS.topLane - (n - 1 - k) * LS.row : LS.botLane + (n - 1 - k) * LS.row;
            const s = r.svc;
            const p0 = bi === 0 ? [r.ax, r.y] : [r.ax, r.y + r.h];
            leaders += `<g class="lc-leader" data-id="${esc(s.id)}"><polyline points="${[p0, [r.ax, y], [dot, y]].map(p => p.map(f1).join(',')).join(' ')}"/>` +
              `<circle cx="${f1(r.ax)}" cy="${f1(p0[1])}" r="2"/><circle class="lc-dot" cx="${dot}" cy="${f1(y)}" r="3"/></g>`;
            const tx = sd === 'r' ? dot + 8 : dot - 8, anc = sd === 'r' ? 'start' : 'end';
            const avail = (sd === 'r' ? VW - dot : dot) - 12;
            callouts += `<g class="lc-co lc-co-list" data-id="${esc(s.id)}"><text x="${tx}" y="${f1(y + 4)}" style="text-anchor:${anc}">` +
              `<tspan class="lc-co-num">${String(r.n).padStart(2, '0')} </tspan><tspan class="lc-co-svc">${esc(clip(s.name.toUpperCase(), avail - 18, 7))}</tspan>` +
              `<tspan class="lc-co-sub" x="${tx}" dy="12.5"><tspan class="lc-co-room">${esc(r.name.toUpperCase())}</tspan><tspan class="lc-co-m" data-k="m" data-avail="${f1(avail)}" dx="5"></tspan></tspan></text></g>`;
          });
        });
      } else {
        // Floating labels (runabout). Each room gets a band (labels above or below the ship) and an anchor x such
        // that its vertical run doesn't pass through another room. Lanes are ranked so no vertical crosses another
        // leader's horizontal: right-going leaders take lanes nearer the ship the further right they start.
        const hitsRoom = (r, x, y0, y1) => used.some(o => o !== r && x > o.x - 4 && x < o.x + o.w + 4 && Math.max(y0, o.y) < Math.min(y1, o.y + o.h));
        const hitsRoomH = (r, y, x0, x1) => used.some(o => o !== r && y > o.y - 4 && y < o.y + o.h + 4 && Math.max(x0, o.x) < Math.min(x1, o.x + o.w));
        used.forEach(r => {
          const my = r.y + r.h / 2, xs = [0.5, 0.3, 0.7, 0.15, 0.85].map(f => r.x + r.w * f);
          let best = null;
          const consider = c => { if (!best || c.score < best.score) best = c; };
          [0, 1].forEach(bi => {
            const pref = (bi === 0) === (my < D0.mid) ? 0 : 1;
            xs.forEach((x, k) => {
              const blocked = bi === 0 ? hitsRoom(r, x, yTop, r.y) : hitsRoom(r, x, r.y + r.h, yBot);
              consider({ score: (blocked ? 100 : 0) + pref * 10 + k, bi, x, side: null });
            });
            for (let d = 10; d <= 90; d += 5) [-1, 1].forEach(dir => {
              const col = dir < 0 ? r.x - d : r.x + r.w + d, edge = dir < 0 ? r.x : r.x + r.w;
              if (hitsRoomH(r, my, Math.min(edge, col), Math.max(edge, col))) return;
              if (bi === 0 ? hitsRoom(r, col, yTop, my) : hitsRoom(r, col, my, yBot)) return;
              consider({ score: 40 + pref * 10 + d / 10, bi, x: col, side: [edge, my] });
            });
          });
          r.band = best.bi; r.ax = best.x; r.side = best.side;
        });
        [0, 1].forEach(bi => {
          const mine = used.filter(r => r.band === bi);
          if (mine.length > 6) mine.sort((a, c) => (bi ? a.y - c.y : c.y - a.y)).slice(0, mine.length - 6).forEach(r => { r.band = 1 - bi; });
        });
        [0, 1].forEach(bi => {
          const band = used.filter(r => r.band === bi).sort((a, c) => a.ax - c.ax);
          const xs = spread(band.map(r => Math.min(VW - 80, Math.max(80, r.ax))), 160, 80, VW - 80);
          xs.forEach((x, i) => band.forEach((o, j) => {
            if (j !== i && Math.abs(xs[i] - o.ax) < 16) xs[i] = o.ax + (xs[i] >= o.ax ? 16 : -16);
          }));
          const right = band.map((r, i) => xs[i] > r.ax + 1), left = band.map((r, i) => xs[i] < r.ax - 1);
          const rank = band.map(() => 0);
          let k = 0; band.forEach((r, i) => { if (right[i]) rank[i] = k++; });
          k = 0; for (let i = band.length - 1; i >= 0; i--) if (left[i]) rank[i] = k++;
          band.forEach((r, i) => {
            const cx = r.ax, lx = xs[i], s = r.svc, lo = Math.min(cx, lx), hi = Math.max(cx, lx);
            const over = used.filter(o => o === r || (o.x < hi + 4 && o.x + o.w > lo - 4));
            const limit = bi === 0 ? Math.min(...over.map(o => o.y)) - 10 : Math.max(...over.map(o => o.y + o.h)) + 10;
            const e = bi === 0 ? Math.min(limit, yTop + 14 + rank[i] * 7) : Math.max(limit, yBot - 14 - rank[i] * 7);
            const p0 = r.side || (bi === 0 ? [cx, r.y] : [cx, r.y + r.h]), pe = bi === 0 ? yTop : yBot;
            const head = r.side ? [p0, [cx, p0[1]]] : [p0];
            const pts = Math.abs(lx - cx) < 1 ? head.concat([[cx, pe]]) : head.concat([[cx, e], [lx, e], [lx, pe]]);
            leaders += `<g class="lc-leader" data-id="${esc(s.id)}"><polyline points="${pts.map(p => p.map(f1).join(',')).join(' ')}"/><circle cx="${f1(cx)}" cy="${f1(p0[1])}" r="3.2"/></g>`;
            const y0 = bi === 0 ? 20 : VH - 50;
            callouts += `<g class="lc-co" data-id="${esc(s.id)}">` +
              `<text x="${f1(lx)}" y="${y0}"><tspan class="lc-co-num">${String(r.n).padStart(2, '0')} </tspan><tspan class="lc-co-room">${esc(r.name.toUpperCase())}</tspan>` +
              `<tspan class="lc-co-svc" x="${f1(lx)}" dy="20">${esc(clip(s.name.toUpperCase(), 158, 9.2))}</tspan>` +
              `<tspan class="lc-co-m" x="${f1(lx)}" dy="17" data-k="m"></tspan></text></g>`;
          });
        });
      }
      let rooms = '';
      layoutRooms.forEach(r => {
        const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
        if (!r.svc) {
          rooms += `<g class="lc-room is-empty">${rect(r.x, r.y, r.w, r.h, 2, 'lc-vis')}` +
            (D0.callouts === 'lists' ? '' : `<text x="${f1(cx)}" y="${f1(cy)}">${esc(clip(r.name.toUpperCase(), r.w, 6.4))}</text>`) + `</g>`;
          return;
        }
        const s = r.svc, small = r.h < 18;
        rooms += `<g class="lc-room" data-id="${esc(s.id)}" role="button" tabindex="0" style="--i:${r.n}">` +
          rect(r.x - 2, r.y - 3, r.w + 4, r.h + 6, 3, 'lc-hit') + rect(r.x, r.y, r.w, r.h, small ? 2 : 3, 'lc-vis') +
          `<text class="lc-room-n${small ? ' is-small' : ''}" x="${f1(cx)}" y="${f1(cy + 0.6)}">${String(r.n).padStart(2, '0')}</text></g>`;
      });
      svg.innerHTML = `<g class="lc-shipg">${D0.ship}</g><g class="lc-leaders">${leaders}</g><g class="lc-rooms">${rooms}</g><g class="lc-callouts">${callouts}</g>`;
      const rows = used.map(r => ({ r, s: r.svc })).concat(overflow.map((s, i) => ({ r: { name: `Auxiliary bay ${i + 1}`, n: null }, s, aux: true })));
      list.innerHTML = rows.map(({ r, s, aux }) =>
        `<li class="${aux ? 'is-aux' : ''}"><button type="button" class="lc-row${aux ? ' is-aux' : ''}" data-id="${esc(s.id)}">` +
        `<span class="lc-row-n">${r.n ? String(r.n).padStart(2, '0') : '+'}</span><span class="lc-row-txt"><span class="lc-row-room">${esc(r.name)}</span>` +
        `<span class="lc-row-svc">${esc(s.name)}</span></span><span class="lc-row-m" data-k="m"></span>` +
        `<span class="lc-chip" data-k="st"></span></button></li>`).join('');
      root.classList.toggle('has-aux', overflow.length > 0);
      root.querySelector('[data-k="auxn"]').textContent = overflow.length ? String(overflow.length) : '';
    }

    /** Trim a list label's metric to the space left beside its room name, using real rendered widths. */
    function fitMetric(el, m, full) {
      if (m.dataset.full === full) return;
      m.dataset.full = full;
      const room = el.querySelector('.lc-co-room'), budget = +m.dataset.avail - (room ? room.getComputedTextLength() : 0) - 8;
      m.textContent = full;
      if (!m.getComputedTextLength()) { delete m.dataset.full; return; }     // not rendered (compact mode): fit later
      if (budget < 30) { m.textContent = ''; return; }
      let txt = full;
      while (txt.length > 3 && m.getComputedTextLength() > budget) { txt = txt.slice(0, -2).trimEnd(); m.textContent = txt + '…'; }
    }
    document.fonts?.ready.then(() => root.querySelectorAll('[data-full]').forEach(n => { delete n.dataset.full; }));

    function patch(snapshot) {
      const services = (snapshot.services || []).filter(s => s.host === host.id);
      const h = (snapshot.hosts || []).find(x => x.id === host.id) || curHost;
      curHost = h;
      const nextSig = services.map(s => s.id).join(',');
      if (nextSig !== sig) { sig = nextSig; render(services); }
      const byId = new Map(services.map(s => [s.id, s]));
      root.querySelectorAll('[data-id]').forEach(el => {
        const s = byId.get(el.dataset.id); if (!s) return;
        el.classList.toggle('is-warn', s.status === 'degraded');
        el.classList.toggle('is-down', s.status === 'down');
        el.classList.toggle('is-selected', s.id === selected);
        el.classList.toggle('is-hover', s.id === hovered);
        if (el.classList.contains('lc-row')) el.setAttribute('aria-current', s.id === selected ? 'true' : 'false');
        const m = el.querySelector('[data-k="m"]');
        if (m) {
          const t = s.status === 'healthy' ? heroMetric(s) : `${STATUS_WORD[s.status]}${s.statusReason ? ': ' + s.statusReason : ''}`;
          if (m.dataset.avail) fitMetric(el, m, t.toUpperCase());
          else {
            const c = el.tagName.toLowerCase() === 'g' ? clip(t.toUpperCase(), 176, 6.3) : t;
            if (m.textContent !== c) m.textContent = c;
          }
        }
        const st = el.querySelector('[data-k="st"]');
        if (st) { st.textContent = STATUS_WORD[s.status]; st.dataset.status = s.status; }
        if (el.classList.contains('lc-room')) {
          const r = layoutRooms.find(x => x.svc && x.svc.id === s.id);
          el.setAttribute('aria-label', `${r ? String(r.n).padStart(2, '0') + ' ' + r.name : ''}: ${s.name}, ${STATUS_WORD[s.status]}. ${heroMetric(s)}`);
        }
      });
      root.querySelector('[data-k="hw"]').textContent = h.hardware || '';
      root.querySelector('[data-k="os"]').textContent = h.os || '';
      patchDetail(services, h);
    }

    /* Service detail panel: slides into the right of the ship screen (desktop) or replaces the systems list
       (compact). Built once per service, then patched text-by-text so live metrics never re-render it. */
    let detId = null, detTilesSig = '', detPorts = null, lastServices = [], lastHost = host;
    let detMembersHtml = null, detChecksHtml = null, detLogsHtml = null, detSvc = null, logStop = null, logId = null, logRes = null;
    const membersOpen = new Set();
    const setT = (el, v) => { v = v == null ? '' : String(v); if (el.textContent !== v) el.textContent = v; };
    const fmtV = (v, unit) => { const n = typeof v === 'number' ? v.toLocaleString() : String(v ?? '—'); return unit === '%' ? n + '%' : unit ? `${n} ${unit}` : n; };
    const tile = (k, label, c) => `<div class="lc-out lc-out-v" data-o="${esc(k)}" style="--c:${c}"><span>${esc(label)}</span><b class="hd-num"></b></div>`;
    function roomLabel(id) {
      const r = layoutRooms.find(x => x.svc && x.svc.id === id);
      if (r) return `${String(r.n).padStart(2, '0')} · ${r.name}`;
      const i = overflow.findIndex(x => x.id === id);
      return i >= 0 ? `+ · Auxiliary bay ${i + 1}` : '';
    }
    function patchDetail(services, h) {
      lastServices = services; lastHost = h || lastHost;
      const s = selected ? services.find(x => x.id === selected) : null;
      if (!s) { closeDetail(); return; }
      const opening = detId !== s.id;
      detId = s.id;
      const st = s.status in STATUS_WORD ? s.status : 'healthy';
      det.dataset.status = st;
      setT(D('room'), roomLabel(s.id));
      setT(D('name'), s.name);
      setT(D('type'), `${String(s.type || 'service').replace(/-/g, ' ')}${s.critical ? ' · critical path' : ''}${s.placeholder ? ' · demo placeholder' : ''}`);
      setT(D('stw'), STATUS_WORD[st]);
      setT(D('reason'), st !== 'healthy' ? (s.statusReason || '') : '');
      D('reason').hidden = st === 'healthy' || !s.statusReason;
      setT(D('desc'), s.description || '');
      D('desc').hidden = !s.description;
      const metrics = s.metrics || [];
      const tilesSig = s.id + '|' + metrics.map(m => m.key).join(',');
      const tilesEl = D('outs');
      if (tilesSig !== detTilesSig) {
        detTilesSig = tilesSig;
        const cs = ['var(--lc-or)', 'var(--lc-6)', 'var(--lc-4)', 'var(--lc-2)', 'var(--lc-1)'];
        tilesEl.innerHTML = tile('_up', 'Uptime', 'var(--lc-1)') + tile('_cpu', 'CPU', 'var(--lc-3)') +
          tile('_mem', 'Memory', 'var(--lc-2)') + tile('_rs', 'Last restart', 'var(--lc-6)') +
          metrics.map((m, i) => tile(m.key, m.label, cs[i % cs.length])).join('');
      }
      const out = (k, v, tone) => { const el = tilesEl.querySelector(`[data-o="${CSS.escape(k)}"]`); if (!el) return; setT(el.lastElementChild, v); el.classList.toggle('is-warn', !!tone); };
      const memPct = s.memLimitMB ? s.memMB / s.memLimitMB * 100 : 0;
      out('_up', st === 'down' ? 'Stopped' : HD.util.fmtUptime(s.uptimeSec), st === 'down');
      out('_cpu', `${(Math.round((s.cpu || 0) * 10) / 10).toLocaleString()}%`, (s.cpu || 0) > 85);
      out('_mem', `${HD.util.fmtMem(s.memMB)}${s.memLimitMB ? ' / ' + HD.util.fmtMem(s.memLimitMB) : ''}`, memPct > 85);
      out('_rs', s.lastRestart ? HD.util.relTime(s.lastRestart) : '—');
      metrics.forEach(m => out(m.key, fmtV(m.value, m.unit)));
      setT(D('image'), s.image || '—');
      setT(D('host'), `${lastHost.name || s.host}${lastHost.ip ? '  ' + lastHost.ip : ''}`);
      const ports = (s.ports || []).join('|');
      if (ports !== detPorts) {
        detPorts = ports;
        D('ports').innerHTML = (s.ports || []).length ? s.ports.map(p => `<span class="lc-pill hd-num">${esc(p)}</span>`).join('') : '<span class="lc-det-muted">Internal only</span>';
      }
      const open = D('open'), urlRow = D('urlrow');
      if (s.url) {
        if (open.getAttribute('href') !== s.url) { open.href = s.url; D('url').href = s.url; }
        setT(D('url'), s.url.replace(/^https?:\/\//, ''));
        open.setAttribute('aria-label', `Open ${s.name} in a new tab`);
      }
      open.hidden = !s.url; urlRow.hidden = !s.url;
      detSvc = s;
      patchExtras(s);
      syncLogs(s);
      if (opening) openDetail();
    }

    /* Containers + health checks (live collector fields). Re-rendered only when their text changes; the
       expand button sits outside the re-rendered list so it keeps focus. */
    const cap1 = t => (t ? String(t).charAt(0).toUpperCase() + String(t).slice(1) : '');
    const tone = m => m.state !== 'running' ? (m.state === 'restarting' ? 'warn' : m.state === 'paused' || m.state === 'created' ? 'idle' : 'down')
      : m.health === 'unhealthy' ? 'down' : m.health === 'starting' ? 'warn' : 'ok';
    function patchExtras(s) {
      const members = Array.isArray(s.members) ? s.members.filter(m => m && m.name) : [];
      const RK = { down: 0, warn: 1, idle: 2, ok: 3 };
      const sorted = members.map(m => ({ m, t: tone(m) })).sort((a, b) => RK[a.t] - RK[b.t] || String(a.m.name).localeCompare(String(b.m.name)));
      const big = members.length > 6, open = !big || membersOpen.has(s.id);
      const shown = open ? sorted : sorted.filter(x => x.t === 'down' || x.t === 'warn').slice(0, 6);
      const mh = shown.map(({ m, t }) => {
        const label = m.service || m.name, bits = [];
        if (m.state === 'running') {
          if (m.cpu != null) bits.push(`CPU ${(Math.round((+m.cpu || 0) * 10) / 10).toLocaleString()}%`);
          if (m.memMB != null) bits.push(esc(HD.util.fmtMem(m.memMB)));
        }
        if (m.restarts) bits.push(`${esc(m.restarts)} restart${m.restarts === 1 ? '' : 's'}`);
        if (label !== m.name) bits.push(esc(m.name));
        const hcls = m.health === 'healthy' ? 'ok' : m.health === 'unhealthy' ? 'down' : 'warn';
        const scls = m.state === 'running' ? 'ok' : m.state === 'restarting' ? 'warn' : m.state === 'exited' || m.state === 'dead' ? 'down' : 'idle';
        return `<li class="lc-ct is-${t}"><span class="lc-ct-main"><span class="lc-ct-n" title="${esc(m.name)}">${esc(label)}</span>` +
          (bits.length ? `<span class="lc-ct-sub hd-num">${bits.join(' · ')}</span>` : '') + `</span>` +
          `<span class="lc-ct-chips"><span class="lc-tag is-${scls}">${esc(cap1(m.state || 'unknown'))}</span>` +
          (m.health ? `<span class="lc-tag is-${hcls}">${esc(cap1(m.health))}</span>` : '') + `</span></li>`;
      }).join('');
      D('msec').hidden = !members.length;
      setT(D('msum'), members.length ? `${members.filter(m => m.state === 'running').length}/${members.length} running` : '');
      if (mh !== detMembersHtml) { detMembersHtml = mh; D('members').innerHTML = mh; }
      D('members').hidden = !mh;
      const more = D('more');
      more.hidden = !big;
      if (big) { setT(more, open ? 'Show fewer' : `Show all ${members.length} containers`); more.setAttribute('aria-expanded', String(open)); }

      const checks = Array.isArray(s.checks) ? s.checks.filter(c => c && c.name) : [];
      const ch = checks.slice().sort((a, b) => (!!a.success - !!b.success) || String(a.name).localeCompare(String(b.name))).map(c => {
        const ts = typeof c.lastCheck === 'number' ? c.lastCheck : c.lastCheck ? Date.parse(c.lastCheck) : NaN;
        const meta = [isFinite(ts) ? HD.util.relTime(ts) : '', c.durationMs != null ? `${Math.round(c.durationMs).toLocaleString()} ms` : ''].filter(Boolean).join(' · ');
        return `<li class="lc-ct is-${c.success ? 'ok' : 'down'}"><span class="lc-ct-main"><span class="lc-ct-n">${esc(c.name)}</span>` +
          ((c.group || c.hostname) ? `<span class="lc-ct-sub">${esc([c.group, c.hostname].filter(Boolean).join(' · '))}</span>` : '') + `</span>` +
          `<span class="lc-ck-end"><span class="lc-tag is-${c.success ? 'ok' : 'down'}">${c.success ? 'Passing' : 'Failing'}</span>` +
          (meta ? `<span class="lc-ct-sub hd-num">${esc(meta)}</span>` : '') + `</span></li>`;
      }).join('');
      D('csec').hidden = !checks.length;
      setT(D('csum'), checks.length ? `${checks.filter(c => c.success).length}/${checks.length} passing` : '');
      if (ch !== detChecksHtml) { detChecksHtml = ch; D('checks').innerHTML = ch; }
    }

    /* Recent logs: polled via HD.data.watchLogs while a live service is open; stopped on close/switch/dispose. */
    function syncLogs(s) {
      const want = s && !s.placeholder && HD.data.source === 'live' && HD.data.watchLogs ? s.id : null;
      if (want !== logId) {
        if (logStop) { logStop(); logStop = null; }
        logId = want; logRes = null;
        if (want) logStop = HD.data.watchLogs(want, { limit: 30, every: 10000 }, r => { if (logId === want) { logRes = r; renderLogs(); } });
      }
      renderLogs();
    }
    const logTime = ts => new Date(ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    function renderLogs() {
      const s = detSvc;
      D('lsec').hidden = !s || !!s.placeholder;
      if (!s || s.placeholder) return;
      const note = t => `<p class="lc-det-note">${t}</p>`;
      let html;
      if (HD.data.source !== 'live') html = note('Logs are available with live data');
      else if (!logRes || (!logRes.lines && logRes.state === 'loading')) html = note('Loading logs…');
      else if (!logRes.lines || !logRes.lines.length) html = note(logRes.state === 'error' ? `Logs unavailable: ${esc(logRes.error || 'unknown error')}` : 'No log lines in the last hour');
      else {
        const multi = new Set(logRes.lines.map(l => l.container)).size > 1;
        // "media_stack-radarr-1" -> "radarr": compose service from members, else strip project prefix + replica
        const svcOf = new Map((Array.isArray(s.members) ? s.members : []).filter(m => m && m.name && m.service).map(m => [m.name, m.service]));
        const pre = s.id.replace(/[^a-z0-9]+/gi, '[-_]'), preRe = new RegExp('^' + pre + '[-_]', 'i');
        const short = c => svcOf.get(c) || String(c).replace(preRe, '').replace(/[-_]\d+$/, '') || c;
        html = '<ol class="lc-logs" aria-label="Recent log lines, newest first">' + logRes.lines.map(l => {
          const msg = l.text || String(l.line).replace(/\s+/g, ' ').trim();
          const lvl = l.level === 'error' || l.level === 'warn' ? l.level : 'info';
          return `<li class="lc-log is-${lvl}" title="${esc(msg)}"><span class="lc-log-t hd-num">${esc(l.ts ? logTime(l.ts) : '')}</span>` +
            (multi && l.container ? `<span class="lc-log-c" title="${esc(l.container)}">${esc(short(l.container))}</span>` : '') + `<span class="lc-log-m">${esc(msg)}</span></li>`;
        }).join('') + '</ol>' + (logRes.state === 'error' ? note(`Refresh failed: ${esc(logRes.error || 'unknown error')}`) : '');
      }
      if (html !== detLogsHtml) {
        const ol = D('logs').querySelector('.lc-logs'), top = ol ? ol.scrollTop : 0;
        detLogsHtml = html; D('logs').innerHTML = html;
        const nol = D('logs').querySelector('.lc-logs'); if (nol && top) nol.scrollTop = top;
      }
    }
    function openDetail() {
      if (root.classList.contains('has-det')) return;
      det.inert = false;
      root.classList.add('has-det');
      compactNow();
      if (root.classList.contains('is-compact')) requestAnimationFrame(() => det.scrollIntoView({ block: 'start' }));
    }
    function closeDetail() {
      if (detId == null) return;
      const prev = detId;
      detId = null; detTilesSig = ''; detPorts = null; detSvc = null;
      syncLogs(null);
      const hadFocus = det.contains(document.activeElement);
      det.inert = true;
      root.classList.remove('has-det');
      compactNow();
      const sel = root.classList.contains('is-compact') ? '.lc-row' : '.lc-room';
      const back = root.querySelector(`${sel}[data-id="${CSS.escape(prev)}"]`);
      if (hadFocus && back) back.focus({ preventScroll: true });          // hand focus back to the room (or list row)
      if (back && root.classList.contains('is-compact')) requestAnimationFrame(() => back.scrollIntoView({ block: 'center' }));
    }

    const idOf = e => e.target.closest?.('[data-id]')?.dataset.id;
    root.addEventListener('click', e => {
      if (e.target.closest('[data-act="det-close"]')) { ctx.select(null); return; }
      if (e.target.closest('[data-act="det-members"]')) {
        if (detId) { if (membersOpen.has(detId)) membersOpen.delete(detId); else membersOpen.add(detId); patchDetail(lastServices, lastHost); }
        return;
      }
      const z = e.target.closest('[data-act="zoom"]');
      if (z) { const on = root.classList.toggle('is-zoom'); z.setAttribute('aria-pressed', String(on)); z.textContent = on ? 'Fit' : 'Zoom'; return; }
      if (e.target.closest('.lc-det')) return;
      const id = idOf(e); if (id) ctx.select(id);
    });
    root.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.lc-room[data-id]')) { e.preventDefault(); ctx.select(e.target.dataset.id); }
    });
    const patchHover = () => root.querySelectorAll('[data-id]').forEach(el => el.classList.toggle('is-hover', el.dataset.id === hovered));
    root.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const id = e.target.closest?.('.lc-det') ? null : idOf(e) || null; if (id !== hovered) { hovered = id; patchHover(); } });
    root.addEventListener('pointerleave', () => { if (hovered) { hovered = null; patchHover(); } });
    // Compact: the label lists don't fit, so the diagram crops to the ship and the numbered list sits below it.
    // With a detail open on a wide screen the same happens beside the panel ("focus"), so nothing gets tiny.
    const compactNow = () => {
      const c = (root.clientWidth || innerWidth) < 720;
      root.classList.toggle('is-compact', c);
      const crop = (c || root.classList.contains('has-det')) && D0.box;
      const vb = (crop ? D0.box : [0, 0, VW, VH]).join(' ');
      if (svg.getAttribute('viewBox') !== vb) svg.setAttribute('viewBox', vb);
    };
    const ro = window.ResizeObserver ? new ResizeObserver(compactNow) : null;
    ro?.observe(root);
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-live')));
    return {
      el: root,
      hostId: host.id,
      mounted() { compactNow(); patch(ctx.snapshot || HD.data.getSnapshot()); },
      update: patch,
      select(id) {
        selected = id || null;
        root.querySelectorAll('[data-id]').forEach(el => el.classList.toggle('is-selected', el.dataset.id === selected));
        patchDetail(lastServices, lastHost);
      },
      get selected() { return selected; },
      dispose() { if (logStop) { logStop(); logStop = null; } logId = null; ro?.disconnect(); root.remove(); },
    };
  }

  const DETAIL_HTML =
    '<aside class="lc-det" aria-label="System details">' +
      '<div class="lc-det-in">' +
        '<div class="lc-det-head">' +
          '<div class="lc-det-bar"><span data-d="room"></span></div><i class="lc-det-cap" aria-hidden="true"></i>' +
        '</div>' +
        '<h3 class="lc-det-name" data-d="name"></h3>' +
        '<p class="lc-det-type" data-d="type"></p>' +
        '<div class="lc-det-acts">' +
          '<a class="lc-btn lc-btn-open" data-d="open" target="_blank" rel="noopener noreferrer">Open</a>' +
          '<button type="button" class="lc-btn lc-btn-close" data-act="det-close" aria-label="Close details">' +
            '<span class="lc-det-x">Close</span><span class="lc-det-back">Back</span></button>' +
        '</div>' +
        '<div class="lc-det-body">' +
          '<div class="lc-det-st" role="status"><b data-d="stw"></b><p data-d="reason"></p></div>' +
          '<p class="lc-det-desc" data-d="desc"></p>' +
          '<div class="lc-det-outs" data-d="outs"></div>' +
          '<dl class="lc-det-kv">' +
            '<div><dt>Image</dt><dd data-d="image" class="lc-break"></dd></div>' +
            '<div><dt>Host</dt><dd data-d="host" class="hd-num"></dd></div>' +
            '<div><dt>Ports</dt><dd data-d="ports" class="lc-pills"></dd></div>' +
            '<div data-d="urlrow"><dt>URL</dt><dd><a data-d="url" class="lc-det-link lc-break" target="_blank" rel="noopener noreferrer"></a></dd></div>' +
          '</dl>' +
          '<section class="lc-det-sec" data-d="msec" hidden><h4 class="lc-det-sh"><span>Containers</span><b data-d="msum" class="hd-num"></b></h4>' +
            '<ol class="lc-cts" data-d="members"></ol>' +
            '<button type="button" class="lc-det-more" data-act="det-members" data-d="more" aria-expanded="false" hidden></button></section>' +
          '<section class="lc-det-sec" data-d="csec" hidden><h4 class="lc-det-sh"><span>Health checks</span><b data-d="csum" class="hd-num"></b></h4>' +
            '<ol class="lc-cts" data-d="checks"></ol></section>' +
          '<section class="lc-det-sec" data-d="lsec" hidden><h4 class="lc-det-sh"><span>Recent logs</span><b>Last hour</b></h4>' +
            '<div data-d="logs"></div></section>' +
        '</div>' +
      '</div>' +
    '</aside>';

  HD.msd = { kindOf, names, def, layout, roomOf, inset, view, heroMetric, STATUS_WORD, hash };
})();
</script>
<script>/* ==== lcars-app.js ==== */
/* HomeDeck LCARS app (HD.lcars): the whole screen is one LCARS display.
   Frame: top bar (HOMEDECK, screen title, stardate, Live/Demo/Connecting, Red Alert, alert count, search),
   left rail (one button per ship/host, then Systems / Alerts / Log / Ops, then the host status inset),
   bottom readouts. Screens render into the frame's main area:
     #/ship/<host>[/<service>]  master systems display of that host's ship, optionally with a service detail open
     #/systems  #/alerts  #/log  #/ops
   Routing is the URL hash, so reload and back/forward work. Live updates patch text in place (keyed rows,
   textContent) so focus and scroll survive the 5 s refresh. Phone (<= 760 px): the rail becomes a horizontal
   button strip and screens become lists. */
(function () {
  'use strict';
  const HD = window.HomeDeck;
  const U = HD.util;
  const esc = s => U.escapeHtml(s == null ? '' : s);
  const ST_WORD = { healthy: 'Nominal', degraded: 'Degraded', down: 'Offline' };
  const ST_CLS = { healthy: 'ok', degraded: 'warn', down: 'down' };
  const RANK = { down: 0, degraded: 1, healthy: 2 };
  const KIND = { restart: 'Restart', deploy: 'Deploy', status: 'Status', info: 'Info' };
  const KIND_ICON = {   // 16px glyphs inside the log's kind blocks
    restart: '<path d="M13.3 8a5.3 5.3 0 1 1-1.7-3.9"/><path d="M13.3 2.7v3.3H10"/>',
    deploy: '<path d="M8 11V3M4.3 6.7 8 3l3.7 3.7"/><path d="M3.3 13.3h9.4"/>',
    status: '<path d="M2 8h2.7l1.6-4.3 3.4 8.6L11.3 8H14"/>',
    info: '<circle cx="8" cy="8" r="5.7"/><path d="M8 7.3V11M8 5.2v.1"/>',
  };
  const icon = k => `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${KIND_ICON[k] || KIND_ICON.info}</svg>`;
  const SCREENS = [
    { id: 'systems', label: 'Systems', title: 'Systems inventory', c: 'var(--lc-1)', code: '04' },
    { id: 'alerts', label: 'Alerts', title: 'Alert status', c: 'var(--lc-6)', code: '05' },
    { id: 'log', label: 'Log', title: 'Event log', c: 'var(--lc-2)', code: '06' },
    { id: 'ops', label: 'Ops', title: 'Operations', c: 'var(--lc-3)', code: '07' },
  ];
  const VSW = { startrek: 'Starbase', ds9: 'DS9', lcars: 'LCARS' };    // short labels for the phone top-bar chips
  const phoneMq = window.matchMedia ? window.matchMedia('(max-width: 760px)') : { matches: false, addEventListener() {} };

  const S = { root: null, snap: null, ready: false, route: null, view: null, screen: null, scr: null, red: null, q: { idx: 0, res: [] }, lastHash: '' };
  const E = {};

  /* ---------------- helpers ---------------- */
  const setText = (el, t) => { t = t == null ? '' : String(t); if (el && el.textContent !== t) el.textContent = t; };
  const setAttr = (el, k, v) => { if (!el) return; if (v == null) el.removeAttribute(k); else if (el.getAttribute(k) !== String(v)) el.setAttribute(k, String(v)); };
  const hosts = () => (S.snap?.hosts || []).slice().sort((a, b) => ((b.role === 'primary') - (a.role === 'primary')) || (!!a.placeholder - !!b.placeholder));
  const hostById = id => S.snap?.hosts.find(h => h.id === id) || null;
  const svcById = id => S.snap?.services.find(s => s.id === id) || null;
  const svcsOf = hid => (S.snap?.services || []).filter(s => s.host === hid);
  const primary = () => hosts()[0] || null;
  const worst = list => list.some(s => s.status === 'down') ? 'down' : list.some(s => s.status === 'degraded') ? 'degraded' : 'healthy';
  const activeAlerts = () => (S.snap?.alerts || []).filter(a => a.active).sort((a, b) => (a.severity === 'critical' ? -1 : 0) - (b.severity === 'critical' ? -1 : 0) || b.ts - a.ts);
  const pct = (a, b) => (b ? Math.round(a / b * 100) : 0);
  const num = v => typeof v === 'number' && isFinite(v);
  const fmtK = n => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(Math.round(n));
  const absTime = ts => new Date(ts).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const clock = ts => new Date(ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
  const shipHash = hid => `#/ship/${encodeURIComponent(hid)}`;
  const svcHash = s => `${shipHash(s.host)}/${encodeURIComponent(s.id)}`;
  const heroText = s => {
    const m = s.metrics && s.metrics[0];
    if (!m) return '';
    const v = typeof m.value === 'number' ? m.value.toLocaleString('en-US', { maximumFractionDigits: 1 }) : m.value == null ? '—' : m.value;
    return `${m.unit === '%' ? v + '%' : m.unit ? v + ' ' + m.unit : v} ${m.label || ''}`.trim();
  };

  /* Keyed DOM patcher. items: [{ key, html, cls, attrs, tag }]. Elements are reused by key, so a focused row
     keeps focus across refreshes and only changed markup is touched. */
  function patch(container, items) {
    if (!container) return;
    const old = new Map();
    for (const c of container.children) if (c.dataset.key) old.set(c.dataset.key, c);
    let prev = null;
    for (const it of items) {
      let el = old.get(it.key);
      if (el && el.tagName.toLowerCase() !== (it.tag || 'div')) el = null;
      if (el) old.delete(it.key);
      else { el = document.createElement(it.tag || 'div'); el.dataset.key = it.key; }
      if (el._h !== it.html) { el.innerHTML = it.html; el._h = it.html; }
      if (el._c !== (it.cls || '')) { el.className = it.cls || ''; el._c = it.cls || ''; }
      if (it.attrs) for (const k in it.attrs) setAttr(el, k, it.attrs[k] === false ? null : it.attrs[k]);
      const want = prev ? prev.nextElementSibling : container.firstElementChild;
      if (el !== want) container.insertBefore(el, want);
      prev = el;
    }
    old.forEach(el => el.remove());
  }
  /** LCARS segmented bar meter. */
  const meter = (v, tone) => `<span class="lc-meter${tone ? ' is-' + tone : ''}" style="--v:${U.clamp(v || 0, 0, 100).toFixed(1)}%"><i></i></span>`;
  const toneFor = p => (p >= 90 ? 'down' : p >= 80 ? 'warn' : '');
  function delta(d, unit, goodUp) {
    if (!num(d)) return '';
    if (d === 0) return '<span class="lc-delta">No change vs 24h</span>';
    const up = d > 0, good = goodUp == null ? null : up === goodUp;
    return `<span class="lc-delta${good === false ? ' is-bad' : good ? ' is-good' : ''}"><span aria-hidden="true">${up ? '▲' : '▼'}</span> ${esc(Math.abs(d).toLocaleString('en-US', { maximumFractionDigits: 1 }))}${unit || ''} vs 24h</span>`;
  }

  /* ---------------- skeleton ---------------- */
  function skeleton() {
    return `
<header class="lc-top">
  <div class="lc-elbow lc-elbow-t" aria-hidden="true"><small>LCARS 47-1744</small></div>
  <div class="lc-topcol">
    <div class="lc-bars">
      <span class="lc-seg lc-seg-brand"><b>HomeDeck</b>
        <nav class="lc-vsw" data-f="vsw" aria-label="Display theme">${HD.themes.list().map(t => `<a href="${esc(HD.route.urlOf(t.id))}"${t.id === 'lcars' ? ' aria-current="true"' : ''} aria-label="${esc(t.name)} theme${t.id === 'lcars' ? ' (current)' : ''}">${esc(VSW[t.id] || t.name)}</a>`).join('')}</nav></span>
      <span class="lc-seg lc-seg-sd" title="Stardate"><small>Stardate</small> <b class="hd-num" data-f="sd"></b></span>
      <span class="lc-seg lc-seg-link" data-f="link"><b data-f="linkt">Connecting</b></span>
      <span class="lc-seg lc-seg-red" data-f="red" hidden><b>Red alert</b></span>
      <a class="lc-seg lc-seg-al" href="#/alerts" data-f="al"><b data-f="alt">No alerts</b></a>
      <i class="lc-brk" aria-hidden="true"></i>
      <h1 class="lc-title" data-f="title">HomeDeck</h1>
      <button type="button" class="lc-findbtn" data-act="find" aria-label="Search">Find</button>
      <i class="lc-cap" aria-hidden="true"></i>
    </div>
    <div class="lc-subrow">
      <p class="lc-crumb" data-f="crumb"></p>
      <div class="lc-search" role="search">
        <label class="lc-search-l" for="lc-q">Search <kbd>/</kbd></label>
        <input id="lc-q" type="text" role="combobox" aria-expanded="false" aria-controls="lc-q-list" aria-autocomplete="list"
          placeholder="Service, image, container or host" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        <ul id="lc-q-list" class="lc-q-pop" role="listbox" aria-label="Search results" hidden></ul>
      </div>
    </div>
  </div>
</header>
<div class="lc-midrow">
  <nav class="lc-rail" aria-label="Ships and screens">
    <div class="lc-nav lc-nav-ships" data-f="ships"></div>
    <div class="lc-nav lc-nav-screens" data-f="screens"></div>
    <div class="lc-nav lc-nav-views" data-f="views" role="group" aria-label="Display theme"></div>
    <div class="lc-key lc-key-fill" data-f="inset" aria-hidden="true"></div>
  </nav>
  <main class="lc-main" id="lc-main" tabindex="-1"></main>
</div>
<footer class="lc-bottom">
  <div class="lc-elbow lc-elbow-b" aria-hidden="true"></div>
  <div class="lc-readouts" data-f="outs" aria-label="Readouts"></div>
  <i class="lc-cap lc-cap-b" aria-hidden="true"></i>
</footer>
<div class="hd-vh" role="status" aria-live="polite" data-f="live"></div>`;
  }

  /* ---------------- routing ---------------- */
  function parse(hash) {
    const parts = String(hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
    if (parts[0] === 'ship' && parts[1]) return { screen: 'ship', hostId: parts[1], svcId: parts[2] || null };
    if (SCREENS.some(s => s.id === parts[0])) return { screen: parts[0] };
    return { screen: 'default' };
  }
  function nav(hash, { replace = false, state = null } = {}) {
    if (location.hash === hash) { route(); return; }
    if (replace) history.replaceState(state, '', hash); else history.pushState(state, '', hash);
    route();
  }
  /** Open a service: its ship's MSD with the detail panel. Switching between services keeps one history entry. */
  function selectService(id) {
    const s = svcById(id);
    if (!s) return;
    const r = S.route || {};
    if (r.screen === 'ship' && r.hostId === s.host && r.svcId) nav(svcHash(s), { replace: true, state: history.state });

  }

        `<p class="lc-big hd-num">${up}<small>/${tot} nominal</small></p>` +
        `<div class="lc-stack" role="img" aria-label="${up} nominal, ${dg} degraded, ${dn} offline">${seg(up, 'is-ok')}${seg(dg, 'is-warn')}${seg(dn, 'is-down')}</div>` +
        `<div class="lc-tally"><span class="is-ok"><b class="hd-num">${up}</b>Nominal</span><span class="is-warn${dg ? ' is-on' : ''}"><b class="hd-num">${dg}</b>Degraded</span><span class="is-down${dn ? ' is-on' : ''}"><b class="hd-num">${dn}</b>Offline</span></div>` +
        delta(k.deltas?.servicesUp, '', true) });
    // ZFS
    const hasZ = num(k.zfsUsedPct), zh = String(k.zfsHealth || '');
    panels.push({ key: 'zfs', tag: 'section', cls: 'lc-panel lc-panel-k', attrs: { 'aria-label': 'ZFS pool' },
      html: `<h2 class="lc-ph"><span>ZFS pool</span><small>${hasZ ? `${esc(k.zfsUsedTB ?? '—')} of ${esc(k.zfsSizeTB ?? '—')} TB used` : 'Storage'}</small></h2>` +
        (hasZ ? `<p class="lc-big hd-num">${esc(k.zfsUsedPct)}<small>% used</small></p>${meter(k.zfsUsedPct, toneFor(k.zfsUsedPct))}` +
          `<div class="lc-tally"><span class="${zh === 'ONLINE' ? 'is-ok' : 'is-down is-on'}"><b>${esc(zh || '—')}</b>Health</span></div>` + delta(k.deltas?.zfsUsedPct, ' pts', false)
          : `<p class="lc-none">No ZFS pool found</p>`) });
    // DNS
    const hasD = num(k.dnsBlockedPct);
    panels.push({ key: 'dns', tag: 'section', cls: 'lc-panel lc-panel-k', attrs: { 'aria-label': 'DNS filtering' },
      html: `<h2 class="lc-ph"><span>DNS</span><small>Pi-hole, last 24 hours</small></h2>` +
        (hasD ? `<p class="lc-big hd-num">${esc(k.dnsBlockedPct)}<small>% blocked</small></p>${meter(k.dnsBlockedPct, '')}` +
          `<div class="lc-tally"><span class="is-ok"><b class="hd-num">${fmtK(k.dnsQueries24h)}</b>Queries</span><span class="is-ok"><b class="hd-num">${fmtK(k.dnsBlocked24h)}</b>Blocked</span></div>` + delta(k.deltas?.dnsBlockedPct, ' pts', null)
          : `<p class="lc-none">Pi-hole not configured</p>`) });
    patch(Q('[data-s="panels"]'), panels);
  }

  /* ---------------- search ---------------- */
  function searchItems(q) {
    const terms = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length || !S.snap) return [];
    const out = [];
    const score = (name, hay) => {
      if (!terms.every(t => hay.includes(t))) return -1;
      const n = name.toLowerCase(), q0 = terms[0];
      return n.startsWith(q0) ? 0 : n.includes(q0) ? 1 : 2;
    };
    S.snap.hosts.forEach(h => {
      const n = HD.msd.names(h);
      const sc = score(n.short, [h.id, h.name, n.title, n.reg, n.cls, h.hardware, h.ip, 'host ship'].join(' ').toLowerCase());
      if (sc >= 0) out.push({ kind: 'host', id: h.id, sc, name: n.short, h, n });
    });
    S.snap.services.forEach(s => {
      const members = (s.members || []).map(m => `${m.name} ${m.service || ''} ${m.image || ''}`).join(' ');
      const sc = score(s.name, [s.name, s.id, s.image, s.type, s.host, s.url, members].join(' ').toLowerCase());
      if (sc >= 0) {
        const t0 = terms[0], m = !s.name.toLowerCase().includes(t0) && !s.id.includes(t0) ? (s.members || []).find(x => String(x.name).toLowerCase().includes(t0)) : null;
        out.push({ kind: 'service', id: s.id, sc, name: s.name, s, via: m ? `Container ${m.name}` : null });
      }
    });
    return out.sort((a, b) => a.sc - b.sc || (a.kind === 'host') - (b.kind === 'host') || a.name.localeCompare(b.name)).slice(0, 8);
  }
  function renderSearch() {
    const q = E.input.value, focused = document.activeElement === E.input;
    const res = searchItems(q);
    S.q.res = res;
    S.q.idx = U.clamp(S.q.idx, 0, Math.max(0, res.length - 1));
    const open = focused && !!q.trim();
    E.pop.hidden = !open;
    E.input.setAttribute('aria-expanded', String(open));
    if (!open) { E.input.removeAttribute('aria-activedescendant'); return; }
    const items = res.map((r, i) => {
      const on = i === S.q.idx;
      const html = r.kind === 'host'
        ? `<span class="lc-opt-st is-ship"></span><span class="lc-opt-main"><b>${esc(r.n.title)}</b><small>${esc(r.n.reg)} · host ${esc(r.h.name)}</small></span><span class="lc-opt-tag">Ship</span>`
        : `<span class="lc-opt-st is-${ST_CLS[r.s.status]}"></span><span class="lc-opt-main"><b>${esc(r.s.name)}</b><small>${esc(r.via || r.s.image || r.s.id)}</small></span><span class="lc-opt-tag">${esc(HD.msd.names(hostById(r.s.host) || { id: r.s.host, name: r.s.host }).short)}</span>`;
      return { key: r.kind + ':' + r.id, tag: 'li', cls: 'lc-opt' + (on ? ' is-active' : ''), attrs: { role: 'option', id: 'lc-opt-' + i, 'aria-selected': on ? 'true' : 'false', 'data-kind': r.kind, 'data-id': r.id }, html };
    });
    if (!items.length) items.push({ key: 'empty', tag: 'li', cls: 'lc-opt-empty', attrs: { role: 'presentation' }, html: `No matches for “${esc(q.trim())}”` });
    patch(E.pop, items);
    if (res.length) { E.input.setAttribute('aria-activedescendant', 'lc-opt-' + S.q.idx); E.pop.querySelector('.is-active')?.scrollIntoView({ block: 'nearest' }); }
    else E.input.removeAttribute('aria-activedescendant');
  }
  function choose(kind, id) {
    E.input.value = '';
    S.q.idx = 0;
    renderSearch();
    E.input.blur();
    S.root.classList.remove('is-search');
    if (kind === 'host') nav(shipHash(id)); else selectService(id);
    E.main.focus({ preventScroll: true });
  }
  function openSearch() {
    S.root.classList.add('is-search');
    E.input.focus();
    E.input.select();
  }

  /* ---------------- events ---------------- */
  function onKey(e) {
    const t = e.target, editable = t && (t.isContentEditable || /^(input|textarea|select)$/i.test(t.tagName));
    if (e.key === '/' && !editable && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); openSearch(); return; }
    if (e.key === 'Escape') {
      if (t === E.input) return;           // handled by the input
      if (S.route?.screen === 'ship' && S.route.svcId) { e.preventDefault(); closeDetail(); }
    }
  }
  function onInputKey(e) {
    const n = S.q.res.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); S.q.idx = (S.q.idx + 1) % n; renderSearch(); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); S.q.idx = (S.q.idx - 1 + n) % n; renderSearch(); }
    else if (e.key === 'Enter') { e.preventDefault(); const r = S.q.res[S.q.idx]; if (r) choose(r.kind, r.id); }
    else if (e.key === 'Escape') {
      e.preventDefault(); e.stopPropagation();
      if (E.input.value) { E.input.value = ''; S.q.idx = 0; renderSearch(); }
      else { E.input.blur(); S.root.classList.remove('is-search'); }
    }
  }
  function announce(msg) {
    const el = E.f.live;
    el.textContent = '';
    setTimeout(() => { el.textContent = msg; }, 60);
  }

  /* ---------------- public API ---------------- */
  function init(root) {
    S.root = root;
    root.classList.add('lc');
    root.innerHTML = skeleton();
    const q = s => root.querySelector(s);
    E.main = q('#lc-main'); E.rail = q('.lc-rail'); E.input = q('#lc-q'); E.pop = q('#lc-q-list');
    E.f = {};
    root.querySelectorAll('[data-f]').forEach(el => { E.f[el.dataset.f] = el; });
    document.addEventListener('keydown', onKey);
    E.input.addEventListener('keydown', onInputKey);
    E.input.addEventListener('input', () => { S.q.idx = 0; renderSearch(); });
    E.input.addEventListener('focus', renderSearch);
    E.input.addEventListener('blur', () => setTimeout(() => {
      renderSearch();
      if (!E.input.value && document.activeElement !== E.input) root.classList.remove('is-search');
    }, 150));
    E.pop.addEventListener('pointerdown', e => e.preventDefault());       // keep input focus while picking
    E.pop.addEventListener('click', e => { const li = e.target.closest('[role="option"]'); if (li) choose(li.dataset.kind, li.dataset.id); });
    E.pop.addEventListener('pointermove', e => {
      const li = e.target.closest('[role="option"]'); if (!li) return;
      const i = +li.id.replace('lc-opt-', ''); if (i !== S.q.idx) { S.q.idx = i; renderSearch(); }
    });
    root.addEventListener('click', e => { if (e.target.closest('[data-act="find"]')) { root.classList.contains('is-search') && !E.input.value ? (E.input.blur(), root.classList.remove('is-search')) : openSearch(); } });
    window.addEventListener('hashchange', route);
    phoneMq.addEventListener?.('change', () => root.classList.remove('is-search'));
    setInterval(() => { if (S.snap) { renderTopSegs(); if (S.route?.screen === 'log' || S.route?.screen === 'alerts') renderScreen(); } }, 30000);
    renderTopSegs.call(null);
    route();
  }
  function update(snapshot, changes = []) {
    if (!S.root || !snapshot) return;
    S.snap = snapshot;
    const red = snapshot.services.some(s => s.critical && s.status === 'down');
    if (red !== S.red) { S.red = red; document.documentElement.dataset.alert = red ? 'red' : ''; }
    if (!S.ready) {
      if (HD.data.connecting) { renderTopSegs(); return; }   // wait for the first live answer (or the mock fallback)
      S.ready = true;
      HD.perf.mark('first data');
      S.screenKey = null;
      route();
    } else {
      // services/hosts can disappear between polls: re-route if the current target vanished
      const r = S.route || {};
      if (r.screen === 'ship' && (!hostById(r.hostId) || (r.svcId && !svcById(r.svcId)))) route();
      else {
        if (S.view) S.view.update(snapshot);
        renderScreen();
        renderFrame();
      }
    }
    if (document.activeElement === E.input || !E.pop.hidden) renderSearch();
    const msgs = (changes || []).filter(c => c.kind === 'status').map(c => {
      const s = svcById(c.serviceId);
      return s ? `${s.name} is now ${ST_WORD[c.to] || c.to}${c.to !== 'healthy' && s.statusReason ? ': ' + s.statusReason : ''}.` : '';
    }).filter(Boolean);
    if (msgs.length) announce(msgs.join(' '));
  }

  HD.lcars = { init, update, nav, selectService, get route() { return S.route; } };
  // Listed in the theme menu of the glass UI (and linked from this rail); choosing it navigates to /lcars.
  HD.themes.register({ id: 'lcars', name: 'LCARS', kind: 'app', description: 'Full-screen LCARS display, no 3D' });
})();
</script>
<script>/* ==== app.js ==== */
/* HomeDeck app glue: boots modules in order and wires the data layer to scene + UI.
   Kept deliberately thin; modules talk to each other through HomeDeck.bus. */
(function () {
  'use strict';
  const HD = window.HomeDeck;
  let current = '';                                       // id of the theme on screen (kept up to date by every switch)

  function boot() {
    HD.perf.mark('boot');
    const B = HD.route.boot;
    // A URL that names a theme wins and becomes the saved choice; otherwise the saved one, else the first map theme.
    let themeId = B.id && HD.themes.get(B.id) ? B.id : HD.themes.defaultId;
    if (B.mode === 'lcars' && !HD.themes.get('lcars')) themeId = HD.themes.defaultId;       // LCARS code missing from this build
    if (B.from === 'url') HD.util.storage.set('theme', themeId);
    HD.route.set(themeId, false);                         // "/" becomes /<theme>, so the address always names what you see

    current = themeId;
    if (HD.themes.get(themeId)?.kind === 'app') bootLcars(); else bootScene(themeId);

    // Back/forward between themes: another front end needs a fresh page; between map themes just swap the scene.
    window.addEventListener('popstate', () => {
      const id = HD.route.idFromLocation();
      if (!id || id === current) return;                  // a hash change inside the LCARS app, or no theme in the URL
      const target = HD.themes.get(id);
      if (!target || (target.kind === 'app') !== (HD.themes.get(current).kind === 'app')) { location.reload(); return; }
      HD.bus.emit('theme:change', { id, fromHistory: true });
    });
    HD.bus.emit('app:ready', { themeId });
    if (/[?&]perf\b/.test(location.search)) perfOverlay();
  }

  /* 3D map themes (Starbase, Deep Space 9): scene under the glass panels. */
  function bootScene(themeId) {
    document.getElementById('hd-lcars')?.remove();
    const stage = document.getElementById('hd-stage');
    const pins = document.getElementById('hd-pins');
    const uiRoot = document.getElementById('hd-ui');
    const snap = HD.data.getSnapshot();

    HD.ui?.init(uiRoot, { themeId });
    HD.ui?.update(snap, []);

    // Let the panels and sky paint first, then build the 3D scene (geometry + shader compile take a while on phones).
    // three.js is fetched by the inline script in shell.html, in parallel with the page; wait for it here.
    requestAnimationFrame(() => setTimeout(async () => {
      const three = await (HD.route.boot.three || Promise.resolve(!!window.THREE));
      if (!three || !window.THREE || !HD.scene || !themeId) {
        const why = !three || !window.THREE
          ? 'three.js did not download from cdnjs. Check the connection and reload.'
          : !HD.scene ? 'the scene engine is missing from this build.'
          : 'no map theme is registered.';
        stage.insertAdjacentHTML('beforeend',
          `<p class="hd-stage-error">The 3D map could not load because ${why} The panels still show live status.</p>`);
        return;
      }
      await Promise.race([HD.geoCache.load(HD.build), new Promise(r => setTimeout(r, 800))]);   // never wait long on storage
      HD.bus.on('scene:ready', () => setTimeout(() => HD.geoCache.flush(), 1200));
      HD.perf.mark('scene start');
      HD.scene.init(stage, pins);
      HD.scene.update(HD.data.getSnapshot(), []);
      HD.scene.setTheme(themeId, { instant: true });
    }, 0));

    HD.data.subscribe((next, changes) => {
      HD.scene?.update(next, changes);
      HD.ui?.update(next, changes);
    });

    HD.bus.on('theme:change', ({ id, fromHistory }) => {
      const t = HD.themes.get(id);
      if (!t) return;
      HD.util.storage.set('theme', id);
      if (t.kind === 'app') { location.assign(HD.route.urlOf(id)); return; }     // a different front end: load it fresh
      current = id;
      if (!fromHistory) HD.route.set(id, true);
      HD.scene?.setTheme(id);
    });

    HD.data.start();
  }

  /* LCARS: one full-screen DOM app (src/lcars-*.js). No scene, no glass panels, no three.js. */
  function bootLcars() {
    ['hd-stage', 'hd-pins', 'hd-ui', 'hd-fade'].forEach(id => document.getElementById(id)?.remove());
    const root = document.getElementById('hd-lcars');
    HD.data.start();                                 // live probe starts first; the frame paints while it runs
    HD.perf.time('frame build', () => HD.lcars.init(root));
    HD.data.subscribe((snap, changes) => HD.lcars.update(snap, changes));
    if (!HD.data.connecting) HD.lcars.update(HD.data.getSnapshot(), []);   // demo data (?mock / file://): no probe to wait for
    requestAnimationFrame(() => requestAnimationFrame(() => HD.perf.mark('first paint')));
    document.fonts?.ready.then(() => HD.perf.mark('fonts ready'));
    HD.bus.on('theme:change', ({ id }) => {          // the LCARS rail's theme links
      if (!HD.themes.get(id)) return;
      HD.util.storage.set('theme', id);
      location.assign(HD.route.urlOf(id));
    });
  }

  /* ?perf overlay: load timeline + live frame stats, for tuning on real devices. */
  function perfOverlay() {
    const box = document.createElement('div');
    box.id = 'hd-perf';
    box.style.cssText = 'position:fixed;z-index:9;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);' +
      'padding:34px 10px 8px;border-radius:10px;background:rgba(0,0,0,.82);color:#d7ffd9;font:11px/1.35 ui-monospace,Menlo,monospace;max-width:94vw;pointer-events:none';
    const el = document.createElement('pre');
    el.style.cssText = 'margin:0;white-space:pre;overflow:hidden;max-height:60vh';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = 'Copy';
    btn.style.cssText = 'position:absolute;top:6px;right:6px;pointer-events:auto;font:600 11px/1 ui-monospace,Menlo,monospace;' +
      'padding:6px 10px;border-radius:6px;border:0;background:#d7ffd9;color:#000;cursor:pointer';
    box.append(el, btn);
    document.body.appendChild(box);
    const report = () => [
      `HomeDeck ${HD.version} perf  ${new Date().toISOString()}`,
      `theme ${HD.scene?.themeId || HD.route.boot.id || '-'} (${HD.route.boot.mode})  screen ${screen.width}x${screen.height} @${devicePixelRatio}  viewport ${innerWidth}x${innerHeight}`,
      navigator.userAgent, '', el.textContent].join('\n');
    // Clipboard API needs a secure context (https/localhost); plain-http LAN pages fall back to execCommand.
    btn.addEventListener('click', async () => {
      const text = report();
      let ok = false;
      try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { /* fall through */ }
      if (!ok) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove();
      }
      btn.textContent = ok ? 'Copied' : 'Copy failed';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1600);
    });
    let frames = 0, last = performance.now(), worst = 0, prev = last, fps = 0, avg = 0;
    const loop = now => { frames++; worst = Math.max(worst, now - prev); prev = now; requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    const res = n => performance.getEntriesByType('resource').find(r => r.name.includes(n));
    setInterval(() => {
      const now = performance.now(), dt = now - last; fps = Math.round(frames * 1000 / dt); avg = dt / Math.max(1, frames);
      const nav = performance.getEntriesByType('navigation')[0];
      const three = res('three.min.js'), font = res('fonts.googleapis.com/css2?family=Inter'), lc = res('Antonio');
      const d = HD.scene?.debug, info = d?.info?.() || {};
      const r = d?.renderer, px = r ? `${r.domElement.width}x${r.domElement.height} @${r.getPixelRatio().toFixed(2)}` : '-';
      const lines = [
        `fps ${fps}  avg ${avg.toFixed(1)}ms  worst ${worst.toFixed(0)}ms`,
        `draws ${info.calls ?? '-'}  tris ${info.triangles ? (info.triangles / 1000).toFixed(0) + 'k' : '-'}  geo ${info.geometries ?? '-'}  prog ${info.programs ?? '-'}`,
        `canvas ${px}`, `data ${HD.data.source}${HD.data.connecting ? ' (connecting)' : ''}${HD.route.boot.mode === 'lcars' ? '  screen ' + (location.hash || '-') : ''}`,
        ...Object.entries(HD.perf.info).map(([k, v]) => `${k} ${v}`),
        `cache hits ${HD.geoCache.stats.hits}  misses ${HD.geoCache.stats.misses}`,
        '-- load (ms) --',
        nav ? `html ${nav.responseEnd.toFixed(0)}  domready ${nav.domContentLoadedEventEnd.toFixed(0)}` : '',
        three ? `three.js ${three.duration.toFixed(0)} (${three.transferSize ? 'net' : 'cache'})` : 'three.js -',
        font ? `inter css ${font.duration.toFixed(0)}` : '', lc ? `antonio css ${lc.duration.toFixed(0)}` : '',
        ...HD.perf.marks.map(([n, v, k]) => k === 'dur' ? `  ${n}: ${v.toFixed(0)}` : `@${v.toFixed(0)} ${n}`),
        ...Object.entries(HD.perf.acc).map(([n, v]) => `  (sum) ${n}: ${v.toFixed(0)}`),
      ].filter(Boolean);
      el.textContent = lines.join('\n');
      frames = 0; worst = 0; last = now;
    }, 1000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
