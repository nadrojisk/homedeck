    S.searchResults = res;
    S.searchIdx = U.clamp(S.searchIdx, 0, Math.max(0, res.length - 1));
    const open = focused && !!q.trim();
    E.searchPop.hidden = !open;
    E.input.setAttribute('aria-expanded', String(open));
    if (!open) { E.input.removeAttribute('aria-activedescendant'); return; }
    const items = res.map((r, i) => {
      const active = i === S.searchIdx;
      let html;
      if (r.kind === 'host') {

        html = `<span class="hd-opt-ic">${icon('server')}</span><span class="hd-mi-main"><span class="hd-mi-t">${esc(r.h.name)}</span>` +
          `<span class="hd-mi-s">${esc(r.h.hardware || 'Host')}</span></span><span class="hd-opt-tag">Host, ${st.up}/${st.total} up</span>`;
      } else {

        html = `<span class="hd-opt-ic is-${ST_CLS[s.status]}"><span class="hd-dot"></span></span><span class="hd-mi-main"><span class="hd-mi-t">${esc(s.name)}</span>` +

    patch(E.searchList, items);

    E.input.select();
  }
  function closeMobileSearch() { E.top.classList.remove('is-search'); }

  /* ---------------- KPIs ---------------- */
  function delta(el, d, opts) {
    if (!el) return;
    if (d == null || !isFinite(d)) {           // no 24 h baseline yet (live collector) -> no delta at all
      if (el._h !== '') { el.innerHTML = ''; el._h = ''; el.className = 'hd-delta'; el.removeAttribute('title'); }
      return;
    }
    const v = Math.abs(d);
    const txt = v === 0 ? 'No change' : fmtNum(v) + (opts.unit || '');
    const dir = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
    const tone = dir === 'flat' ? 'flat' : opts.tone(d);
    const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '';
    const html = `${arrow ? `<span aria-hidden="true">${arrow}</span>` : ''}<span class="hd-num">${esc(txt)}</span>${v === 0 ? '' : '<span class="hd-delta-l">vs 24h</span>'}`;
    if (el._h !== html) { el.innerHTML = html; el._h = html; }
    el.className = `hd-delta is-${tone}`;
    el.setAttribute('title', `${dir === 'flat' ? 'No change' : (dir === 'up' ? 'Up ' : 'Down ') + txt} compared with 24 hours ago`);
  }
  function renderKpis() {
    const k = S.snap?.kpis; if (!k) return;
    const card = n => E.kpis.querySelector(`[data-kpi="${n}"]`);
    const f = (c, n) => c.querySelector(`[data-f="${n}"]`);

    const sc = card('services');
    tweenNum(f(sc, 'v'), k.servicesUp, 0);
    setText(f(sc, 'of'), `/${k.servicesTotal}`);
    const parts = [];
    if (k.servicesDown) parts.push(`<span class="hd-mini is-down"><span class="hd-dot"></span>${k.servicesDown} down</span>`);
    if (k.servicesDegraded) parts.push(`<span class="hd-mini is-warn"><span class="hd-dot"></span>${k.servicesDegraded} degraded</span>`);
    if (!parts.length) parts.push('<span class="hd-mini is-ok"><span class="hd-dot"></span>All healthy</span>');
    const sh = parts.join('');
    const subEl = f(sc, 'sub');
    if (subEl._h !== sh) { subEl.innerHTML = sh; subEl._h = sh; }
    delta(f(sc, 'delta'), k.deltas?.servicesUp, { tone: d => (d < 0 ? 'bad' : 'good') });

    // Pi-hole and ZFS numbers are null when the collector has no such source: show an empty state, not "0".
    const num = v => typeof v === 'number' && isFinite(v);
    const dc = card('dns'), hasDns = num(k.dnsBlockedPct);
    dc.classList.toggle('is-empty', !hasDns);
    if (hasDns) tweenNum(f(dc, 'v'), k.dnsBlockedPct, 1); else { f(dc, 'v')._v = null; setText(f(dc, 'v'), '—'); }
    f(dc, 'unit').hidden = !hasDns;
    setText(f(dc, 'sub'), hasDns ? `${fmtK(k.dnsBlocked24h)} of ${fmtK(k.dnsQueries24h)} today` : 'Pi-hole not configured');
    delta(f(dc, 'delta'), hasDns ? k.deltas?.dnsBlockedPct : null, { unit: ' pts', tone: d => (d > 0 ? 'good' : 'flat') });

    const zc = card('zfs'), hasZfs = num(k.zfsUsedPct);
    zc.classList.toggle('is-empty', !hasZfs);
    if (hasZfs) tweenNum(f(zc, 'v'), k.zfsUsedPct, Number.isInteger(k.zfsUsedPct) ? 0 : 1); else { f(zc, 'v')._v = null; setText(f(zc, 'v'), '—'); }
    f(zc, 'unit').hidden = !hasZfs;
    setText(f(zc, 'sub'), hasZfs ? `${k.zfsUsedTB ?? '—'} of ${k.zfsSizeTB ?? '—'} TB` : 'No ZFS pool found');
    const bar = f(zc, 'bar');
    bar.hidden = !hasZfs;
    bar.style.setProperty('--v', U.clamp(k.zfsUsedPct || 0, 0, 100) + '%');
    bar.className = `hd-meter hd-kpi-bar is-${k.zfsUsedPct >= 90 ? 'down' : k.zfsUsedPct >= 80 ? 'warn' : 'ok'}`;
    const health = String(k.zfsHealth || '');
    const hs = health === 'ONLINE' ? 'healthy' : health === 'DEGRADED' ? 'degraded' : 'down';
    const hh = health ? `<span class="hd-chip is-${ST_CLS[hs]} hd-chip-sm" title="Pool health: ${esc(health)}"><span class="hd-dot"></span>${esc(health.charAt(0) + health.slice(1).toLowerCase())}</span>` : '';
    const hEl = f(zc, 'health');
    if (hEl._h !== hh) { hEl.innerHTML = hh; hEl._h = hh; }
    delta(f(zc, 'delta'), hasZfs ? k.deltas?.zfsUsedPct : null, { unit: ' pts', tone: d => (d > 0 ? 'meh' : 'good') });
  }

  /* ---------------- Timeline ---------------- */
  function eventCls(ev) {
    if (ev.kind === 'status') return ST_CLS[ev.to] || 'idle';
    return { restart: 'sky', deploy: 'lilac', info: 'idle' }[ev.kind] || 'idle';
  }
  function renderTimeline() {
    const events = (S.snap?.events || []).slice(0, 6);
    const items = events.map(ev => {
      const s = svcById(ev.serviceId);
      return {
        key: ev.id, tag: 'button', animate: true, wcls: 'hd-step-li',
        cls: 'hd-step' + (ev.serviceId && ev.serviceId === S.selected ? ' is-selected' : ''),
        attrs: { type: 'button', 'data-act': 'select', 'data-id': ev.serviceId, 'aria-label': `${ev.message}, ${U.relTime(ev.ts)}` },
        html: `<span class="hd-step-node is-${eventCls(ev)}" aria-hidden="true">${icon(KIND_ICON[ev.kind] || 'info')}</span>` +
          `<span class="hd-step-body"><span class="hd-step-msg">${esc(ev.message)}</span>` +
          `<span class="hd-step-meta"><span>${esc(s?.name || ev.serviceId || ev.hostId || '')}</span>` +
          `<time datetime="${isoTime(ev.ts)}" title="${esc(absTime(ev.ts))}">${esc(U.relTime(ev.ts))}</time></span></span>`,
      };
    });
    if (!items.length) items.push({ key: 'empty', html: '<p class="hd-empty">No activity yet. Restarts, deploys and status changes will appear here.</p>' });
    S.root.querySelectorAll('[data-tl]').forEach(ol => patch(ol, items, 'li'));
  }

  /* ---------------- Inventory list ---------------- */
  function serviceRow(s) {
    const bad = s.status !== 'healthy';
    const sub = bad && s.statusReason ? s.statusReason : typeLabel(s.type) + (s.placeholder ? ', placeholder' : '');
    const hm = s.metrics && s.metrics[0];
    const end = bad ? chip(s.status) : hm
      ? `<span class="hd-row-metric"><span class="hd-num">${esc(heroText(s))}</span><small>${esc(hm.label)}</small></span>` : '';
    return {
      key: 's-' + s.id, tag: 'button', wcls: '',
      cls: `hd-row${s.id === S.selected ? ' is-selected' : ''}${s.id === S.hover ? ' is-hover' : ''}${s.placeholder ? ' is-placeholder' : ''}`,
      attrs: { type: 'button', 'data-act': 'select', 'data-id': s.id, 'data-hover': s.id, 'aria-current': s.id === S.selected ? 'true' : null },
      html: `<span class="hd-dot is-${ST_CLS[s.status]}" aria-hidden="true"></span>` +
        `<span class="hd-row-main"><span class="hd-row-t">${esc(s.name)}</span><span class="hd-row-s${bad ? ' is-' + ST_CLS[s.status] : ''}">${esc(sub)}</span></span>` +
        `<span class="hd-row-end">${end}</span>${icon('chevRight', 'hd-row-chev')}` +
        `<span class="hd-visually-hidden">, ${ST_LABEL[s.status]}</span>`,
    };
  }
  function renderList() {
    if (!S.snap) return;
    const { services, hosts } = S.snap;
    const alerts = activeAlerts();
    const counts = { services: services.length, hosts: hosts.length, alerts: alerts.length };
    for (const k in counts) {
      const el = S.root.querySelector(`[data-count="${k}"]`);
      setText(el, String(counts[k]));
      if (k === 'alerts') el?.classList.toggle('is-hot', counts[k] > 0);
      if (k === 'alerts') el?.classList.toggle('is-crit', alerts.some(x => x.severity === 'critical'));
    }

    // Services: grouped by host (focused host first), problems first inside a group.
    const order = [...hosts].sort((a, b) => (b.id === S.hostFilter) - (a.id === S.hostFilter) || (a.role === 'primary' ? -1 : 1));
    const sItems = [];
    order.forEach(h => {
      const list = services.filter(s => s.host === h.id)
        .sort((a, b) => RANK[a.status] - RANK[b.status] || a.placeholder - b.placeholder || a.name.localeCompare(b.name));
      if (!list.length) return;
      const st = hostStats(h.id);
      sItems.push({ key: 'g-' + h.id, wcls: '', cls: 'hd-group', attrs: { role: 'presentation' },
        html: `<span class="hd-group-t">${esc(h.name)}</span><span class="hd-group-m hd-num">${st.up}/${st.total} up</span>` });
      list.forEach(s => sItems.push(serviceRow(s)));
    });
    patch(S.root.querySelector('[data-rows="services"]'), sItems, 'li');

    const hItems = hosts.map(h => {
      const st = hostStats(h.id);
      const memPct = h.memTotalMB ? (h.memUsedMB / h.memTotalMB) * 100 : 0;
      return {
        key: 'h-' + h.id, tag: 'button',
        cls: `hd-row hd-row-host${S.hostFilter === h.id ? ' is-selected' : ''}`,
        attrs: { type: 'button', 'data-act': 'hostfocus', 'data-host': h.id },
        html: `<span class="hd-row-ic">${icon('server')}</span>` +
          `<span class="hd-row-main"><span class="hd-row-t"><span class="hd-row-name">${esc(h.name)}</span><span class="hd-tag">${h.placeholder ? 'Placeholder' : h.role === 'primary' ? 'Primary' : 'Secondary'}</span>` +
          `<span class="hd-row-up is-${st.cls}"><span class="hd-dot"></span>${st.up}/${st.total} up</span></span>` +
          `<span class="hd-row-s">${esc((h.hardware || '').replace(/\s*\(.*\)$/, ''))}, ${esc(h.os || '')}</span>` +
          `<span class="hd-row-meters">` +
          `<span class="hd-mm"><span class="hd-mm-l">CPU</span><span class="hd-meter"><span style="--v:${U.clamp(h.cpu || 0, 0, 100)}%"></span></span><span class="hd-num">${Math.round(h.cpu || 0)}%</span></span>` +
          `<span class="hd-mm"><span class="hd-mm-l">Memory</span><span class="hd-meter"><span style="--v:${memPct.toFixed(1)}%"></span></span><span class="hd-num">${fmtGB(h.memUsedMB)}/${fmtGB(h.memTotalMB)} GB</span></span>` +
          `</span></span>` +
          `${icon('chevRight', 'hd-row-chev')}`,
      };
    });
    patch(S.root.querySelector('[data-rows="hosts"]'), hItems, 'li');

    const aItems = alerts.map(a => {
      const s = svcById(a.serviceId);
      const cls = a.severity === 'critical' ? 'down' : 'warn';
      return {
        key: 'a-' + a.id, tag: 'button',
        cls: `hd-row hd-row-alert${a.serviceId === S.selected ? ' is-selected' : ''}`,
        attrs: { type: 'button', 'data-act': 'select', 'data-id': a.serviceId, 'data-hover': a.serviceId },
        html: `<span class="hd-row-ic is-${cls}">${icon('alert')}</span>` +
          `<span class="hd-row-main"><span class="hd-row-t">${esc(s?.name || a.serviceId)}<span class="hd-tag is-${cls}">${a.severity === 'critical' ? 'Critical' : 'Warning'}</span></span>` +
          `<span class="hd-row-s hd-clamp2">${esc(a.message)}</span></span>` +
          `<span class="hd-row-end"><time class="hd-row-time" datetime="${isoTime(a.ts)}" title="${esc(absTime(a.ts))}">${esc(U.relTime(a.ts))}</time></span>${icon('chevRight', 'hd-row-chev')}`,
      };
    });
    if (!aItems.length) aItems.push({ key: 'empty', wcls: '', cls: 'hd-empty-li',
      html: `<div class="hd-empty"><span class="hd-empty-ic is-ok">${icon('check')}</span><p><strong>No active alerts.</strong> Services report healthy. New warnings show up here and on the bell.</p></div>` });
    patch(S.root.querySelector('[data-rows="alerts"]'), aItems, 'li');
  }

  function visibleTabs() {
    return [...S.root.querySelectorAll('.hd-tab')]
      .filter(t => getComputedStyle(t).display !== 'none')
      .sort((a, b) => (parseInt(getComputedStyle(a).order, 10) || 0) - (parseInt(getComputedStyle(b).order, 10) || 0));
  }
  function setTab(id, focus) {
    if (id === 'timeline' && !isMobile()) id = 'services';
    S.tab = id;
    S.root.querySelectorAll('.hd-tab').forEach(t => {
      const on = t.dataset.tab === id;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
    });
    S.root.querySelectorAll('.hd-tp').forEach(p => { p.hidden = p.id !== 'hd-tp-' + id; });
  }

  /* ---------------- Detail extras: containers, checks, logs (live collector fields) ---------------- */
  const MEMBER_LIMIT = 6;
  const cap1 = t => (t ? String(t).charAt(0).toUpperCase() + String(t).slice(1) : '');
  const tsOf = v => (typeof v === 'number' ? v : v ? Date.parse(v) : NaN);
  function memberTone(m) {
    if (m.state !== 'running') return m.state === 'restarting' ? 'warn' : m.state === 'paused' || m.state === 'created' ? 'idle' : 'down';
    return m.health === 'unhealthy' ? 'down' : m.health === 'starting' ? 'warn' : 'ok';
  }
  const stateCls = st => (st === 'running' ? 'ok' : st === 'restarting' ? 'warn' : st === 'exited' || st === 'dead' ? 'down' : 'idle');
  function membersSection(s) {
    const list = Array.isArray(s.members) ? s.members.filter(m => m && m.name) : [];
    if (!list.length) return null;
    const RK = { down: 0, warn: 1, idle: 2, ok: 3 };
    const sorted = list.map(m => ({ m, tone: memberTone(m) }))
      .sort((a, b) => RK[a.tone] - RK[b.tone] || String(a.m.name).localeCompare(String(b.m.name)));
    const running = list.filter(m => m.state === 'running').length;
    const big = list.length > MEMBER_LIMIT, open = !big || S.membersOpen.has(s.id);
    // Collapsed (> 6 containers): only the ones that need attention stay visible.
    const shown = open ? sorted : sorted.filter(x => x.tone === 'down' || x.tone === 'warn').slice(0, MEMBER_LIMIT);
    const rows = shown.map(({ m, tone }) => {
      const healthCls = m.health === 'healthy' ? 'ok' : m.health === 'unhealthy' ? 'down' : 'warn';
      // Compose service is the short, readable label; the container name follows the numbers in the sub line.
      const label = m.service || m.name, bits = [];
      if (m.state === 'running') {
        if (m.cpu != null) bits.push(`CPU ${esc(fmtNum(+m.cpu || 0))}%`);
        if (m.memMB != null) bits.push(esc(U.fmtMem(m.memMB)));
      }
      if (m.restarts) bits.push(`${esc(m.restarts)} restart${m.restarts === 1 ? '' : 's'}`);
      if (label !== m.name) bits.push(esc(m.name));
      return `<li class="hd-ct is-${tone}"><span class="hd-dot" aria-hidden="true"></span>` +
        `<span class="hd-ct-main"><span class="hd-ct-name" title="${esc(m.name)}">${esc(label)}</span>` +
        (bits.length ? `<span class="hd-ct-sub hd-num">${bits.join('<span aria-hidden="true"> · </span>')}</span>` : '') + `</span>` +
        `<span class="hd-ct-chips"><span class="hd-chip hd-chip-sm is-${stateCls(m.state)}">${esc(cap1(m.state || 'unknown'))}</span>` +
        (m.health ? `<span class="hd-chip hd-chip-sm is-${healthCls}">${esc(cap1(m.health))}</span>` : '') + `</span></li>`;
    }).join('');
    const toggle = big
      ? `<button type="button" class="hd-d-more" data-act="members-toggle" data-svc="${esc(s.id)}" aria-expanded="${open}">` +
        `${open ? 'Show fewer' : `${list.length} containers`}${icon('chevDown', 'hd-chev')}</button>` : '';
    return { key: 'members', cls: 'hd-d-sec hd-d-members',
      html: `<h3 class="hd-d-h">Containers<span class="hd-d-hm hd-num">${running}/${list.length} running</span></h3>` +
        (rows ? `<ul class="hd-cts">${rows}</ul>` : '') + toggle };
  }
  function checksSection(s) {
    const list = Array.isArray(s.checks) ? s.checks.filter(c => c && c.name) : [];
    if (!list.length) return null;
    const ok = list.filter(c => c.success).length;
    const rows = list.slice().sort((a, b) => (!!a.success - !!b.success) || String(a.name).localeCompare(String(b.name))).map(c => {
      const t = tsOf(c.lastCheck), meta = [];
      if (isFinite(t)) meta.push(`<time datetime="${isoTime(t)}" title="${esc(absTime(t))}">${esc(U.relTime(t))}</time>`);
      if (c.durationMs != null) meta.push(`${esc(fmtNum(Math.round(c.durationMs)))} ms`);
      return `<li class="hd-ck is-${c.success ? 'ok' : 'down'}"><span class="hd-dot" aria-hidden="true"></span>` +
        `<span class="hd-ct-main"><span class="hd-ct-name">${esc(c.name)}</span>` +
        ((c.group || c.hostname) ? `<span class="hd-ct-sub">${esc([c.group, c.hostname].filter(Boolean).join(' · '))}</span>` : '') + `</span>` +
        `<span class="hd-ck-end"><span class="hd-ck-st">${c.success ? 'Passing' : 'Failing'}</span>` +
        (meta.length ? `<span class="hd-ct-sub hd-num">${meta.join(' · ')}</span>` : '') + `</span></li>`;
    }).join('');
    return { key: 'checks', cls: 'hd-d-sec hd-d-checks',
      html: `<h3 class="hd-d-h">Health checks<span class="hd-d-hm hd-num">${ok}/${list.length} passing</span></h3><ul class="hd-cts">${rows}</ul>` };
  }
  const logTime = ts => new Date(ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  // eslint-disable-next-line no-control-regex
  const cleanLine = t => String(t).replace(/\u001b\[[0-9;?]*[A-Za-z]/g, '').replace(/\s+/g, ' ').trim();
  /* "media_stack-radarr-1" -> "radarr": the compose service from members, else the name minus project prefix/replica. */
  function shortContainer(s) {
    const map = new Map((Array.isArray(s.members) ? s.members : []).filter(m => m && m.name && m.service).map(m => [m.name, m.service]));
    const pre = new RegExp('^(' + [s.id, s.id.replace(/-/g, '_')].map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')[-_]');
    return c => map.get(c) || String(c).replace(pre, '').replace(/[-_]\d+$/, '') || c;
  }
  function logsSection(s) {
    if (s.placeholder) return null;
    const head = '<h3 class="hd-d-h">Recent logs<span class="hd-d-hm">Last hour</span></h3>';
    const note = t => ({ key: 'logs', cls: 'hd-d-sec hd-d-logs', html: head + `<p class="hd-d-note">${t}</p>` });
    if (HD.data?.source !== 'live') return note('Logs are available with live data.');
    const L = S.logs.id === s.id ? S.logs : { state: 'idle', lines: null };
    if (!L.lines) {
      if (L.state === 'error') return note(`Logs unavailable: ${esc(L.error || 'unknown error')}`);
      return note('<span class="hd-d-spin" aria-hidden="true"></span>Loading logs…');
    }
    if (!L.lines.length) return note(L.state === 'error' ? `Logs unavailable: ${esc(L.error || 'unknown error')}` : 'No log lines in the last hour.');
    const multi = new Set(L.lines.map(l => l.container)).size > 1;
    const short = shortContainer(s);
    const rows = L.lines.map(l => {
      const msg = l.text || cleanLine(l.line), lvl = l.level === 'error' || l.level === 'warn' ? l.level : 'info';
      return `<li class="hd-log is-${lvl}" title="${esc(msg)}">` +
        `<time class="hd-num" datetime="${isoTime(l.ts || 0)}">${esc(l.ts ? logTime(l.ts) : '')}</time>` +
        (multi && l.container ? `<span class="hd-log-c" title="${esc(l.container)}">${esc(short(l.container))}</span>` : '') +
        `<span class="hd-log-m">${esc(msg)}</span></li>`;
    }).join('');
    return { key: 'logs', cls: 'hd-d-sec hd-d-logs',
      html: head + `<ol class="hd-logs" aria-label="Recent log lines, newest first">${rows}</ol>` +
        (L.state === 'error' ? `<p class="hd-d-note">Refresh failed: ${esc(L.error || 'unknown error')}</p>` : '') };
  }
  /* Poll logs for the service shown in the card (live mode only); stops as soon as the card closes or switches. */
  function syncLogs(s) {
    const want = s && !s.placeholder && HD.data?.source === 'live' && HD.data.watchLogs ? s.id : null;
    if (want === S.logs.id) return;
    if (S.logsStop) { S.logsStop(); S.logsStop = null; }
    S.logs = { id: want, state: 'idle', lines: null, error: null };
    if (!want) return;
    S.logsStop = HD.data.watchLogs(want, { limit: 30, every: 10000 }, r => {
      if (S.logs.id !== want || r.state === 'loading') return;
      S.logs = { id: want, state: r.state, lines: r.lines, error: r.error };
      renderDetail();
    });
  }

  /* ---------------- Host card ----------------
     Clicking a host in the scene (a ship, a pin) lists every service on it in a glass card, since a theme may have no way
     to click services themselves (Deep Space 9 shows them only as hull lights). It sits in the detail slot: opening a
     service shows that service's detail card instead, and closing it brings this card back. */
  const syncOpen = () => S.root.classList.toggle('hd-detail-open', !E.detail.hidden || !E.hostcard.hidden);
  function renderHostCard() {
    const c = E.hostcard;
    if (!c) return;
    const h = S.hostCard && !S.selected ? hostById(S.hostCard) : null;
    if (!h) { if (!c.hidden) c.hidden = true; syncOpen(); return; }
    const opening = c.hidden;
    c.hidden = false;
    syncOpen();
    if (opening) { c.classList.remove('is-enter'); void c.offsetWidth; c.classList.add('is-enter'); }
    const st = hostStats(h.id);
    c.dataset.status = st.worst;
    setText(E.f.hname, h.name);
    setText(E.f.hsub, [(h.hardware || '').replace(/\s*\(.*\)$/, ''), h.ip].filter(Boolean).join('  ·  ') || (h.placeholder ? 'Placeholder host' : 'Host'));
    patch(E.f.hstat, [{ key: 'chip', html: `${chip(st.worst, `${st.up}/${st.total} up`)}${h.placeholder ? '<span class="hd-tag">Placeholder</span>' : ''}` }]);
    const memPct = h.memTotalMB ? Math.round((h.memUsedMB || 0) / h.memTotalMB * 100) : null;
    E.f.hgrid.innerHTML =
      `<div><dt>CPU</dt><dd class="hd-num">${h.cpu == null ? '–' : Math.round(h.cpu) + '%'}</dd></div>` +
      `<div><dt>Memory</dt><dd class="hd-num">${memPct == null ? '–' : memPct + '%'}${h.memTotalMB ? `<small>of ${Math.round(h.memTotalMB / 1024)} GB</small>` : ''}</dd></div>` +
      `<div><dt>Uptime</dt><dd class="hd-num">${esc(U.fmtUptime(h.uptimeSec))}</dd></div>` +
      `<div><dt>Services</dt><dd class="hd-num">${st.total}</dd></div>`;
    const list = (S.snap?.services || []).filter(x => x.host === h.id)
      .sort((a, b) => RANK[a.status] - RANK[b.status] || a.placeholder - b.placeholder || a.name.localeCompare(b.name));
    patch(E.f.hrows, list.map(serviceRow), 'li');
  }
  function closeHostCard() {
    if (!S.hostCard) return;
    S.hostCard = null;
    renderHostCard();
    HD.bus.emit('host:select', { hostId: null, source: 'hostcard' });
    HD.bus.emit('host:focus', { hostId: 'all', source: 'hostcard' });     // back to the whole map (re-fits it now the card is gone); the list un-filters too
  }

  /* ---------------- Detail ---------------- */
  // A theme host view with `ownsDetail` shows service details inside its own frame; the engine flags that
  // on <html>. Selection is still tracked (rows, timeline, S.selected) but the card/sheet stays closed.
  const hostViewOwnsDetail = () => document.documentElement.dataset.hostviewDetail === '1';
  function renderDetail() {
    const d = E.detail;
    const s = S.selected && !hostViewOwnsDetail() ? svcById(S.selected) : null;
    syncLogs(s);
    if (!s) { if (!d.hidden) d.hidden = true; renderHostCard(); syncOpen(); return; }
    const opening = d.hidden;
    d.hidden = false;
    renderHostCard();                       // a service card replaces the host card (closing it brings the host card back)
    syncOpen();
    d.dataset.status = s.status;
    if (opening) { d.classList.remove('is-enter'); void d.offsetWidth; d.classList.add('is-enter'); }

    const host = hostById(s.host);
    setText(E.f.dname, s.name);
    setText(E.f.dsub, `${typeLabel(s.type)} on ${host ? host.name : s.host}`);
    const open = E.f.dopen;
    if (s.url) { open.hidden = false; setAttr(open, 'href', s.url); setAttr(open, 'aria-label', `Open ${s.name} in a new tab`); }
    else open.hidden = true;

    const sections = [];
    sections.push({ key: 'status', cls: 'hd-d-status',
      html: `${chip(s.status)}${s.critical ? '<span class="hd-tag">Critical path</span>' : ''}${s.placeholder ? '<span class="hd-tag">Placeholder</span>' : ''}` +
        (s.statusReason ? `<p class="hd-d-reason is-${ST_CLS[s.status]}">${esc(s.statusReason)}</p>` : '') +
        (s.description ? `<p class="hd-d-desc">${esc(s.description)}</p>` : '') });

    const m = s.metrics || [];
    if (m.length) {
      const [hero, ...rest] = m;
      sections.push({ key: 'metrics', cls: 'hd-d-metrics',
        html: `<div class="hd-hero"><span class="hd-hero-v hd-num">${esc(fmtNum(hero.value))}<small>${esc(hero.unit || '')}</small></span><span class="hd-hero-l">${esc(hero.label)}</span></div>` +
          (rest.length ? `<dl class="hd-mgrid">${rest.slice(0, 4).map(x =>
            `<div><dt>${esc(x.label)}</dt><dd class="hd-num">${esc(fmtNum(x.value))}${x.unit ? `<small>${esc(x.unit)}</small>` : ''}</dd></div>`).join('')}</dl>` : '') });
    }

    const memPct = s.memLimitMB ? U.clamp((s.memMB / s.memLimitMB) * 100, 0, 100) : null;
    const cpu = U.clamp(s.cpu || 0, 0, 100);
    sections.push({ key: 'stats', cls: 'hd-d-stats',
      html: `<dl class="hd-sgrid">` +
        `<div><dt>Uptime</dt><dd class="hd-num">${esc(s.status === 'down' ? 'Stopped' : U.fmtUptime(s.uptimeSec))}</dd></div>` +
        `<div><dt>Last restart</dt><dd>${s.lastRestart ? `<time datetime="${isoTime(s.lastRestart)}" title="${esc(absTime(s.lastRestart))}">${esc(U.relTime(s.lastRestart))}</time>` : '—'}</dd></div>` +
        `<div><dt>CPU</dt><dd class="hd-num">${esc(fmtNum(s.cpu || 0))}%<span class="hd-meter"><span style="--v:${cpu}%"></span></span></dd></div>` +
        `<div><dt>Memory</dt><dd class="hd-num">${esc(U.fmtMem(s.memMB))}${s.memLimitMB ? `<small> of ${esc(U.fmtMem(s.memLimitMB))}</small>` : ''}` +
        (memPct != null ? `<span class="hd-meter"><span style="--v:${memPct.toFixed(1)}%"></span></span>` : '') + `</dd></div>` +
        `</dl>` });

    const ports = (s.ports || []).length
      ? `<span class="hd-ports">${s.ports.map(p => `<span class="hd-port hd-num">${esc(p)}</span>`).join('')}</span>`
      : '<span class="hd-muted">Internal only</span>';
    sections.push({ key: 'info', cls: 'hd-d-info',
      html: `<dl class="hd-kv">` +
        `<div><dt>Image</dt><dd class="hd-break">${esc(s.image || '—')}</dd></div>` +
        `<div><dt>Ports</dt><dd>${ports}</dd></div>` +
        (s.url ? `<div><dt>URL</dt><dd><a class="hd-link hd-break" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url.replace(/^https?:\/\//, ''))}</a></dd></div>` : '') +
        `<div><dt>Host</dt><dd><button type="button" class="hd-linkbtn" data-act="hostfocus" data-host="${esc(s.host)}">${esc(host ? host.name : s.host)}</button>${host?.ip ? `<span class="hd-muted hd-num"> ${esc(host.ip)}</span>` : ''}</dd></div>` +
        `</dl>` });
    [membersSection(s), checksSection(s), logsSection(s)].forEach(x => { if (x) sections.push(x); });
    patch(E.f.dbody, sections);
  }

  function openDetail(id, source) {
    const prev = S.selected;
    if (id && S.snap && !svcById(id)) id = null;
    if (id && !prev) {
      const a = document.activeElement;
      S.returnFocus = a && S.root.contains(a) && a !== E.input ? a : null;
    }
    S.selected = id || null;
    renderDetail();
    renderList();
    renderTimeline();
    if (id && (source === 'list' || source === 'search') && !E.detail.hidden) E.detail.focus({ preventScroll: true });
    if (!id && prev && E.detail.contains(document.activeElement) === false && document.activeElement === document.body && S.returnFocus) {
      if (document.contains(S.returnFocus)) S.returnFocus.focus({ preventScroll: true });
    }
    if (!id) S.returnFocus = null;
  }
  function closeDetail() {
    const hadFocus = E.detail.contains(document.activeElement);
    const back = S.returnFocus;
    HD.bus.emit('service:select', { id: null, source: 'detail' });
    if (S.selected) { S.selected = null; renderDetail(); renderList(); renderTimeline(); }
    if (hadFocus && back && document.contains(back) && back.offsetParent !== null) back.focus({ preventScroll: true });
  }

  /* ---------------- Mobile sheets ---------------- */
  function setSheet(open) {
    S.sheetOpen = !!open;
    E.list.classList.toggle('is-open', S.sheetOpen);
    S.root.classList.toggle('hd-sheet-open', S.sheetOpen);
    const h = E.list.querySelector('[data-act="sheet"]');
    h.setAttribute('aria-expanded', String(S.sheetOpen));
    h.setAttribute('aria-label', S.sheetOpen ? 'Collapse panel' : 'Expand panel');
  }
  function bindDrag() {
    let drag = null;
    S.root.addEventListener('pointerdown', e => {
      const h = e.target.closest('[data-drag]');
      if (!h || !isMobile()) return;
      const sheet = h.dataset.drag === 'sheet' ? E.list : h.dataset.drag === 'hostcard' ? E.hostcard : E.detail;
      const m = new DOMMatrixReadOnly(getComputedStyle(sheet).transform);
      drag = { kind: h.dataset.drag, sheet, y0: e.clientY, t0: m.m42, moved: false, id: e.pointerId };
      h.setPointerCapture?.(e.pointerId);
    });
    S.root.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const dy = e.clientY - drag.y0;
      if (!drag.moved && Math.abs(dy) < 6) return;
      drag.moved = true;
      const sheet = drag.sheet;
      sheet.style.transition = 'none';
      let t;
      if (drag.kind === 'sheet') {
        const header = sheet.querySelector('.hd-list-h');
        const closed = sheet.offsetHeight - (header.offsetTop + header.offsetHeight + 8);
        t = U.clamp(drag.t0 + dy, 0, closed);
      } else t = Math.max(0, drag.t0 + dy);
      sheet.style.transform = `translateY(${t}px)`;
    });
    const end = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const dy = e.clientY - drag.y0;
      const { sheet, kind, moved } = drag;
      drag = null;
      sheet.style.transition = '';
      sheet.style.transform = '';
      if (!moved) return; // a tap: click handler toggles
      sheet._dragged = true;
      setTimeout(() => { sheet._dragged = false; }, 50);
      if (kind === 'sheet') setSheet(dy < -30 ? true : dy > 30 ? false : S.sheetOpen);
      else if (dy > 90) { if (kind === 'hostcard') closeHostCard(); else closeDetail(); }
    };
    S.root.addEventListener('pointerup', end);
    S.root.addEventListener('pointercancel', end);
  }

  /* ---------------- Events ---------------- */
  function onClick(e) {
    const t = e.target.closest('[data-act],[data-cmd],[data-tab]');
    if (!t || !S.root.contains(t)) return;
    if (t.dataset.cmd) { HD.bus.emit('camera:cmd', { cmd: t.dataset.cmd }); return; }
    if (t.dataset.tab) { setTab(t.dataset.tab); if (isMobile() && !S.sheetOpen) setSheet(true); return; }
    const id = t.dataset.id;
    switch (t.dataset.act) {
      case 'pop': openPop(t.dataset.pop, e.detail === 0); break;
      case 'host':
        S.hostFilter = t.dataset.host;
        closePop(true);
        HD.bus.emit('host:focus', { hostId: S.hostFilter });
        renderTop(); renderList();
        break;
      case 'hostfocus':
        S.hostFilter = t.dataset.host;
        HD.bus.emit('host:focus', { hostId: S.hostFilter });
        renderTop(); renderList();
        break;
      case 'theme':
        closePop(true);
        if (t.dataset.theme !== S.themeId) { S.themeId = t.dataset.theme; HD.bus.emit('theme:change', { id: S.themeId }); renderTop(); }
        break;
      case 'select':
        if (!id) break;
        closePop(false);
        HD.bus.emit('service:select', { id, source: 'list' });
        if (isMobile()) setSheet(false);
        break;
      case 'result': chooseResult(t.dataset.kind, id); break;
      case 'detail-close': closeDetail(); break;
      case 'host-close': closeHostCard(); break;
      case 'members-toggle': {
        const sid = t.dataset.svc;
        if (S.membersOpen.has(sid)) S.membersOpen.delete(sid); else S.membersOpen.add(sid);
        renderDetail();
        E.f.dbody.querySelector('[data-act="members-toggle"]')?.focus({ preventScroll: true });
        break;
      }
      case 'focus-cam': if (S.selected) HD.bus.emit('camera:focus', { id: S.selected }); break;
      case 'search-open': openSearch(); break;
      case 'search-close': E.input.value = ''; renderSearch(); closeMobileSearch(); E.input.blur(); break;
      case 'sheet': if (!E.list._dragged) setSheet(!S.sheetOpen); break;
    }
  }

  function onRootKeydown(e) {
    const t = e.target;
    // Tabs: roving focus with arrows.
    if (t.classList?.contains('hd-tab')) {
      const tabs = visibleTabs(); const i = tabs.indexOf(t);
      let n = -1;
      if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') n = 0;
      else if (e.key === 'End') n = tabs.length - 1;
      if (n >= 0) { e.preventDefault(); setTab(tabs[n].dataset.tab, true); }
      return;
    }
    if (t.dataset?.act === 'sheet' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setSheet(!S.sheetOpen); return; }
    // Menus: arrows move between items; ArrowDown on a trigger opens it.
    const pop = t.closest?.('.hd-pop');
    if (pop && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Home' || e.key === 'End')) {
      const items = [...pop.querySelectorAll('button')];
      const i = items.indexOf(t);
      let n = e.key === 'ArrowDown' ? i + 1 : e.key === 'ArrowUp' ? i - 1 : e.key === 'Home' ? 0 : items.length - 1;
      n = (n + items.length) % items.length;
      items[n]?.focus(); e.preventDefault();
      return;
    }
    if (t.dataset?.pop && e.key === 'ArrowDown') { e.preventDefault(); if (S.popover !== t.dataset.pop) openPop(t.dataset.pop, true); }
  }

  function onDocKeydown(e) {
    const t = e.target;
    const editable = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
    if (e.key === '/' && !editable && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); openSearch(); return; }
    if (e.key === 'Escape') {
      if (t === E.input) return;
      if (S.popover) { e.preventDefault(); closePop(true); return; }
      if (isMobile() && S.sheetOpen && !S.selected) { setSheet(false); return; }
      if (S.selected) { e.preventDefault(); closeDetail(); return; }
      if (S.hostCard) { e.preventDefault(); closeHostCard(); }
    }
  }

  function onInputKeydown(e) {
    const n = S.searchResults.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); S.searchIdx = (S.searchIdx + 1) % n; renderSearch(); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); S.searchIdx = (S.searchIdx - 1 + n) % n; renderSearch(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const r = S.searchResults[S.searchIdx];
      if (r) chooseResult(r.kind, r.id);
    } else if (e.key === 'Escape') {
      e.preventDefault(); e.stopPropagation();
      if (E.input.value) { E.input.value = ''; renderSearch(); }
      else { E.input.blur(); closeMobileSearch(); }
    }
  }

  function onHover(e) {
    const row = e.target.closest?.('[data-hover]');
    const id = row && S.root.contains(row) ? row.dataset.hover : null;
    if (id === S.hover) return;
    S.hover = id;
    HD.bus.emit('service:hover', { id, source: 'list' });
  }

  function announce(msg) {
    const el = E.f.liveRegion;
    el.textContent = '';
    setTimeout(() => { el.textContent = msg; }, 60);
  }

  /* ---------------- Public API ---------------- */
  function init(rootEl, opts = {}) {
    S.root = rootEl;
    S.themeId = opts.themeId || HD.themes?.defaultId || null;
    rootEl.classList.add('hd-ui-root');
    rootEl.innerHTML = skeleton();

    E.top = rootEl.querySelector('.hd-top');
    E.kpis = rootEl.querySelector('.hd-kpis');
    E.detail = rootEl.querySelector('.hd-detail:not(.hd-hostcard)');
    E.hostcard = rootEl.querySelector('.hd-hostcard');
    E.list = rootEl.querySelector('.hd-list');
    E.input = rootEl.querySelector('#hd-search-input');
    E.searchPop = rootEl.querySelector('.hd-search-pop');
    E.searchList = rootEl.querySelector('#hd-search-list');
    const q = s => rootEl.querySelector(s);
    E.f = {
      hostname: q('[data-f="hostname"]'), hostcount: q('[data-f="hostcount"]'), hostdot: q('[data-f="hostdot"]'),
      hostbtn: q('.hd-hostbtn'), themename: q('[data-f="themename"]'), themebtn: q('.hd-themebtn'),
      badge: q('[data-f="badge"]'), bell: q('.hd-bell'), stardate: q('[data-f="stardate"]'),
      live: q('[data-f="live"]'), livelabel: q('[data-f="livelabel"]'), liveRegion: q('[data-f="live-region"]'),
      dname: E.detail.querySelector('[data-f="name"]'), dsub: E.detail.querySelector('[data-f="sub"]'),
      dbody: E.detail.querySelector('[data-f="body"]'), dopen: E.detail.querySelector('[data-f="open"]'),
      hname: E.hostcard.querySelector('[data-f="hname"]'), hsub: E.hostcard.querySelector('[data-f="hsub"]'),
      hstat: E.hostcard.querySelector('[data-f="hstat"]'), hgrid: E.hostcard.querySelector('[data-f="hgrid"]'),
      hrows: E.hostcard.querySelector('[data-f="hrows"]'),
    };

    rootEl.addEventListener('click', onClick);
    rootEl.addEventListener('keydown', onRootKeydown);
    rootEl.addEventListener('pointerover', onHover);
    rootEl.addEventListener('pointerleave', () => { if (S.hover) { S.hover = null; HD.bus.emit('service:hover', { id: null, source: 'list' }); } });
    document.addEventListener('keydown', onDocKeydown);
    document.addEventListener('pointerdown', e => {
      if (!S.popover) return;
      const wrap = S.popTrigger?.closest('.hd-menu-wrap');
      if (wrap && !wrap.contains(e.target)) closePop(false);
    });
    E.input.addEventListener('input', () => { S.searchIdx = 0; renderSearch(); });
    E.input.addEventListener('focus', () => { closePop(false); renderSearch(); });
    E.input.addEventListener('blur', () => setTimeout(() => {
      renderSearch();
      if (isMobile() && !E.input.value && document.activeElement !== E.input) closeMobileSearch();
    }, 120));
    E.input.addEventListener('keydown', onInputKeydown);
    E.searchPop.addEventListener('pointerdown', e => e.preventDefault()); // keep input focus while picking
    E.searchList.addEventListener('pointermove', e => {
      const li = e.target.closest('[role="option"]');
      if (!li) return;
      const i = +li.id.replace('hd-opt-', '');
      if (i !== S.searchIdx) { S.searchIdx = i; renderSearch(); }
    });
    bindDrag();

    mq.addEventListener?.('change', () => {
      closePop(false); closeMobileSearch(); setSheet(false);
      if (S.tab === 'timeline' && !isMobile()) setTab('services');
    });

    HD.bus.on('service:select', p => openDetail(p?.id ?? null, p?.source));
    HD.bus.on('host:select', p => { if (p?.source === 'hostcard') return; S.hostCard = p?.hostId || null; renderHostCard(); });   // a ship or pin was clicked
    HD.bus.on('hostview:open', renderDetail);     // hide the card if the view owns details (ownsDetail)
    HD.bus.on('hostview:close', renderDetail);    // and bring it back for a live selection afterwards
    HD.bus.on('scene:ready', p => { if (p?.themeId) { S.themeId = p.themeId; renderTop(); } });
    HD.bus.on('theme:change', p => { if (p?.id && HD.themes?.get?.(p.id)) { S.themeId = p.id; S.hostCard = null; renderHostCard(); renderTop(); } });
    HD.bus.on('alert:mood', p => { S.moodRed = !!p?.red; renderLive(); });
    HD.bus.on('host:focus', p => {
      const id = p?.hostId || 'all';
      if (id !== S.hostFilter) { S.hostFilter = id; if (S.snap) { renderTop(); renderList(); } }
    });
    HD.bus.on('service:hover', p => {
      if (p?.source === 'list') return;
      S.hover = p?.id || null;
      S.root.querySelectorAll('.hd-row.is-hover').forEach(r => r.classList.remove('is-hover'));
      if (S.hover) S.root.querySelectorAll(`.hd-row[data-hover="${CSS.escape(S.hover)}"]`).forEach(r => r.classList.add('is-hover'));
    });

    setTab(S.tab);
    setSheet(false);
    renderLive();
    setInterval(() => {
      renderLive();
      if (S.snap) { renderTimeline(); renderBell(); }
    }, 30000);
  }

  function update(snapshot, changes = []) {
    if (!S.root || !snapshot) return;
    S.snap = snapshot;
    S.red = snapshot.services.some(s => s.critical && s.status === 'down');
    // Live data: services and hosts come and go between polls. Drop a filter/selection that no longer exists.
    if (S.hostFilter !== 'all' && !hostById(S.hostFilter)) { S.hostFilter = 'all'; HD.bus.emit('host:focus', { hostId: 'all' }); }
    renderTop();
    renderKpis();
    renderTimeline();
    renderList();
    if (S.selected && !svcById(S.selected)) { S.selected = null; HD.bus.emit('service:select', { id: null, source: 'detail' }); }
    renderDetail();
    if (!E.searchPop.hidden) renderSearch();

    const msgs = (changes || []).filter(c => c.kind === 'status').map(c => {
      const s = svcById(c.serviceId);
      return s ? `${s.name} is now ${ST_LABEL[c.to] || c.to}${c.to !== 'healthy' && s.statusReason ? ': ' + s.statusReason : ''}.` : '';
    }).filter(Boolean);
    if (msgs.length) announce(msgs.join(' '));
    S.ready = true;
  }

  HD.ui = { init, update };
})();
</script>
<script>/* ==== lcars-msd.js ==== */
/* HomeDeck LCARS master systems displays (HD.msd): one ship diagram per host.
   defiant -> U.S.S. Defiant (starboard profile traced from a reference MSD), enterprise* -> U.S.S. Enterprise
   (Galaxy class), any other host -> a Danube-class runabout. Every service becomes a numbered compartment
   (matched by id, then type, then any free room); services beyond the ship's room count go to auxiliary bays.
   Labels sit in MSD-style lists above and below the ship with leaders routed so none cross.
   HD.msd.view(host, ctx) builds the ship screen (diagram + list + in-frame service detail with containers,
   health checks and live logs); the rest of the API is shared with the app shell (rooms, names, rail inset). */
(function () {
  'use strict';
  const HD = window.HomeDeck;
  const esc = s => HD.util.escapeHtml(s == null ? '' : s);
  const f1 = v => Math.round(v * 10) / 10;
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  /* ------------------------------------------------------------ geometry helpers */
  function svgPath(cmds, map) {
    return cmds.map(c => {
      if (c[0] === 'Z') return 'Z';
      const pts = []; for (let i = 1; i < c.length; i += 2) pts.push(map(c[i], c[i + 1]).map(f1).join(','));
      return c[0] + pts.join(' ');
    }).join(' ');
  }
  const mirrorZ = cmds => cmds.map(c => c.map((v, i) => (i > 0 && i % 2 === 0 ? -v : v)));
  const rect = (x, y, w, h, r, cls, extra = '') => `<rect class="${cls}" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${r}" ${extra}/>`;
  /** One clean silhouette from overlapping parts: stroke them all wide, then fill them all on top. */
  const silhouette = paths => paths.map(d => `<path class="lc-sil-s" d="${d}"/>`).join('') + paths.map(d => `<path class="lc-sil-f" d="${d}"/>`).join('');

  /** Interior as an MSD-style compartment plan: decks split into outlined cells (a few filled), bulkhead frames
   *  every so often, and corridor double-lines. Batched into one <path> per style for speed. Clipped by caller.
   *  zones: [{ x0, x1, y0?, y1?, warm: true }] tint cells orange (engineering); avoid: rects the cells keep clear of. */
  function interior(box, deck, avoid, zones, seed) {
    const rnd = rng(seed), P = { cool: '', coolF: '', coolF2: '', warm: '', warmF: '', frame: '', corr: '' };
    const blocked = (x, y, w, h) => avoid.some(r => x < r.x + r.w + 2 && x + w > r.x - 2 && y < r.y + r.h + 2 && y + h > r.y - 2);
    const warmAt = (x, y) => zones.some(z => x >= z.x0 && x <= z.x1 && (z.y0 == null || y >= z.y0) && (z.y1 == null || y <= z.y1));
    const sub = (x, y, w, h) => `M${f1(x)} ${f1(y)}h${f1(w)}v${f1(h)}h${f1(-w)}Z`;
    let row = 0;
    for (let y = box.y0; y < box.y1; y += deck, row++) {

  /* ------------------------------------------------------------ shared API */
  const BUILD = { defiant: msdDefiant, galaxy: msdGalaxy, runabout: msdRunabout };

    galaxy: () => ({ title: 'U.S.S. Enterprise', short: 'Enterprise', reg: 'NCC-1701-D', cls: 'Galaxy class' }),
    runabout: h => ({ title: 'U.S.S. ' + title(h.name), short: title(h.name), reg: 'NCC-' + (72000 + hash(h.id) % 900), cls: 'Danube class' }),
  };

  function heroMetric(s) {
    const m = s.metrics && s.metrics[0];
    if (!m) return '';
    const v = typeof m.value === 'number' ? m.value.toLocaleString() : m.value == null ? '—' : m.value;
    const val = m.unit === '%' ? `${v}%` : m.unit ? `${v} ${m.unit}` : `${v}`;
    return `${val} ${String(m.label || '').toLowerCase()}`;
  }
  function assignRooms(rooms, services) {
    const out = rooms.map(r => Object.assign({}, r, { svc: null }));
    const left = services.slice();
    const pass = pred => left.slice().forEach(s => { const r = out.find(x => !x.svc && pred(x, s)); if (r) { r.svc = s; left.splice(left.indexOf(s), 1); } });
    pass((r, s) => r.pref.includes(s.id));
    pass((r, s) => r.pref.includes(s.type));
    pass(() => true);
    // number occupied rooms stern to bow (then top to bottom), so the numbers read along the ship
    out.filter(r => r.svc).sort((a, b) => (a.x - b.x) || (a.y - b.y)).forEach((r, i) => { r.n = i + 1; });
    return { rooms: out, overflow: left };
  }
  /** Room assignment for one host (cached per service-id signature): { rooms, overflow, used }. */
  const layoutCache = new Map();
  function layout(host, services) {
    const kind = kindOf(host), key = host.id + '|' + kind, sig = services.map(s => s.id).join(',');
    const hit = layoutCache.get(key);
    if (hit && hit.sig === sig) return hit.res;
    const a = assignRooms(def(kind).rooms, services);
    const res = { rooms: a.rooms, overflow: a.overflow, used: a.rooms.filter(r => r.svc).sort((x, y) => x.n - y.n) };
    layoutCache.set(key, { sig, res });
    return res;
  }
  /** "07 · Cargo bay" / "+ · Auxiliary bay 2" for a service on its host, or ''. */
  function roomOf(host, services, id) {
    const L = layout(host, services);
    const r = L.used.find(x => x.svc.id === id);
    if (r) return { n: r.n, name: r.name, label: `${String(r.n).padStart(2, '0')} · ${r.name}` };
    const i = L.overflow.findIndex(x => x.id === id);
    return i >= 0 ? { n: null, name: `Auxiliary bay ${i + 1}`, label: `+ · Auxiliary bay ${i + 1}` } : null;
  }
  /** Status inset for the rail, MSD "shield status" style: bracketed oval with a small ship plan, then live bars. */
  function inset(kind) {
    const bar = (k, label, i) => {
