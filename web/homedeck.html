      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(disposeMaterial);
      if (o.isLight && o.shadow && o.shadow.map) { o.shadow.map.dispose(); o.shadow.map = null; }
      if (o.isInstancedMesh && o.dispose) o.dispose();
    });
  }
  function teardown() {
    if (S.root) { S.scene.remove(S.root); disposeTree(S.root); S.root = null; }
    if (S.backdrop) { [...S.backdrop.children].forEach(c => { S.backdrop.remove(c); disposeTree(c); }); }
    if (S.theme?.dispose) safe('theme.dispose', () => S.theme.dispose());
    S.services.clear(); S.hosts.clear(); S.pickList = []; S.fitPoints = [];
    S.pinsEl.textContent = ''; S.pins.clear(); S.hostPins.clear(); S.hoveredHost = null;
    S.lights = null; state.lights = null; S.ctx = null; S.layout = null;
  }

  /* ----------------------------------------------------------------- build */
  function boxPoints(obj) {
    const b = new T.Box3().setFromObject(obj);
    if (b.isEmpty()) return [];
    const pts = [];
    for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) pts.push([x, y, z]);
    return pts;
  }

  function build(theme, keepCamera) {
    const tBuild = HD.perf.mark('build start'); HD.perf.acc = {};
    const prevCam = keepCamera ? { ...cam } : null;
    teardown();
    S.theme = theme;
    const pal = theme.palette || {};
    applySky();
    S.root = new T.Group(); S.root.name = 'hd-theme-root';
    S.scene.add(S.root);
    S.root.add(buildLights(pal));
    HD.perf.time('env lighting', () => buildEnvironment(pal.env, S.lights.keyDir));
    S.renderer.toneMapping = pal.toneMapping === 'aces' ? T.ACESFilmicToneMapping : T.NoToneMapping;
    S.renderer.toneMappingExposure = pal.exposure ?? 1;

    const snap = S.snapshot || HD.data?.getSnapshot?.() || { hosts: [], services: [] };
    const hosts = snap.hosts || [], services = snap.services || [];
    const ctx = S.ctx = { THREE: T, scene: S.scene, camera: S.camera, renderer: S.renderer, dark: S.dark,
      root: S.root, backdrop: S.backdrop, reducedMotion: S.reducedMotion, palette: pal, hosts, services, layout: null };

    let layout = HD.perf.time('layout', () => safe('theme.layout', () => theme.layout(hosts, services))) || {};
    layout.hosts = layout.hosts || {}; layout.services = layout.services || {};
    layout.bounds = layout.bounds || { radius: 20, center: [0, 0] };
    S.layout = ctx.layout = layout;

    if (theme.environment) {
      const env = HD.perf.time('environment', () => safe('theme.environment', () => theme.environment(ctx)));
      if (env) S.root.add(env);
    }

    let spill = 0;
    const spillPos = () => { const a = spill * 2.39996, r = (layout.bounds.radius || 20) + 3 + spill * 0.6; spill++; return { x: Math.cos(a) * r, y: 0, z: Math.sin(a) * r, rotY: 0 }; };

    const tHosts = performance.now();
    hosts.forEach(h => {
      const g = safe('theme.buildHost ' + h.id, () => theme.buildHost(h, ctx));
      if (!g) return;
      const p = layout.hosts[h.id] || spillPos();
      g.position.set(p.x || 0, p.y || 0, p.z || 0);
      g.rotation.y = p.rotY || 0;
      g.traverse(o => { if (!o.userData.noPick) o.userData.hostId = h.id; });   // hulls are clickable (host:select)
      g.userData.hostId = h.id; g.userData.baseY = g.position.y; g.userData.host = h;
      if (g.userData.pinHeight == null) g.userData.pinHeight = 3;
      S.root.add(g); S.hosts.set(h.id, g); S.pickList.push(g);
    });

    HD.perf.marks.push(['hosts', performance.now() - tHosts, 'dur']);
    const tSvc = performance.now();
    services.forEach(s => {
      const g = safe('theme.buildService ' + s.id, () => theme.buildService(s, ctx));
      if (!g) return;
      const p = layout.services[s.id] || spillPos();
      g.position.set(p.x || 0, p.y || 0, p.z || 0);
      g.rotation.y = p.rotY || 0;
      g.traverse(o => { o.userData.serviceId = s.id; });
      g.userData.baseY = g.position.y; g.userData.service = s; g.userData._status = s.status;
      if (g.userData.pinHeight == null) g.userData.pinHeight = 2;
      S.root.add(g); S.services.set(s.id, g); S.pickList.push(g);
      safe('theme.applyStatus', () => theme.applyStatus(g, s.status, ctx));
    });

    HD.perf.marks.push(['services', performance.now() - tSvc, 'dur']);
    // framing data
    S.root.updateMatrixWorld(true);
    const fit = [];
    S.hosts.forEach(g => { g.userData._pts = boxPoints(g); fit.push(...g.userData._pts); });
    S.services.forEach(g => {
      g.userData._pts = boxPoints(g); fit.push(...g.userData._pts);
      const p = g.userData._pts; if (p.length) g.userData._span = Math.max(p[7][0] - p[0][0], p[7][1] - p[0][1], p[7][2] - p[0][2]);
    });
    const bp = layout.bounds.points;
    if (bp && bp.length) fit.push(...bp);
    else { const R = layout.bounds.radius || 20, c = layout.bounds.center || [0, 0]; for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; fit.push([c[0] + Math.cos(a) * R, 0, c[1] + Math.sin(a) * R]); } }
    S.fitPoints = fit;
    cam.cx = layout.bounds.center?.[0] || 0; cam.cz = layout.bounds.center?.[1] || 0; cam.radius = layout.bounds.radius || 20;
    fitShadow(layout.bounds);

    if (pal.env) applyEnvIntensity(pal.env.intensity ?? 1);
    S.shadowDirty = true; S.firstFrame = true;
    buildPins(services);
    S.builtKey = keyOf(snap);
    [S.selected, S.hovered].forEach(applyHighlight);
    updateAlert(services, true);
    HD.perf.marks.push(['build total', performance.now() - tBuild, 'dur']);

    if (prevCam) {
      Object.assign(cam, { tx: prevCam.tx, tz: prevCam.tz, az: prevCam.az, size: prevCam.size, gx: prevCam.gx, gz: prevCam.gz, gaz: prevCam.gaz, gsize: prevCam.gsize });
      const g = fitGoal(S.fitPoints, cam.gaz); cam.fit = g.size; cam.maxSize = g.size * 1.8; clampGoal();
    } else {
      S.userMoved = false;
      cam.gaz = DEFAULT_AZ;
      frameAll(true);
    }
    applyCamera();
  }

  /* ------------------------------------------------------------ host view */
  // Optional theme drill-down (theme.hostView): clicking a host flies the camera to it, then mounts the
  // theme's DOM view in #hd-hostview (between the pins and the UI panels). Themes without it just get
  // the camera framing.
  function hostById(id) { return (S.snapshot?.hosts || []).find(h => h.id === id) || null; }

  function openHostView(hostId) {
    const theme = S.theme, host = hostById(hostId);
    if (!host) return;
    if (!theme?.hostView) {
      // On a small screen (a portrait phone, or a landscape phone: touch and short) the host card covers a big share of the map, so
      // zooming onto the ship would only park it behind the card: keep the whole map and fit it into what the card leaves free
      // instead (insets() reads the open card; wait a frame for it to render).
      if (window.matchMedia?.('(max-width: 720px), (pointer: coarse) and (max-height: 600px)').matches) requestAnimationFrame(() => { frameAll(false, cam.gaz); S.userMoved = false; });
      else focusHost(hostId);
      return;
    }
    if (S.view?.hostId === hostId) return;
    closeHostView(true, true);           // switching ships: keep the detail flag until the new view mounts
    focusHost(hostId);
    const el = document.createElement('section');
    el.id = 'hd-hostview'; el.className = 'hd-hostview';
    el.setAttribute('aria-label', `${host.name} systems`);
    S.pinsEl.after(el);
    const token = ++S.viewToken;
    S.view = { hostId, el, api: null };
    document.documentElement.dataset.hostview = hostId;
    updateHostPins();
    const ctx = {
      host, snapshot: S.snapshot, dark: S.dark, reducedMotion: S.reducedMotion, selected: S.selected,
      select: id => HD.bus.emit('service:select', { id, source: 'hostview' }),
      hover: id => HD.bus.emit('service:hover', { id, source: 'hostview' }),
      close: () => HD.bus.emit('host:select', { hostId: null, source: 'hostview' }),
    };
    setTimeout(() => {
      if (token !== S.viewToken || !S.view) return;
      const tView = performance.now();
      const api = HD.perf.time(`lcars build (${host.id})`, () => safe('theme.hostView', () => theme.hostView(host, ctx)));
      if (!api?.el) { closeHostView(true); return; }
      S.view.api = api;
      // ownsDetail: the view shows service details itself, so the UI keeps its detail card/sheet closed.
      if (api.ownsDetail) document.documentElement.dataset.hostviewDetail = '1';
      else delete document.documentElement.dataset.hostviewDetail;
      el.appendChild(api.el);
      safe('hostView.update', () => api.update?.(S.snapshot));
      safe('hostView.select', () => api.select?.(S.selected));
      // build + first data patch + layout/paint, measured to the frame after it's on screen
      requestAnimationFrame(() => requestAnimationFrame(() => HD.perf.marks.push([`lcars on screen (${host.id})`, performance.now() - tView, 'dur'])));
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('is-open')));
      HD.bus.emit('hostview:open', { hostId, ownsDetail: !!api.ownsDetail });
    }, S.reducedMotion ? 0 : 380);
    HD.bus.emit('host:focus', { hostId, source: 'scene' });   // keeps the UI host switcher in sync
  }

  function closeHostView(silent, keepDetailFlag) {
    const v = S.view;
    if (!v) return;
    S.view = null; S.viewToken++;
    delete document.documentElement.dataset.hostview;
    if (!keepDetailFlag) delete document.documentElement.dataset.hostviewDetail;
    v.el.classList.remove('is-open');
    setTimeout(() => { safe('hostView.dispose', () => v.api?.dispose?.()); v.el.remove(); }, S.reducedMotion ? 0 : 240);
    updateHostPins();
    if (!silent) {
      frameAll(false, cam.gaz); S.userMoved = false;
      HD.bus.emit('host:focus', { hostId: 'all', source: 'scene' });
    }
    HD.bus.emit('hostview:close', { hostId: v.hostId });
  }

  /* ------------------------------------------------------------ lifecycle */
  function setTheme(id, opts = {}) {
    const theme = HD.themes.get(id) || HD.themes.get(HD.themes.defaultId);
    if (!S.inited || !theme) return Promise.resolve(false);
    const token = ++S.buildToken;
    const instant = !!opts.instant || S.reducedMotion;
    const keep = !!opts.keepCamera && S.theme && S.theme.id === theme.id;
    if (S.theme && S.theme.id !== theme.id) closeHostView(true);
    S.fadeEl?.classList.add('is-on');
    return wait(instant ? 0 : 300).then(() => {
      if (token !== S.buildToken) return false;
      build(theme, keep);
      return nextFrame().then(() => {
        if (token !== S.buildToken) return false;
        S.fadeEl?.classList.remove('is-on');
        HD.bus.emit('scene:ready', { themeId: theme.id });
        return true;
      });
    }).catch(e => { console.error('[HomeDeck scene] setTheme', e); S.fadeEl?.classList.remove('is-on'); return false; });
  }

  function updateAlert(services, force) {
    const red = (services || []).some(s => s.critical && s.status === 'down');
    if (red === S.redAlert && !force) return;
    const flipped = red !== S.redAlert;
    S.redAlert = red; state.redAlert = red;
    const root = document.documentElement;
    if (red) root.dataset.alert = 'red'; else delete root.dataset.alert;
    if (flipped) HD.bus.emit('alert:mood', { red });
  }

  function update(snapshot /*, changes */) {
    if (!snapshot) return;
    S.snapshot = snapshot;
    const services = snapshot.services || [];
    if (S.inited && S.theme && S.root) {
      if (keyOf(snapshot) !== S.builtKey) {
        if (!S.rebuildQueued) {
          S.rebuildQueued = true;
          Promise.resolve().then(() => { S.rebuildQueued = false; setTheme(S.theme.id, { instant: true, keepCamera: true }); });
        }
      } else {
        services.forEach(s => {
          const g = S.services.get(s.id);
          if (!g) return;
          g.userData.service = s;
          if (g.userData._status !== s.status) {
            g.userData._status = s.status;
            safe('theme.applyStatus', () => S.theme.applyStatus(g, s.status, S.ctx));
          }
          updatePinState(s.id);
        });
        updateHostPins();
      }
      if (S.view?.api?.update) safe('hostView.update', () => S.view.api.update(snapshot));
    }
    updateAlert(services);
  }

  /* ----------------------------------------------------------- render loop */
  function applyCamera() {
    const c = S.camera, a = S.W / S.H;
    c.left = -cam.size * a; c.right = cam.size * a; c.top = cam.size; c.bottom = -cam.size;
    c.updateProjectionMatrix();
    c.position.set(cam.tx + Math.sin(cam.az) * COS_EL * CAM_DIST, SIN_EL * CAM_DIST, cam.tz + Math.cos(cam.az) * COS_EL * CAM_DIST);
    c.lookAt(cam.tx, 0, cam.tz);
    c.updateMatrixWorld(true);
    c.matrixWorldInverse.copy(c.matrixWorld).invert();
    S.backdrop.scale.set(cam.size, cam.size, 1);
    const v = state.view; v.az = cam.az; v.size = cam.size; v.tx = cam.tx; v.tz = cam.tz; v.pxPerUnit = S.H / (2 * cam.size); v.aspect = a;
  }

  function updateCamera(dt) {
    const k = S.reducedMotion ? 1 : 1 - Math.exp(-dt * 8.5);
    cam.tx += (cam.gx - cam.tx) * k;
    cam.tz += (cam.gz - cam.tz) * k;
    cam.az += (cam.gaz - cam.az) * k;
    cam.size = Math.exp(Math.log(cam.size) + (Math.log(cam.gsize) - Math.log(cam.size)) * k);
    if (Math.abs(cam.gaz - cam.az) < 1e-4) cam.az = cam.gaz;
    applyCamera();
  }

  function tick(now) {
    S.raf = requestAnimationFrame(tick);
    const t = now / 1000;
    const dt = Math.min(0.1, S.lastT ? t - S.lastT : 1 / 60);
    S.lastT = t;
    updateCamera(dt);
    if (S.hoverDirty && S.mouse && !S.drag) {
      S.hoverDirty = false;
      const hit = pickAt(S.mouse[0], S.mouse[1]);
      const id = hit?.service || null;
      if (id !== S.hovered) HD.bus.emit('service:hover', { id, source: 'scene' });
      setHoveredHost(hit?.host || null);
    }
    if (S.theme && S.root) {
      updateMood(dt);
      state.dt = dt; state.t = t; state.reducedMotion = S.reducedMotion; state.camera = S.camera;
      safe('theme.ambient', () => S.theme.ambient(S.scene, t, state));
    }
    if (S.shadowDirty || S.theme?.dynamicShadows) { S.renderer.shadowMap.needsUpdate = true; S.shadowDirty = false; }
    if (S.firstFrame) {         // first frame after a build includes shader compilation + shadow pass
      S.firstFrame = false;
      HD.perf.time('first frame', () => S.renderer.render(S.scene, S.camera));
      HD.perf.mark('first frame done');
    } else S.renderer.render(S.scene, S.camera);
    S.calls = S.renderer.info.render.calls; S.tris = S.renderer.info.render.triangles;
    updatePins();
    S.fpsFrames++;
    if (t - S.fpsT >= 1) { S.fps = Math.round(S.fpsFrames / (t - S.fpsT)); S.fpsFrames = 0; S.fpsT = t; }
  }
  function start() { if (!S.raf && !document.hidden) { S.lastT = 0; S.raf = requestAnimationFrame(tick); } }
  function stop() { if (S.raf) cancelAnimationFrame(S.raf); S.raf = 0; }

  function resize() {
    const r = S.stage.getBoundingClientRect();
    S.rect = r;
    const W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height));
    if (W === S.W && H === S.H) return;
    S.W = W; S.H = H;
    S.renderer.setSize(W, H, false);
    if (S.fitPoints.length) {
      if (!S.userMoved) frameAll(true, cam.gaz);
      else { const g = fitGoal(S.fitPoints, cam.gaz); cam.fit = g.size; cam.maxSize = g.size * 1.8; clampGoal(); }
    }
    applyCamera();
  }

  /* ------------------------------------------------------------------ init */
  function init(stageEl, pinsEl) {
    if (S.inited) return;
    T = window.THREE;
    if (!T || !stageEl) return;
    S.stage = stageEl; S.pinsEl = pinsEl || document.getElementById('hd-pins');
    S.fadeEl = document.getElementById('hd-fade');
    let renderer;
    try {
      renderer = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    } catch (e) {
      console.error('[HomeDeck scene] WebGL unavailable', e);
      stageEl.insertAdjacentHTML('beforeend', '<p class="hd-stage-error">The 3D map needs WebGL, which this browser has turned off. The panels still show live status.</p>');
      return;
    }
    S.inited = true;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.toneMapping = T.NoToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;   // VSM is softer but unreliable on mobile GPUs
    renderer.shadowMap.autoUpdate = false;     // static shadows: redrawn after each build (or every frame if theme.dynamicShadows)
    renderer.domElement.setAttribute('aria-hidden', 'true');
    stageEl.appendChild(renderer.domElement);
    S.renderer = renderer;
    S.scene = new T.Scene();
    S.camera = new T.OrthographicCamera(-1, 1, 1, -1, 1, CAM_FAR);
    S.scene.add(S.camera);
    S.backdrop = new T.Group(); S.backdrop.name = 'hd-backdrop';
    S.backdrop.position.z = -(CAM_FAR - 12);
    S.camera.add(S.backdrop);
    ray = new T.Raycaster(); ndc = new T.Vector2(); _pv = new T.Vector3();

    const mqDark = window.matchMedia?.('(prefers-color-scheme: dark)');
    const mqMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)');
    S.dark = !!mqDark?.matches; S.reducedMotion = !!mqMotion?.matches;
    const onMq = (mq, fn) => mq && (mq.addEventListener ? mq.addEventListener('change', fn) : mq.addListener(fn));
    onMq(mqDark, () => { S.dark = !!mqDark.matches; if (S.theme) setTheme(S.theme.id, { instant: true, keepCamera: true }); });
    onMq(mqMotion, () => { S.reducedMotion = !!mqMotion.matches; if (S.ctx) S.ctx.reducedMotion = S.reducedMotion; });

    stageEl.addEventListener('pointerdown', onDown);
    stageEl.addEventListener('pointermove', onMove);
    stageEl.addEventListener('pointerup', onUp);
    stageEl.addEventListener('pointercancel', onUp);
    stageEl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !S.ptr.size) { S.mouse = null; if (S.hovered) HD.bus.emit('service:hover', { id: null, source: 'scene' }); } });
    stageEl.addEventListener('wheel', onWheel, { passive: false });
    stageEl.addEventListener('contextmenu', e => e.preventDefault());
    S.pinsEl?.addEventListener('wheel', onWheel, { passive: false });
    // Pins sit above the canvas: route their pointers into the controller (captured by the stage) so a drag or
    // pinch that starts on a pin still pans/zooms; a short tap on a pin selects it (see onUp). Keyboard
    // activation still arrives as the pin's own click event.
    S.pinsEl?.addEventListener('pointerdown', e => { if (e.target.closest?.('.hd-pin')) onDown(e); });

    HD.bus.on('service:select', p => {
      const id = p?.id ?? null;
      setSelected(id);
      if (S.view) {
        const svc = id && (S.snapshot?.services || []).find(s => s.id === id);
        if (svc && svc.host !== S.view.hostId) openHostView(svc.host);      // follow selection to its ship
        else safe('hostView.select', () => S.view?.api?.select?.(id));
      }
    });
    HD.bus.on('host:select', p => (p?.hostId ? openHostView(p.hostId) : closeHostView()));
    HD.bus.on('service:hover', p => setHovered(p?.id ?? null));
    HD.bus.on('camera:cmd', p => command(p?.cmd));
    HD.bus.on('camera:focus', p => focusService(p?.id));
    HD.bus.on('host:focus', p => {
      if (p?.source === 'scene') return;                                     // our own echo
      if (S.theme?.hostView) (p?.hostId && p.hostId !== 'all' ? openHostView(p.hostId) : closeHostView());
      else focusHost(p?.hostId);
    });
    // Esc closes the host view, after the UI has had its turn (popovers, detail card mark the event handled).
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !S.view || e.defaultPrevented) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName || '')) return;
      if (S.selected) return;
      closeHostView();
    });

    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stageEl);
    else window.addEventListener('resize', resize);
    S.W = 0; resize();
    start();
  }

  HD.scene = {
    init, update, setTheme, surface, radialTexture,
    select(id) { setSelected(id || null); },
    focus(id) { focusService(id); },
    getCameraState() {
      return { target: [cam.tx, 0, cam.tz], azimuthDeg: ((cam.az / DEG) % 360 + 360) % 360, elevationDeg: ELEV / DEG,
        size: cam.size, zoom: cam.fit / cam.size, fitSize: cam.fit };
    },
    get themeId() { return S.theme?.id || null; },
    debug: {
      get fps() { return S.fps; },
      get drawCalls() { return S.calls; },
      get triangles() { return S.tris; },
      get renderer() { return S.renderer; },
      get scene() { return S.scene; },
      get camera() { return S.camera; },
      get services() { return S.services; },
      get hosts() { return S.hosts; },
      get layout() { return S.layout; },
      info() {
        const r = S.renderer; if (!r) return null;
        return { fps: S.fps, calls: S.calls, triangles: S.tris, geometries: r.info.memory.geometries, textures: r.info.memory.textures,
          programs: r.info.programs?.length, services: S.services.size, pins: S.pins.size, redAlert: S.redAlert, selected: S.selected,
          camera: HD.scene.getCameraState(), viewport: [S.W, S.H] };
      },
      pickAt: (x, y) => pickAt(x, y),
      pinXY(id) { const p = S.pins.get(id); return p ? [Math.round(p.x), Math.round(p.y)] : null; },
      screenOf(id) {
        const g = S.services.get(id); if (!g) return null;
        const v = new T.Vector3(g.position.x, g.position.y + 0.6, g.position.z).project(S.camera);
        return [Math.round((v.x + 1) * S.W / 2), Math.round((1 - v.y) * S.H / 2)];
      },
    },
  };
})();
</script>
<script>/* ==== geometry-kit.js ==== */
/* HomeDeck geometry toolkit: shared, theme-agnostic helpers for building merged low-draw-call scenes fast.
   Each theme makes one toolkit:  const G = HomeDeck.geom.toolkit('mytheme', { floor: 6 });
   - G.prim(key, make)  lazy recipe: returns a stub; the geometry is only generated if something needs it.
   - G.real(g)          resolve a stub (use when passing a building block straight to a Mesh/InstancedMesh).
   - new G.Kit()        merges many parts into one indexed, vertex-coloured geometry. If every part is a recipe,
                        the merge gets a content signature and is stored in / served from HomeDeck.geoCache, so a
                        repeat visit skips both generating the parts and merging them.
   - G.smooth(geo)      weld coincident vertices + recompute normals (soft shading for extrusions).
   - G.sg(n)            segment count for the current detail level (phones get about half, never below `floor`).
   - G.begin()          call at the start of each build (first theme hook, usually layout()): picks the detail level.
   - G.dispose()        frees generated building blocks; call from theme.dispose().
   See THEMES.md "Performance". */
(function () {
  'use strict';
  const HD = window.HomeDeck;

  /** FNV-1a over a string with two seeds -> 16 hex chars. */
  function sigHash(str) {
    let a = 0x811c9dc5, b = 0x01000193 ^ 0x5bd1e995;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = Math.imul(b ^ c, 2246822519); }
    return (a >>> 0).toString(16).padStart(8, '0') + (b >>> 0).toString(16).padStart(8, '0');
  }

  /** Detail level shared by all themes: 0.5 on phones / touch devices, 1 elsewhere; ?lod=high|low overrides. */
  function pickDetail() {
    const force = /[?&]lod=(high|low)\b/.exec(location.search);
    const small = Math.min(innerWidth, innerHeight) < 760 || !!window.matchMedia?.('(pointer: coarse)').matches;
    const q = force ? (force[1] === 'high' ? 1 : 0.5) : small ? 0.5 : 1;
    if (HD.perf?.info) HD.perf.info.detail = q === 1 ? 'high' : 'phone (reduced segments)';
    return q;
  }

  function toolkit(name, opts = {}) {
    const floor = opts.floor ?? 6;
    let T = window.THREE, q = 1;
    const stubs = new Map(), built = new Map(), colors = new Map();
    const lin = hex => { let c = colors.get(hex); if (!c) { c = new T.Color(hex).convertSRGBToLinear(); colors.set(hex, c); } return c; };

    function prim(key, make) {
      let g = stubs.get(key);
      if (!g) { g = { stub: true, key, make, geo: null }; stubs.set(key, g); }
      return g;
    }
    function real(g) {
      if (!g || !g.stub) return g;
      if (!g.geo) { g.geo = g.make(); built.set(g.key, g.geo); }
      return g.geo;
    }
    const sg = n => (q === 1 ? n : Math.max(Math.min(n, floor), Math.round(n * q)));

    function smooth(geo) {
      // Open-addressing hash on quantised coordinates (no per-vertex strings, which were very slow on phones).
      const t0 = performance.now();
      const src = geo.attributes.position.array, n = src.length / 3;
      let size = 1; while (size < n * 2) size <<= 1;
      const table = new Int32Array(size).fill(-1), mask = size - 1;
      const qv = new Int32Array(n * 3), pos = new Float32Array(n * 3), idx = new Uint32Array(n);
      let m = 0;
      for (let i = 0; i < n; i++) {
        const qx = Math.round(src[i * 3] * 1e4), qy = Math.round(src[i * 3 + 1] * 1e4), qz = Math.round(src[i * 3 + 2] * 1e4);
        let h = (Math.imul(qx, 73856093) ^ Math.imul(qy, 19349663) ^ Math.imul(qz, 83492791)) & mask, j;
        while ((j = table[h]) !== -1 && (qv[j * 3] !== qx || qv[j * 3 + 1] !== qy || qv[j * 3 + 2] !== qz)) h = (h + 1) & mask;
        if (j === -1) {
          j = m++; table[h] = j;
          qv[j * 3] = qx; qv[j * 3 + 1] = qy; qv[j * 3 + 2] = qz;
          pos[j * 3] = src[i * 3]; pos[j * 3 + 1] = src[i * 3 + 1]; pos[j * 3 + 2] = src[i * 3 + 2];
        }
        idx[i] = j;
      }
      const out = new T.BufferGeometry();
      out.setAttribute('position', new T.BufferAttribute(pos.slice(0, m * 3), 3));
      out.setIndex(new T.BufferAttribute(m > 65535 ? idx : Uint16Array.from(idx), 1));
      out.computeVertexNormals();
      geo.dispose();
      HD.perf.add?.('weld', performance.now() - t0);
      return out;
    }

    class Kit {
      constructor() { this.parts = []; }
      add(geo, color, p, r, s) {
        const m = new T.Matrix4();
        const sc = s == null ? [1, 1, 1] : typeof s === 'number' ? [s, s, s] : s;
        m.compose(new T.Vector3(...(p || [0, 0, 0])), new T.Quaternion().setFromEuler(new T.Euler(...(r || [0, 0, 0]))), new T.Vector3(...sc));
        this.parts.push({ geo, color, m });
        return this;
      }
      addM(geo, color, m) { this.parts.push({ geo, color, m }); return this; }
      /** Unit-Y primitive stretched from a to b with cross-section (w, d). */
      strut(geo, color, a, b, w, d) {
        const A = new T.Vector3(...a), B = new T.Vector3(...b), dir = B.clone().sub(A), len = dir.length();
        const qn = new T.Quaternion().setFromUnitVectors(new T.Vector3(0, 1, 0), dir.normalize());
        return this.addM(geo, color, new T.Matrix4().compose(A.add(B).multiplyScalar(0.5), qn, new T.Vector3(w, len, d)));
      }
      get empty() { return !this.parts.length; }
      /** Content signature: theme, detail level, and every part's recipe key, colour and transform. */
      signature() {
        let str = name + '|' + q;
        for (const pt of this.parts) {
          if (!pt.geo.stub) return null;            // raw geometry has no recipe key: merge is not cacheable
          str += '|' + pt.geo.key + '#' + pt.color + '@' + Array.prototype.map.call(pt.m.elements, v => Math.round(v * 1e4)).join(',');
        }
        return sigHash(str);
      }
      geometry() {
        const sig = this.signature(), hit = sig && HD.geoCache?.get(sig);
        if (hit) return fromArrays(hit);
        const t0 = performance.now();
        let nv = 0, ni = 0;
        for (const pt of this.parts) { pt.geo = real(pt.geo); const c = pt.geo.attributes.position.count; nv += c; ni += pt.geo.index ? pt.geo.index.count : c; }
        const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), col = new Float32Array(nv * 3);
        const idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni), nm = new T.Matrix3();
        let ov = 0, oi = 0;
        for (const pt of this.parts) {
          const g = pt.geo, P = g.attributes.position.array, N = g.attributes.normal ? g.attributes.normal.array : null;
          const VC = pt.color == null && g.attributes.color ? g.attributes.color.array : null, c = lin(pt.color ?? 0xffffff);
          const e = pt.m.elements, ne = nm.getNormalMatrix(pt.m).elements, cnt = P.length / 3;
          for (let i = 0; i < cnt; i++) {
            const x = P[i * 3], y = P[i * 3 + 1], z = P[i * 3 + 2], o = (ov + i) * 3;
            pos[o] = e[0] * x + e[4] * y + e[8] * z + e[12];
            pos[o + 1] = e[1] * x + e[5] * y + e[9] * z + e[13];
            pos[o + 2] = e[2] * x + e[6] * y + e[10] * z + e[14];
            if (N) {
              const a = N[i * 3], b = N[i * 3 + 1], d = N[i * 3 + 2];
              const nx = ne[0] * a + ne[3] * b + ne[6] * d, ny = ne[1] * a + ne[4] * b + ne[7] * d, nz = ne[2] * a + ne[5] * b + ne[8] * d;
              const l = Math.hypot(nx, ny, nz) || 1; nor[o] = nx / l; nor[o + 1] = ny / l; nor[o + 2] = nz / l;
            } else nor[o + 1] = 1;
            if (VC) { col[o] = VC[i * 3]; col[o + 1] = VC[i * 3 + 1]; col[o + 2] = VC[i * 3 + 2]; }
            else { col[o] = c.r; col[o + 1] = c.g; col[o + 2] = c.b; }
          }
          if (g.index) { const I = g.index.array; for (let k = 0; k < I.length; k++) idx[oi++] = I[k] + ov; }
          else for (let k = 0; k < cnt; k++) idx[oi++] = k + ov;
          ov += cnt;
        }
        HD.perf.add?.('merge', performance.now() - t0);
        const arrays = { pos, nor, col, idx };
        if (sig) HD.geoCache?.put(sig, arrays);
        return fromArrays(arrays);
      }
    }
    function fromArrays(a) {
      const geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.BufferAttribute(a.pos, 3));
      geo.setAttribute('normal', new T.BufferAttribute(a.nor, 3));
      geo.setAttribute('color', new T.BufferAttribute(a.col, 3));
      geo.setIndex(new T.BufferAttribute(a.idx, 1));
      geo.computeBoundingSphere();
      return geo;
    }

    return {
      prim, real, smooth, sg, Kit, sigHash,
      get q() { return q; },
      begin() { T = window.THREE; q = pickDetail(); },
      dispose() { built.forEach(g => g.dispose()); built.clear(); stubs.clear(); },
    };
  }

  HD.geom = { toolkit, sigHash, pickDetail };
})();
</script>
<script>/* ==== theme-startrek.js ==== */
/* HomeDeck theme "Starbase" (Agent A): a pastel floating starbase in soft space.
   defiant (primary) docks on the central landing pad; secondary hosts (enterprise-d) float beside
   a small annex pad joined by a bridge and a docking arm. Implements CONTRACT.md "Theme interface". */

        const r = c.r == null ? deckEdge(c.a * DEG) - f - 0.55 : c.r;
        if (!c.pad && r + f > deckEdge(c.a * DEG) - 0.4) continue;
        const [x, z] = polar(c.a, r);
        const ff = c.pad ? Math.min(f, 0.95) : f;
        if (occupied(x, z, ff)) continue;
        c.used = true;
        const scale = c.pad ? Math.min(1, 0.95 / f) : 1;
        place(s, x, c.pad ? 0.05 : 0, z, faceOut(c.a), { scale });
        occupy(x, z, ff);
        if (c.pad) meta.miniPads.push({ x, z, r: 1.2 });
        break;
      }
    }

    // bounds
    const ext = [[0, 0, DECK_R + 0.3]];
    meta.sites.forEach(si => { ext.push([si.pad.x, si.pad.z, PAD_R + 0.2], [si.ship.x, si.ship.z, 4.4]); });
    meta.miniPads.forEach(m => ext.push([m.x, m.z, m.r]));
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    ext.forEach(([x, z, r]) => { x0 = Math.min(x0, x - r); x1 = Math.max(x1, x + r); z0 = Math.min(z0, z - r); z1 = Math.max(z1, z + r); });
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    const radius = Math.max(...ext.map(([x, z, r]) => Math.hypot(x - cx, z - cz) + r));
    const points = [];
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * TAU, e = deckEdge(a);
      points.push([Math.cos(a) * e, 0, Math.sin(a) * e], [Math.cos(a) * 11.2, -1.6, Math.sin(a) * 11.2], [Math.cos(a) * 2.2, -4.4, Math.sin(a) * 2.2]);
    }
    const hostPoints = {};
    meta.sites.forEach(si => {
      const hp = hostPoints[si.hostId] = [];
      for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; hp.push([si.pad.x + Math.cos(a) * PAD_R, 0, si.pad.z + Math.sin(a) * PAD_R], [si.pad.x + Math.cos(a) * 1.0, -2.2, si.pad.z + Math.sin(a) * 1.0]); }
      points.push(...hp);
    });
    if (meta.primaryId) hostPoints[meta.primaryId] = points.slice(0, 72);
    meta.miniPads.forEach(m => { for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; points.push([m.x + Math.cos(a) * m.r, 0, m.z + Math.sin(a) * m.r]); } });

    const out = { hosts: H, services: P, bounds: { radius, center: [cx, cz], points, hostPoints }, meta };
    R.layout = out;
    return out;
  }

  /* ======================================================= ENVIRONMENT */
  function environment(ctx) {
    T = ctx.THREE;
    R.dark = !!ctx.dark;
    const L = ctx.layout || R.layout || { meta: { sites: [], clusters: [], miniPads: [], walkways: [] } };
    const meta = L.meta || { sites: [], clusters: [], miniPads: [], walkways: [] };
    const root = new T.Group(); root.name = 'starbase';
    const deck = new Kit(), under = new Kit(), struct = new Kit(), glow = new Kit();

    // main deck (rounded octagon) + underside tiers
    const deckGeo = prim('deck', () => {
      const g = new T.ExtrudeGeometry(roundPolyShape(8, DECK_R, DECK_RC, Math.PI / 8), { depth: 0.38, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.2, bevelSegments: 2, curveSegments: 6 });
      g.rotateX(-Math.PI / 2); g.translate(0, -0.54, 0);
      return g;
    });
    deck.add(deckGeo, C.deck);
    under.add(cyl(11.2, 11.2, 0.9, 64), C.under, [0, -1.16, 0]);
    under.add(cyl(11.2, 7.0, 1.3, 64), C.under, [0, -2.26, 0]);
    under.add(cyl(7.0, 2.2, 1.5, 48), C.under2, [0, -3.66, 0]);
    under.add(cyl(2.2, 0.9, 0.5, 32), C.hull3, [0, -4.66, 0]);
    // LCARS trim segments around the tier
    const stripe = [C.peach, C.lilac, C.sky, C.lilac, C.butter, C.lilac, C.peach, C.sky, C.lilac, C.rose];
    stripe.forEach((col, i) => {
      const a0 = i / stripe.length * TAU + 0.04, len = TAU / stripe.length - 0.08 - (i % 3 === 0 ? 0.25 : 0);
      under.add(prim(`stripe${i}`, () => new T.CylinderGeometry(11.26, 11.26, 0.26, 12, 1, true, a0, len)), col, [0, -1.12, 0]);
    });
    glow.add(tor(7.02, 0.07, TAU, 64), C.glowBlue, [0, -2.92, 0], [Math.PI / 2, 0, 0]);
    glow.add(sphere(), C.glowBlue, [0, -4.95, 0], 0, [0.75, 0.4, 0.75]);
    // outer inlay ring + walkways + landing pad
    deck.add(flatRing(10.55, 10.75, 96), C.deckInlay, [0, 0.008, 0]);
    deck.add(flatRing(6.9, 7.0, 96), C.lilac, [0, 0.01, 0]);
    meta.walkways.forEach(wk => {
      const r0 = 5.6, len = Math.max(0.3, wk.r1 - r0), mid = r0 + len / 2, [x, z] = polar(wk.a, mid);
      deck.add(rbox(1.0, 0.04, len, 0.02), C.deckInlay, [x, 0.012, z], [0, faceOut(wk.a), 0]);
    });
    const ph = meta.primaryId && L.hosts?.[meta.primaryId];
    if (ph) {
      deck.add(cyl(5.0, 5.0, 0.05, 64), C.deckPad, [ph.x, 0.025, ph.z]);
      for (let i = 0; i < 8; i++) deck.add(flatRing(5.15, 5.45, 6, i * TAU / 8 + 0.12, TAU / 8 - 0.24), i % 2 ? C.lilac : C.peach, [ph.x, 0.012, ph.z]);
      deck.add(flatRing(2.6, 2.75, 64), C.hull, [ph.x, 0.055, ph.z]);
      // docking clamps reaching up to the hull
      for (const [lx, lz] of [[-1.7, 1.45], [-1.7, -1.45], [2.0, 0]]) {
        const [ox, oz] = rot2(lx, lz, ph.rotY), x = ph.x + ox, z = ph.z + oz;
        struct.add(cyl(0.34, 0.44, 0.22, 20), C.hull2, [x, 0.11, z]);
        struct.add(cyl(0.15, 0.2, 0.75, 16), C.hull3, [x, 0.55, z]);
        struct.add(sphere(), C.lilac, [x, 0.95, z], 0, [0.26, 0.14, 0.26]);
      }
    }
    // media cluster bases
    meta.clusters.forEach(cb => {
      deck.add(rbox(cb.w, 0.26, cb.d, 0.12), C.hull2, [cb.x, 0.13, cb.z], [0, cb.rotY, 0]);
      const [fx, fz] = rot2(0, cb.d / 2 + 0.02, cb.rotY);
      deck.add(rbox(cb.w * 0.7, 0.08, 0.06, 0.03), C.lilac, [cb.x + fx, 0.15, cb.z + fz], [0, cb.rotY, 0]);
    });
    // secondary sites: pad, bridge, docking arm
    const rimPts = [];
    meta.sites.forEach(si => {
      const { x, z } = si.pad;
      deck.add(padLathe(PAD_R, 0.6), C.deck, [x, 0, z]);
      deck.add(flatRing(2.45, 2.6, 64), C.lilac, [x, 0.01, z]);
      deck.add(cyl(1.0, 1.0, 0.04, 40), C.deckPad, [x, 0.02, z]);
      under.add(cyl(PAD_R - 0.25, 1.1, 1.3, 40), C.under, [x, -1.25, z]);
      under.add(prim('padStripe', () => new T.CylinderGeometry(PAD_R + 0.02, PAD_R + 0.02, 0.14, 40, 1, true)), C.peach, [x, -0.3, z]);
      glow.add(sphereLo(), C.glowBlue, [x, -1.95, z], 0, [0.45, 0.25, 0.45]);
      const e0 = deckEdge(si.a * DEG) - 0.5, e1 = si.dist - PAD_R + 0.3, len = e1 - e0, [bx, bz] = polar(si.a, (e0 + e1) / 2), ry = faceOut(si.a);
      deck.add(rbox(2.1, 0.34, len, 0.1), C.hull2, [bx, -0.17, bz], [0, ry, 0]);
      for (const side of [-1, 1]) { const [ox, oz] = rot2(side * 1.0, 0, ry); struct.add(rbox(0.14, 0.26, len - 0.4, 0.06), C.lilac, [bx + ox, 0.13, bz + oz], [0, ry, 0]); }
      // docking arm: pad edge -> ship engineering hull
      const [ax, az] = polar(si.a, si.dist + PAD_R - 0.55);
      const [tx, tz] = si.ship.attach;
      const top = [tx, SHIP_Y - 1.05 * SHIP_SCALE, tz], base = [ax, 0.5, az];
      struct.add(rbox(1.1, 0.5, 1.1, 0.16), C.hull2, [ax, 0.25, az]);
      struct.addM(cyl(1, 1, 1, 16), C.hull, beamM(base, top, 0.24));
      const mid = base.map((v, k) => (v + top[k]) / 2);
      struct.addM(cyl(1, 1, 1, 16), C.peach, beamM(mid.map((v, k) => v - (top[k] - base[k]) * 0.04), mid.map((v, k) => v + (top[k] - base[k]) * 0.04), 0.3));
      struct.add(sphere(), C.lilac, top, 0, 0.36);
      for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; rimPts.push([x + Math.cos(a) * (PAD_R - 0.28), z + Math.sin(a) * (PAD_R - 0.28)]); }
    });
    meta.miniPads.forEach(mp => {
      deck.add(padLathe(mp.r, 0.4), C.deck, [mp.x, 0.05, mp.z]);
      under.add(cyl(mp.r - 0.2, 0.3, 0.6, 20), C.under, [mp.x, -0.65, mp.z]);
    });

    const deckMat = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.82, metalness: 0 });
    const deckMesh = new T.Mesh(deck.geometry(), deckMat); deckMesh.receiveShadow = true; deckMesh.name = 'deck';
    const underMesh = new T.Mesh(under.geometry(), new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, metalness: 0.05 }));
    underMesh.name = 'underside';
    root.add(deckMesh, underMesh);
    if (!struct.empty) { const sm = new T.Mesh(struct.geometry(), new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, metalness: 0.05 })); sm.castShadow = true; sm.receiveShadow = true; root.add(sm); }
    root.add(new T.Mesh(glow.geometry(), new T.MeshBasicMaterial({ vertexColors: true })));
    const sh = shared();
    const tip = new T.Sprite(sh.glowSprite(C.glowBlue, 0.55)); tip.position.set(0, -5.1, 0); tip.scale.set(4, 4, 1); root.add(tip);
    R.tipGlows = [tip];

    // rim lights (main deck outline + pads), animated chase
    for (let i = 0; i < 64; i++) { const a = i / 64 * TAU, e = deckEdge(a) - 0.42; rimPts.unshift([Math.cos(a) * e, Math.sin(a) * e]); }
    const rim = new T.InstancedMesh(real(prim('rimLight', () => new T.SphereGeometry(0.11, 8, 6))), new T.MeshBasicMaterial({ color: 0xffffff }), rimPts.length);
    const mm = new T.Matrix4();
    rimPts.forEach(([x, z], i) => { mm.makeTranslation(x, 0.06, z); rim.setMatrixAt(i, mm); rim.setColorAt(i, lin(C.lilac)); });
    rim.instanceMatrix.needsUpdate = true;
    rim.name = 'rim-lights';
    root.add(rim);
    const base = [lin(C.lilac), lin(C.peach), lin(C.sky)];
    R.rim = { mesh: rim, n: rimPts.length, main: 64, base, col: new T.Color(), red: lin(0xff4d6d), white: lin(0xfff6ec) };

    buildBackdrop(ctx);
    buildShuttles(root, L);
    return root;
  }

  function buildBackdrop(ctx) {
    const bd = ctx.backdrop;
    if (!bd) return;
    const rnd = rng(7);
    const N = 340, pos = new Float32Array(N * 3), size = new Float32Array(N), phase = new Float32Array(N), speed = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      pos[i * 3] = (rnd() * 2 - 1) * 2.9;
      pos[i * 3 + 1] = 1.25 - Math.pow(rnd(), 1.5) * 2.6;
      pos[i * 3 + 2] = 0;
      size[i] = rnd() < 0.08 ? 3.2 + rnd() * 1.6 : 1.2 + rnd() * 1.6;
      phase[i] = rnd() * TAU; speed[i] = 0.6 + rnd() * 2.2;
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(pos, 3));
    g.setAttribute('aSize', new T.BufferAttribute(size, 1));
    g.setAttribute('aPhase', new T.BufferAttribute(phase, 1));
    g.setAttribute('aSpeed', new T.BufferAttribute(speed, 1));
    const mat = new T.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uPR: { value: ctx.renderer.getPixelRatio() }, uAlpha: { value: ctx.dark ? 0.95 : 0.8 } },
      vertexShader: 'attribute float aSize; attribute float aPhase; attribute float aSpeed; uniform float uTime; uniform float uPR; varying float vA;' +
        'void main(){ vA = 0.55 + 0.45 * sin(uTime * aSpeed + aPhase); vec4 p = modelViewMatrix * vec4(position, 1.0);' +
        'vA *= smoothstep(-1.25, 0.4, position.y); gl_PointSize = aSize * uPR * (0.8 + 0.2 * vA); gl_Position = projectionMatrix * p; }',
      fragmentShader: 'uniform float uAlpha; varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.05, d);' +
        'gl_FragColor = vec4(1.0, 0.97, 0.95, a * a * vA * uAlpha); }',
      transparent: true, depthWrite: false, blending: T.AdditiveBlending,
    });
    const stars = new T.Points(g, mat); stars.frustumCulled = false; stars.renderOrder = -10;
    const starLayer = new T.Group(); starLayer.add(stars); bd.add(starLayer);
    R.starMat = mat; R.starLayer = starLayer;

    const neb = new T.Group(); neb.position.z = 1; bd.add(neb);
    const defs = [[0xff9ccf, -1.25, 0.55, 2.0, 0.26], [0x7fe3e0, 1.35, 0.3, 1.7, 0.2], [0xb79cf0, 0.15, 0.95, 2.6, 0.24], [0xffc2a8, -0.4, -0.75, 2.2, 0.12]];
    R.nebula = defs.map(([col, x, y, s, op], i) => {
      const m = new T.Mesh(real(prim('plane', () => new T.PlaneGeometry(1, 1))), new T.MeshBasicMaterial({ map: glowTex(), color: lin(col), transparent: true, depthWrite: false, blending: T.AdditiveBlending, opacity: op * (ctx.dark ? 1.25 : 1) }));
      m.position.set(x, y, 0); m.scale.set(s * 1.4, s, 1); m.renderOrder = -9; m.frustumCulled = false;
      neb.add(m);
      return { m, op: op * (ctx.dark ? 1.25 : 1), ph: i * 1.7 };
    });
    R.nebLayer = neb;

    const comet = new T.Mesh(real(prim('plane', () => new T.PlaneGeometry(1, 1))), new T.MeshBasicMaterial({ map: streakTex(), transparent: true, depthWrite: false, blending: T.AdditiveBlending, opacity: 0, premultipliedAlpha: true }));
    comet.visible = false; comet.position.z = 2; comet.renderOrder = -8; comet.frustumCulled = false;
    bd.add(comet);
    R.comet = { mesh: comet, next: null, start: 0, dur: 2.4, from: [0, 0], to: [0, 0], rnd: rng(42) };
  }

  function buildShuttles(root, L) {
    const meta = L.meta || {};
    const loops = [
      { pts: [[100, 10.5], [160, 8], [215, 12.5], [300, 9.5], [20, 10]], y: 5.6, v: 1.7 },
      { pts: [[20, 6.5], [80, 11], [140, 6.5], [200, 10.5], [262, 6.5], [330, 11]], y: 6.3, v: 1.4 },
      { pts: [[350, 12], [50, 12.5], [20, 5]], y: 6.9, v: 2.0 },
    ];
    if (meta.sites?.length) { const s = meta.sites[0]; loops.push({ pts: [[s.a - 20, 8.5], [s.a, s.dist + 0.5], [s.a + 20, 8.5], [s.a + 140, 4.5]], y: 5.3, v: 1.6 }); }
    else loops.push({ pts: [[200, 12], [250, 12], [225, 5]], y: 5.4, v: 1.5 });
    const curves = loops.map(lp => {
      const pts = lp.pts.map(([a, r], i) => { const [x, z] = polar(a, r); return new T.Vector3(x, lp.y + Math.sin(i * 1.7) * 0.35, z); });
      const c = new T.CatmullRomCurve3(pts, true, 'centripetal');
      return { c, len: c.getLength(), v: lp.v, u: (hash(String(lp.y)) % 1000) / 1000 };
    });
    const k = new Kit();
    k.add(capsule(0.2, 0.95, 12), C.hull, [0, 0, 0], [Math.PI / 2, 0, 0]);
    k.add(sphere(), C.sky, [0, 0.07, 0.24], 0, [0.13, 0.1, 0.18]);
    k.add(rbox(0.75, 0.05, 0.26, 0.02), C.peach, [0, -0.02, -0.22]);
    k.add(rbox(0.05, 0.22, 0.22, 0.02), C.lilac, [0, 0.12, -0.32]);
    for (const sx of [-0.36, 0.36]) k.add(capsule(0.07, 0.42, 8), C.hull2, [sx, -0.02, -0.25], [Math.PI / 2, 0, 0]);
    const mesh = new T.InstancedMesh(k.geometry(), new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.55 }), curves.length);
    mesh.castShadow = false; mesh.frustumCulled = false; mesh.name = 'shuttles';   // moving: soft blob shadow below instead of the (static) shadow map
    const glowM = new T.InstancedMesh(real(prim('shGlow', () => new T.SphereGeometry(0.075, 8, 6))), new T.MeshBasicMaterial({ color: lin(0xffc48f) }), curves.length * 2);
    glowM.frustumCulled = false;
    const blobMat = new T.MeshBasicMaterial({ map: glowTex(), color: lin(0x3a2f6e), transparent: true, opacity: 0.38, depthWrite: false });
    const blob = new T.InstancedMesh(real(prim('blobPlane', () => new T.PlaneGeometry(1, 1).rotateX(-Math.PI / 2))), blobMat, curves.length);
    blob.frustumCulled = false; blob.renderOrder = 1; blob.userData.noPick = true;
    root.add(mesh, glowM, blob);
    R.shuttles = { mesh, glowM, blob, curves, m: new T.Matrix4(), m2: new T.Matrix4(), p: new T.Vector3(), tg: new T.Vector3(), up: new T.Vector3(0, 1, 0), tmp: new T.Vector3(),
      key: new T.Vector3(-12, 24, 9).normalize(), sp: new T.Vector3(), sq: new T.Quaternion(), ss: new T.Vector3() };
    placeShuttles(0, 0);
  }
  function placeShuttles(dt, motion) {
    const S = R.shuttles; if (!S) return;
    S.curves.forEach((cv, i) => {
      cv.u = (cv.u + dt * motion * cv.v / cv.len) % 1;
      cv.c.getPointAt(cv.u, S.p); cv.c.getTangentAt(cv.u, S.tg);
      S.tmp.copy(S.p).sub(S.tg);
      S.m.lookAt(S.p, S.tmp, S.up); S.m.setPosition(S.p);
      S.mesh.setMatrixAt(i, S.m);
      for (let j = 0; j < 2; j++) { S.m2.makeTranslation(j ? 0.36 : -0.36, -0.02, -0.48); S.m2.premultiply(S.m); S.glowM.setMatrixAt(i * 2 + j, S.m2); }
      // blob shadow: shuttle projected along the key light onto the deck (y = 0); hidden off the platform
      S.sp.copy(S.p).addScaledVector(S.key, -S.p.y / S.key.y); S.sp.y = 0.03;
      const on = Math.hypot(S.sp.x, S.sp.z) < DECK_R - 0.4;
      S.ss.set(1.1, 1, 0.75).multiplyScalar(on ? 1 : 0);
      S.sq.setFromAxisAngle(S.up, Math.atan2(S.tg.x, S.tg.z));
      S.m2.compose(S.sp, S.sq, S.ss); S.blob.setMatrixAt(i, S.m2);
    });
    S.mesh.instanceMatrix.needsUpdate = true; S.glowM.instanceMatrix.needsUpdate = true; S.blob.instanceMatrix.needsUpdate = true;
  }

  /* ============================================================= HOSTS */
  function buildDefiant() {
    const m = new Kit(), g = new Kit(), w = [];
    const hullGeo = prim('defiantHull', () => {
      const s = new T.Shape();
      s.moveTo(4.0, 0);
      s.quadraticCurveTo(3.25, 1.0, 1.4, 1.75); s.lineTo(-1.2, 2.2);
      s.quadraticCurveTo(-2.75, 2.35, -2.95, 1.5); s.lineTo(-2.55, 0.62);
      s.quadraticCurveTo(-2.3, 0, -2.55, -0.62); s.lineTo(-2.95, -1.5);
      s.quadraticCurveTo(-2.75, -2.35, -1.2, -2.2); s.lineTo(1.4, -1.75);
      s.quadraticCurveTo(3.25, -1.0, 4.0, 0);
      const geo = new T.ExtrudeGeometry(s, { depth: 0.34, bevelEnabled: true, bevelThickness: 0.22, bevelSize: 0.26, bevelSegments: 3, curveSegments: 10 });
      geo.rotateX(-Math.PI / 2); geo.translate(0, 0.22, 0);
      return geo;
    });
    m.add(hullGeo, C.hull);
    m.add(sphere(), C.hull2, [0.15, 0.74, 0], 0, [2.05, 0.42, 1.45]);
    m.add(sphere(), C.lilac, [-0.45, 1.08, 0], 0, [0.6, 0.2, 0.46]);
    m.add(sphere(), C.hull3, [0.4, 0.02, 0], 0, [2.6, 0.34, 1.65]);
    m.add(rbox(1.6, 0.08, 0.2, 0.03), C.peach, [2.35, 0.8, 0], [0, 0, -0.08]);
    for (const sz of [-1, 1]) {
      m.add(capsule(0.48, 3.4), C.hull, [-1.45, 0.38, sz * 2.05], [0, 0, Math.PI / 2]);
      m.add(cyl(0.5, 0.5, 0.24), C.peach, [-0.55, 0.38, sz * 2.05], [0, 0, Math.PI / 2]);
      m.add(cyl(0.5, 0.5, 0.12), C.lilac, [-2.3, 0.38, sz * 2.05], [0, 0, Math.PI / 2]);
      g.add(sphere(), C.glowRose, [0.18, 0.38, sz * 2.05], 0, [0.26, 0.34, 0.34]);
      g.add(box(), C.glowBlue, [-1.7, 0.38, sz * 2.52], 0, [2.0, 0.14, 0.05]);
      g.add(box(), C.glowPeach, [-2.72, 0.5, sz * 0.82], 0, [0.08, 0.2, 0.55]);
      for (let i = 0; i < 6; i++) w.push([-2.6 + i * 0.42, 0.62, sz * 2.05 + sz * 0.38, sz > 0 ? 0 : Math.PI, -0.9]);
    }
    g.add(sphere(), C.glowBlue, [2.9, 0.18, 0], 0, [0.42, 0.18, 0.6]);
    for (let i = 0; i < 22; i++) {

    const cA = lin(C.glowMint), cB = lin(C.glowButter), cC = lin(C.glowRose);
    let cur = null;
    k.anim = (grp, t, dt, mo, st) => {
      const pct = Math.max(0, Math.min(100, metric(grp.userData.service, /usedpct|^used$/i) ?? 60));
      const tgt = Math.max(0.02, pct / 100) * 1.72;

      fill.scale.y = cur;

  B.sensor = k => {
    const { m, g, w, s } = k;
    const acc = ACCENT[s.type] || C.peach;

    if (s.type === 'database') {
      for (let i = 0; i < 3; i++) { m.add(cyl(0.5, 0.5, 0.3), C.hull, [0, 0.42 + i * 0.36, 0]); m.add(cyl(0.52, 0.52, 0.06), acc, [0, 0.6 + i * 0.36, 0]); }

      m.add(cyl(0.5, 0.5, 0.14), acc, [0, 0.74, 0]);

      if (s.type === 'automation') m.add(tor(0.62, 0.05, TAU, 32), acc, [0, 1.12, 0], [Math.PI / 2, 0, 0]);
      if (s.type === 'monitoring') m.add(dishGeo(), C.hull2, [0, 1.48, 0.1], [0.7, 0, 0], 0.42);
      if (s.type === 'dashboard') { m.add(rbox(0.72, 0.46, 0.08, 0.04), C.hull2, [0, 0.95, 0.5]); g.add(box(), C.glowBlue, [0, 0.95, 0.545], 0, [0.6, 0.36, 0.02]); }

  /* ============================================================ STATUS */

    });

    if (rim) {

    palette: {

        light: { stops: [[0, '#2b2f6e'], [0.28, '#4a4796'], [0.52, '#6d64b8'], [0.78, '#a497dc'], [1, '#c9b8ec']],

        ambient: { color: 0xdcd8ff, intensity: 0.04 },
        hemi: { sky: 0xf6f2ff, ground: 0x8d82cc, intensity: 0.16 },
        key: { color: 0xfff0e2, intensity: 0.8, position: [-12, 24, 9] },

      lightsDark: {

        hemi: { sky: 0xd8d0ff, ground: 0x4c4682, intensity: 0.14 },

<script>/* ==== theme-ds9.js ==== */
/* HomeDeck theme "Deep Space 9": the station is the hub; hosts are ships docked at its ring and pylons
   (defiant -> Defiant class, enterprise* -> Galaxy class, anything else -> Danube-class runabout).
   Services are not scattered modules here: each shows as a small status light on its ship's hull, and the
   glass panels (service list, search, detail card) are where they are read. Clicking a ship frames it.
   Implements THEMES.md, including the optional pins:'hosts' and highlightHost hooks. The LCARS master systems
   displays that used to open from a ship now live in the separate full-screen "lcars" theme (src/lcars-*.js). */
(function () {

    rose: 0xef8a9a, peach: 0xf4a97f, lilac: 0xb79cf0, sky: 0x8ec5f5, butter: 0xf6d27d, mint: 0x7fd6b0, copper: 0xd9906e,
    win: 0xffdcaa, glowBlue: 0x9ddcff, glowRed: 0xff7488, reactor: 0xff8a9c, deflector: 0x9fe0ff,
  };

  let R = fresh();

    if (key) return { geo: prim('blade:' + key, () => blade(points, side, n, wf, tf, bandsAt, sq).geo), tip: curve.getPointAt(1), mid: curve.getPointAt(0.45) };
    const radial = sg(28), pos = [], nor = [], idx = [], col = [];

    for (let i = 0; i <= n; i++) {

        const c = Math.sign(c0) * Math.pow(Math.abs(c0), e), s = Math.sign(s0) * Math.pow(Math.abs(s0), e);   // superellipse: sq > 2 = squarer
        off.copy(Nv).multiplyScalar(c * w).addScaledVector(Bv, s * th);

        nor.push(nn.x, nn.y, nn.z);

        col.push(cc.r, cc.g, cc.b);

    g.setAttribute('normal', new T.Float32BufferAttribute(nor, 3));
    g.setAttribute('color', new T.Float32BufferAttribute(col, 3));

  }

  const hullMaterial = (rough = 0.55, metal = 0.08) => { const m = new T.MeshStandardMaterial({ vertexColors: true, roughness: rough, metalness: metal }); R.mats.push(m); return m; };
  /** Hull material with the engine's procedural plating (falls back to plain if the engine lacks it). */
  const plated = (opts, rough, metal) => { const m = hullMaterial(rough, metal); return HD.scene?.surface ? HD.scene.surface(m, opts) : m; };
  const glowMaterial = () => { const m = new T.MeshBasicMaterial({ vertexColors: true }); R.mats.push(m); return m; };

  /* ----------------------------------------------------------- textures */
  function glowTex() {
    let t = R.tex.get('glow'); if (t) return t;

    let t = R.tex.get('ring'); if (t) return t;

  /* ============================================================ STATION */
  // Proportions from the DS9 schematics (side + top view), in units of the docking ring's outer radius R = 10.3:
  // thin docking ring (~0.05 R tall), habitat ring at 0.36-0.42 R, promenade ~0.2 R, three straight crossover
  // bridges that flare into both rings, and six crescent pylons that rise ~0.65 R and sweep forward in plan so
  // their tips hang over the habitat ring.
  const RING_R0 = 9.3, RING_R1 = 10.3, RING_H = 0.3;
  const HAB_R0 = 3.75, HAB_R1 = 4.35, CORE_R = 2.12;
  const BRIDGES = [90, 210, 330];                  // degrees (x = cos, z = sin)
  const PYLONS = BRIDGES.slice();                  // pylons rise where the crossover bridges meet the docking ring
  const AIRLOCKS = [15, 60, 135, 180, 255, 300];   // primary docking ring airlocks
  const polar = (a, r) => [Math.cos(a * DEG) * r, Math.sin(a * DEG) * r];
  const tangentRot = a => Math.atan2(-Math.cos(a * DEG), -Math.sin(a * DEG));   // rotY: local +X along the ring tangent
  const nearAngle = (a, list, w) => list.some(p => Math.abs(((a - p + 540) % 360) - 180) < w);
  // Pylon centreline in its radial plane [r, height]: rises almost vertically, bulges slightly outboard, then curls in.
  const PYLON_PROF = [[9.8, 0.3], [10.2, 1.5], [10.28, 3.4], [9.65, 4.95], [8.25, 6.2], [6.35, 7.0], [4.85, 7.2], [4.3, 6.95]];
  const pylonPts = (a, sign) => PYLON_PROF.map(([r, y]) => { const [x, z] = polar(a, r); return new T.Vector3(x, y * (sign > 0 ? 1 : -0.95), z); });
  const pylonSide = a => new T.Vector3(-Math.sin(a * DEG), 0, Math.cos(a * DEG));   // plane normal = tangential direction
  /** Window strip: n lights around a ring of radius r at height y, facing outward. */
  function ringWindows(out, r, y, n, size, skip) {
    for (let i = 0; i < n; i++) { const a = (i + 0.5) / n * 360; if (skip && skip(a)) continue; out.push({ r, y, a, s: size }); }
  }
  function windowsMesh(list, color) {
    const wm = new T.InstancedMesh(real(box()), new T.MeshBasicMaterial({ color: lin(color) }), list.length);
    R.mats.push(wm.material);
    const m4 = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), v = new T.Vector3(), sc = new T.Vector3();
    list.forEach((w, i) => {
      if (w.p) { m4.compose(v.set(...w.p), q.setFromEuler(e.set(0, w.ry || 0, 0)), sc.set(...w.s)); }
      else { const [x, z] = polar(w.a, w.r); m4.compose(v.set(x, w.y, z), q.setFromEuler(e.set(0, -w.a * DEG, 0)), sc.set(...w.s)); }

  }
  /** Closed, bevelled ring sector centred on angle 0 (place with rotY = -angle). */
  function sectorBlock(r0, r1, y0, y1, span) {
    return prim(`sec${r0},${r1},${y0},${y1},${span}`, () => {
      const h = span * DEG / 2, b = Math.min(0.05, (y1 - y0) / 4, (r1 - r0) / 4), s = new T.Shape();
      s.absarc(0, 0, r1, -h, h, false); s.absarc(0, 0, r0, h, -h, true); s.closePath();

  function buildStation(ctx) {

    // ---- crossover bridges, flaring into both rings
    const flareOut = slab('flareOut3', [['M', RING_R0 - 1.9, 0.43], ['Q', RING_R0 - 0.55, 0.5, RING_R0 + 0.05, 1.55], ['L', RING_R0 + 0.05, -1.55], ['Q', RING_R0 - 0.55, -0.5, RING_R0 - 1.9, -0.43], ['Z']], 0.28, 0.05, -0.04, 24);
    const flareIn = slab('flareIn3', [['M', HAB_R1 + 1.2, 0.43], ['Q', HAB_R1 + 0.35, 0.5, HAB_R1 - 0.05, 1.0], ['L', HAB_R1 - 0.05, -1.0], ['Q', HAB_R1 + 0.35, -0.5, HAB_R1 + 1.2, -0.43], ['Z']], 0.28, 0.05, -0.04, 24);
    BRIDGES.forEach(a => {

    kd.add(lathe('dockIn3', ringProfile(RING_R0 - 0.03, RING_R0 + 0.02, -0.14, 0.14, 0.01), 256), C.dark);
    k.add(lathe('dockStripe3', ringProfile(9.62, 9.86, RING_H + 0.055, RING_H + 0.085, 0.01), 256), C.rose);
    AIRLOCKS.forEach(a => {
      k.add(sectorBlock(RING_R1 - 0.05, RING_R1 + 0.42, -0.26, 0.26, 9), C.hull2, [0, 0, 0], rot(a));

  const lerpProf = (prof, i0, i1, r) => {   // y on a lathe profile between indices, at radius r (profile is monotonic in r there)

  function toShape(cmds) {

    return { hosts: H, services: P, bounds: { radius: 16, center: [0, 0], points }, meta: { docks } };
  }

  /* ======================================================== ENVIRONMENT */
  function environment(ctx) {
    T = ctx.THREE;
    R.dark = !!ctx.dark;
    const root = new T.Group(); root.name = 'ds9-env';
    root.add(buildStation(ctx));
    buildRunabouts(root);
    buildBackdrop(ctx);
    return root;
  }

  function buildBackdrop(ctx) {
    const bd = ctx.backdrop; if (!bd) return;
    const rnd = rng(9);
    const N = 380, pos = new Float32Array(N * 3), size = new Float32Array(N), phase = new Float32Array(N), speed = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      pos[i * 3] = (rnd() * 2 - 1) * 2.9; pos[i * 3 + 1] = 1.25 - Math.pow(rnd(), 1.4) * 2.6; pos[i * 3 + 2] = 0;
      size[i] = rnd() < 0.08 ? 3.2 + rnd() * 1.6 : 1.1 + rnd() * 1.6; phase[i] = rnd() * TAU; speed[i] = 0.6 + rnd() * 2.2;
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(pos, 3));
    g.setAttribute('aSize', new T.BufferAttribute(size, 1));
    g.setAttribute('aPhase', new T.BufferAttribute(phase, 1));
    g.setAttribute('aSpeed', new T.BufferAttribute(speed, 1));
    const mat = new T.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uPR: { value: ctx.renderer.getPixelRatio() }, uAlpha: { value: ctx.dark ? 0.95 : 0.85 } },
      vertexShader: 'attribute float aSize; attribute float aPhase; attribute float aSpeed; uniform float uTime; uniform float uPR; varying float vA;' +
        'void main(){ vA = 0.55 + 0.45 * sin(uTime * aSpeed + aPhase); vec4 p = modelViewMatrix * vec4(position, 1.0);' +
        'vA *= smoothstep(-1.3, 0.3, position.y); gl_PointSize = aSize * uPR * (0.8 + 0.2 * vA); gl_Position = projectionMatrix * p; }',
      fragmentShader: 'uniform float uAlpha; varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.05, d);' +
        'gl_FragColor = vec4(1.0, 0.97, 0.95, a * a * vA * uAlpha); }',
      transparent: true, depthWrite: false, blending: T.AdditiveBlending,
    });
    R.mats.push(mat);
    const stars = new T.Points(g, mat); stars.frustumCulled = false; stars.renderOrder = -10;
    const layer = new T.Group(); layer.add(stars); bd.add(layer);
    R.starMat = mat; R.starLayer = layer;
    const neb = new T.Group(); neb.position.z = 1; bd.add(neb);
    const defs = [[0xd889ff, -1.3, 0.6, 2.2, 0.28], [0xff8fc8, 1.2, 0.5, 1.8, 0.22], [0x8fb6ff, 0.2, 1.0, 2.6, 0.22], [0xffc2e2, -0.4, -0.8, 2.2, 0.12]];
    R.nebula = defs.map(([col, x, y, s, op], i) => {
      const m = new T.Mesh(real(prim('plane', () => new T.PlaneGeometry(1, 1))), new T.MeshBasicMaterial({ map: glowTex(), color: lin(col), transparent: true, depthWrite: false, blending: T.AdditiveBlending, opacity: op * (ctx.dark ? 1.2 : 1) }));
      R.mats.push(m.material);
      m.position.set(x, y, 0); m.scale.set(s * 1.4, s, 1); m.renderOrder = -9; m.frustumCulled = false;
      neb.add(m);
      return { m, op: op * (ctx.dark ? 1.2 : 1), ph: i * 1.7 };
    });
    R.nebLayer = neb;
    const worm = new T.Mesh(real(prim('plane', () => new T.PlaneGeometry(1, 1))), new T.MeshBasicMaterial({ map: wormTex(), transparent: true, depthWrite: false, blending: T.AdditiveBlending, opacity: 0, premultipliedAlpha: true }));
    R.mats.push(worm.material);
    worm.visible = false; worm.position.set(1.05, 0.62, 2); worm.renderOrder = -8; worm.frustumCulled = false;
    bd.add(worm);
    R.worm = { mesh: worm, next: null, start: 0, dur: 6.5, rnd: rng(71) };
  }

  function buildRunabouts(root) {
    const loops = [
      { r: 15.5, y: 2.2, v: 0.09, ph: 0 },
      { r: 13.2, y: -2.6, v: -0.12, ph: 2.1 },
      { r: 18.0, y: 4.2, v: 0.07, ph: 4.0 },
    ];
    const k = new Kit();
    k.add(rbox(0.75, 0.17, 0.28, 0.06), C.hull, [0, 0, 0]);
    k.add(rbox(0.25, 0.13, 0.24, 0.05), C.hull2, [0.42, -0.01, 0]);
    k.add(rbox(0.5, 0.02, 0.03, 0.01), C.rose, [-0.05, 0.09, 0.12]);
    [-1, 1].forEach(sz => k.add(capsule(0.045, 0.55, 8), C.hull3, [-0.12, -0.12, sz * 0.18], [0, 0, Math.PI / 2]));
    const mesh = new T.InstancedMesh(k.geometry(), hullMaterial(0.5), loops.length);
    mesh.castShadow = false; mesh.frustumCulled = false; mesh.userData.noPick = true;   // moving: no shadow-map shadow (shadows are static)
    root.add(mesh);
    R.runabouts = { mesh, loops, m: new T.Matrix4(), q: new T.Quaternion(), e: new T.Euler(), p: new T.Vector3(), s: new T.Vector3(1, 1, 1).multiplyScalar(0.45), t: 0 };
    placeRunabouts(0);
  }
  function placeRunabouts(dt) {
    const S = R.runabouts; if (!S) return;
    S.t += dt;
    S.loops.forEach((lp, i) => {
      const a = lp.ph + S.t * lp.v;
      S.p.set(Math.cos(a) * lp.r, lp.y + Math.sin(a * 2) * 0.4, Math.sin(a) * lp.r);
      const heading = Math.atan2(-Math.cos(a), -Math.sin(a)) + (lp.v < 0 ? Math.PI : 0);
      S.q.setFromEuler(S.e.set(0, heading, Math.cos(a * 2) * 0.08));
      S.m.compose(S.p, S.q, S.s);
      S.mesh.setMatrixAt(i, S.m);
    });
    S.mesh.instanceMatrix.needsUpdate = true;
  }

  /* ============================================================== HOSTS */
  function buildHost(host, ctx) {
    T = ctx.THREE;
    const kind = shipKind(host), m = info(kind, host);
    const group = new T.Group(); group.name = 'ship:' + host.id;
    const body = new T.Group(); body.scale.setScalar(m.scale); group.add(body);
    const mats = {
      hull: hullMaterial(0.4, 0.16),
      saucer: hullMaterial(0.4, 0.16),
      dark: hullMaterial(0.32, 0.4),
      trim: hullMaterial(0.4, 0.25),
    };
    let hullMat = mats.hull;
    m.parts.forEach(pt => {
      if (pt.kit.empty) return;
      const mesh = new T.Mesh(pt.kit.geometry(), mats[pt.mat]); mesh.castShadow = true; mesh.receiveShadow = true;
      body.add(mesh);
    });
    const glow = new T.Mesh(m.glow.geometry(), glowMaterial()); body.add(glow);
    if (m.wins.length) body.add(windowsMesh(m.wins, C.win));
    m.decals.forEach(d => body.add(decalMesh(d)));
    m.sprites.forEach(sp => { const s = new T.Sprite(spriteMat(sp.c, sp.o)); s.position.set(...sp.p); s.scale.set(sp.s, sp.s, 1); s.userData.noPick = true; body.add(s); });
    group.userData.pinHeight = m.pin * m.scale + 0.3;
    group.userData.hd = { kind: 'ship', hullMats: [mats.hull, mats.saucer], hl: 'none' };
    return group;
  }
  function highlightHost(group, state) {
    const h = group?.userData?.hd; if (!h) return;
    h.hl = state;
    h.hullMats.forEach(mt => mt.emissive.setRGB(state === 'hover' ? 0.06 : 0, state === 'hover' ? 0.05 : 0, state === 'hover' ? 0.11 : 0));
  }

  /* =========================================================== SERVICES */
  // A service is a small light on its ship's hull: warm and quiet when healthy, amber pulse when degraded,
  // red strobe when down. The glass panels are where services are read; the hull lights carry status at a glance.
  function buildService(s, ctx) {
    T = ctx.THREE;
    const group = new T.Group(); group.name = 'svc:' + s.id;
    const coreMat = new T.MeshBasicMaterial({ color: lin(C.win) }); R.mats.push(coreMat);
    const core = new T.Mesh(real(sphereLo()), coreMat); core.scale.setScalar(0.075);
    const hit = new T.Mesh(real(sphereLo()), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false }));
    R.mats.push(hit.material);
    hit.scale.setScalar(0.24);
    // Hull lights are status indicators only: clicks and hovers go to the ship.
    core.userData.noPick = true; hit.userData.noPick = true;
    const glow = new T.Sprite(spriteMat(C.win, 0.0)); glow.scale.set(0.9, 0.9, 1); glow.userData.noPick = true;
    const ring = new T.Sprite(new T.SpriteMaterial({ map: ringTex(), color: lin(C.lilac), transparent: true, depthWrite: false, opacity: 0.95, premultipliedAlpha: true }));
    R.mats.push(ring.material);
    ring.scale.set(0.75, 0.75, 1); ring.visible = false; ring.userData.noPick = true;
    group.add(core, hit, glow, ring);
    group.userData.pinHeight = 0.4;
    group.userData.hd = { coreMat, core, glow, ring, status: 'healthy', hl: 'none', phase: (hash(s.id) % 1000) / 1000 * TAU };
    return group;
  }
  const STATUS_COL = { healthy: 0xfff3e2, degraded: 0xffb43c, down: 0xff4d6d };
  function applyStatus(obj, status) {
    const h = obj?.userData?.hd; if (!h || h.kind === 'ship') return;
    h.status = status;
    h.coreMat.color.copy(lin(STATUS_COL[status] || C.win));
    h.glow.material.color.copy(lin(STATUS_COL[status] || C.win));
  }
  function highlight(obj, st) {
    const h = obj?.userData?.hd; if (!h || h.kind === 'ship') return;
    h.hl = st; h.ring.visible = st === 'selected';
  }

  /* ============================================================ AMBIENT */
  function ambient(scene, t, state) {
    const dt = state.dt || 0.016, mo = state.reducedMotion ? 0 : 1;
    const pulse = mo ? 0.5 + 0.5 * Math.sin(t * 3.4) : 0.7;
    const strobe = mo ? Math.pow(Math.max(0, Math.sin(t * 2.6)), 6) : 0.6;
    state.services.forEach(g => {
      const h = g.userData.hd; if (!h) return;
      const o = h.status === 'down' ? 0.35 + 0.65 * strobe : h.status === 'degraded' ? 0.45 + 0.45 * pulse : 0;
      h.glow.material.opacity = o;
      const sc = h.status === 'healthy' ? 0.2 : h.status === 'down' ? 0.75 : 0.6;
      h.glow.scale.set(sc, sc, 1);
      h.core.visible = h.status !== 'healthy'; h.core.scale.setScalar(0.05);
      if (h.ring.visible) h.ring.material.rotation += dt * 0.8 * mo;
    });
    const L = R.lights, alert = state.alertMix || 0;
    if (L) {
      const rp = mo ? 0.5 + 0.5 * Math.sin(t * 2.4) : 0.8;
      for (let i = 0; i < L.n; i++) {
        const tip = i < 6, x = tip ? i / 6 : (i - 6) / 24;
        const chase = mo ? Math.pow(0.5 + 0.5 * Math.sin(t * 2 - x * TAU * (tip ? 1 : 3)), 8) : 0.3;
        L.col.copy(L.base[i % 3]).lerp(L.white, tip ? 0.4 + 0.6 * pulse : chase * 0.8);
        if (alert > 0) L.col.lerp(L.red, alert).multiplyScalar(1 - alert * (1 - (0.35 + 0.65 * rp)));
        L.mesh.setColorAt(i, L.col);
      }
      L.mesh.instanceColor.needsUpdate = true;
    }
    if (R.beacon) R.beacon.material.opacity = 0.25 + 0.6 * (mo ? Math.pow(Math.max(0, Math.sin(t * 1.6)), 10) : 0.5);
    if (R.reactor) R.reactor.material.opacity = 0.55 + (mo ? 0.12 * Math.sin(t * 1.1) : 0) + alert * 0.2;
    if (R.windows) R.windows.material.color.copy(lin(C.win)).lerp(lin(0xff9aa8), alert * 0.5);
    if (R.starMat) R.starMat.uniforms.uTime.value = mo ? t : 0;
    const v = state.view || {};
    if (R.starLayer) R.starLayer.position.x = Math.sin(v.az || 0) * 0.12;
    if (R.nebLayer) { R.nebLayer.position.x = Math.sin(v.az || 0) * 0.25; R.nebula.forEach(n => { n.m.material.opacity = n.op * (mo ? 0.85 + 0.15 * Math.sin(t * 0.4 + n.ph) : 1); }); }
    placeRunabouts(dt * mo);
    // the wormhole opens every ~35-60 s
    const w = R.worm;
    if (w) {
      if (w.next == null) w.next = t + 8 + w.rnd() * 8;
      if (!mo) w.mesh.visible = false;
      else if (!w.mesh.visible && t >= w.next) { w.start = t; w.mesh.visible = true; w.mesh.position.x = (v.aspect || 1.6) * (0.45 + w.rnd() * 0.3) * (w.rnd() < 0.5 ? -1 : 1); }
      if (w.mesh.visible) {
        const f = (t - w.start) / w.dur;
        if (f >= 1) { w.mesh.visible = false; w.next = t + 35 + w.rnd() * 25; }
        else {
          const open = Math.sin(Math.min(1, f * 1.15) * Math.PI);
          const s = 0.05 + 0.55 * Math.pow(open, 0.7);
          w.mesh.scale.set(s, s, 1); w.mesh.rotation.z -= dt * 1.6;
          w.mesh.material.opacity = open * (R.dark ? 0.95 : 0.85);
        }
      }
    }
  }

  function dispose() {
    G.dispose();
    R.tex.forEach(t => t.dispose());
    R.mats.forEach(m => m.dispose());
    Object.keys(modelInfo).forEach(k => delete modelInfo[k]);
    R = fresh();
  }

  HD.themes.register({
    id: 'ds9',
    name: 'Deep Space 9',
    description: 'Deep Space 9 with docked ships; services are read in the glass panels',
    pins: 'hosts',
    palette: {
      sky: {
        light: { stops: [[0, '#2a2468'], [0.3, '#4a3a96'], [0.56, '#7259b8'], [0.8, '#a98ad8'], [1, '#cdb6ee']],
          glows: [[16, 18, 55, 45, '#d678ff', 0.42], [84, 20, 45, 40, '#ff8cc8', 0.34], [50, 104, 80, 45, '#ffd6f0', 0.5]] },
        dark: { stops: [[0, '#0b0a2a'], [0.4, '#171346'], [0.74, '#2a2070'], [1, '#3b2c86']],
          glows: [[16, 18, 55, 45, '#aa50dc', 0.3], [84, 20, 45, 40, '#dc5aa0', 0.2], [50, 104, 80, 45, '#8c64dc', 0.32]] },
      },
      lights: {
        ambient: { color: 0xdcd8ff, intensity: 0.04 },
        hemi: { sky: 0xf6f2ff, ground: 0x8378c8, intensity: 0.14 },
        key: { color: 0xfff0e2, intensity: 1.25, position: [-14, 22, 10] },
      },
      lightsDark: {
        ambient: { color: 0xbdb6ff, intensity: 0.04 },
        hemi: { sky: 0xd8d0ff, ground: 0x4a3f86, intensity: 0.12 },
        key: { color: 0xf3e9ff, intensity: 1.1, position: [-14, 22, 10] },
      },
      env: { intensity: 0.55, top: 0xffffff, horizon: 0xd2c8f2, bottom: 0x4a4088, key: 4.2, fill: 1.0, fillColor: 0xd8c8ff },
      toneMapping: 'aces', exposure: 1.05,
      shadowSoftness: 6,
      status: { healthy: 0x4cc495, degraded: 0xf0b23c, down: 0xec5a74 },
      alertTint: 0xff7b93,
      cssVars: { '--hd-accent': '#b79cf0' },
    },
    environment, layout, buildHost, buildService, applyStatus, highlight, highlightHost, ambient, dispose,
  });
})();
</script>
<script>/* ==== ui.js ==== */
/* HomeDeck UI (Agent B): every floating panel rendered into #hd-ui.
   Top bar (brand, search, host switcher, live + stardate, notifications, theme),
   KPI cards, detail card / sheet, activity timeline, tabbed inventory list, map controls.
   update() patches DOM in place (keyed rows, textContent) so focus, scroll and open menus survive. */
(function () {
  'use strict';
  const HD = window.HomeDeck;
  const U = HD.util;
  const esc = s => U.escapeHtml(s == null ? '' : s);

  /* ---------------- Icons (24px grid, 1.75 stroke, currentColor) ---------------- */
  const ICON = {
    search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
    chevDown: '<path d="m6 9 6 6 6-6"/>',
    chevRight: '<path d="m9.5 6 6 6-6 6"/>',
    bell: '<path d="M6 9a6 6 0 0 1 12 0c0 6.5 2.5 8 2.5 8h-17S6 15.5 6 9"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/>',
    close: '<path d="M17 7 7 17M7 7l10 10"/>',
    plus: '<path d="M12 5.5v13M5.5 12h13"/>',
    minus: '<path d="M5.5 12h13"/>',
    rotL: '<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/>',
    rotR: '<path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.6"/><path d="M20 4v4.6h-4.6"/>',
    reset: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/>',
    target: '<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    restart: '<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/>',
    deploy: '<path d="M12 16V4M6.5 9.5 12 4l5.5 5.5"/><path d="M5 20h14"/>',
    status: '<path d="M3 12h4l2.5-6.5 5 13L17 12h4"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/>',
    server: '<rect x="3.5" y="4" width="17" height="7" rx="2"/><rect x="3.5" y="13" width="17" height="7" rx="2"/><path d="M7.5 7.5h.01M7.5 16.5h.01"/>',
    alert: '<path d="M10.3 4.2 2.9 17.5A2 2 0 0 0 4.6 20.5h14.8a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 16.8v.1"/>',
    ext: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>',
    more: '<circle cx="5.5" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18.5" cy="12" r="1.1"/>',
    palette: '<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1 0 1.6-.7 1.6-1.5 0-.6-.4-1-.4-1.6 0-.9.7-1.6 1.6-1.6h1.9a3.8 3.8 0 0 0 3.8-3.8c0-4.8-3.8-8.5-8.5-8.5z"/><circle cx="7.8" cy="11.5" r="1"/><circle cx="10.5" cy="7.6" r="1"/><circle cx="15.3" cy="8.2" r="1"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    box: '<path d="M20 7.8 12 3.5 4 7.8v8.4l8 4.3 8-4.3z"/><path d="m4 7.8 8 4.4 8-4.4M12 12.2v8.3"/>',
  };
  const icon = (name, cls = '') =>
    `<svg class="hd-i ${cls}" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICON[name] || ''}</svg>`;

  /* ---------------- Small formatting helpers ---------------- */
  const ST_LABEL = { healthy: 'Healthy', degraded: 'Degraded', down: 'Down' };
  const ST_CLS = { healthy: 'ok', degraded: 'warn', down: 'down' };
  const RANK = { down: 0, degraded: 1, healthy: 2 };
  const KIND_ICON = { restart: 'restart', deploy: 'deploy', status: 'status', info: 'info' };
  const TYPE_LABEL = { dns: 'DNS', auth: 'Auth proxy', proxy: 'Reverse proxy', files: 'Files', generic: 'App' };
  const typeLabel = t => TYPE_LABEL[t] || (t ? t.charAt(0).toUpperCase() + t.slice(1).replace(/-/g, ' ') : 'Service');
  const fmtNum = v => (typeof v === 'number'
    ? v.toLocaleString('en-US', { maximumFractionDigits: Math.abs(v) < 100 ? 1 : 0 }) : String(v ?? '—'));
  const fmtK = n => {
    if (n == null) return '—';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'k';
    return String(Math.round(n));
  };
  const fmtGB = mb => (mb / 1024).toFixed(mb >= 10240 ? 0 : 1);
  const absTime = ts => new Date(ts).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const isoTime = ts => new Date(ts).toISOString();
  const chip = (status, label) =>
    `<span class="hd-chip is-${ST_CLS[status] || 'idle'}"><span class="hd-dot" aria-hidden="true"></span>${esc(label || ST_LABEL[status] || status)}</span>`;
  const heroText = s => {
    const m = s.metrics && s.metrics[0];
    return m ? `${fmtNum(m.value)}${m.unit ? (m.unit === '%' ? '%' : ' ' + m.unit) : ''}` : '';
  };
  const elbow = (extra = '') => `<span class="hd-elbow ${extra}" aria-hidden="true"></span>`;

  /* ---------------- State ---------------- */
  const S = {
    root: null, snap: null, themeId: null, hostFilter: 'all', hostCard: null, selected: null, hover: null,
    tab: 'services', sheetOpen: false, popover: null, popTrigger: null,
    searchIdx: 0, searchResults: [], ready: false, returnFocus: null, red: false, moodRed: null,
    membersOpen: new Set(), logs: { id: null, state: 'idle', lines: null, error: null }, logsStop: null,
  };
  const E = {};
  const mq = window.matchMedia ? window.matchMedia('(max-width: 720px)') : { matches: false, addEventListener() {} };
  const isMobile = () => mq.matches;
  const svcById = id => S.snap?.services.find(s => s.id === id) || null;
  const hostById = id => S.snap?.hosts.find(h => h.id === id) || null;

  function hostStats(hostId) {
    const list = (S.snap?.services || []).filter(s => hostId === 'all' || s.host === hostId);
    const up = list.filter(s => s.status === 'healthy').length;
    const worst = list.some(s => s.status === 'down') ? 'down' : list.some(s => s.status === 'degraded') ? 'degraded' : 'healthy';
    return { up, total: list.length, cls: ST_CLS[worst], worst };
  }

  /* ---------------- Keyed DOM patcher ----------------
     items: [{ key, html, cls, attrs, tag }]. With `wrap` (e.g. 'li') each item lives in a wrapper and
     `tag` (if set) is an inner element that receives html/cls/attrs (so a focused <button> survives). */
  function patch(container, items, wrap) {
    if (!container) return;
    const old = new Map();
    for (const c of container.children) if (c.dataset.key) old.set(c.dataset.key, c);
    let prev = null;
    for (const it of items) {
      let w = old.get(it.key);
      const isNew = !w;
      if (w) old.delete(it.key);
      else {
        w = document.createElement(wrap || it.tag || 'div');
        w.dataset.key = it.key;
        if (wrap && it.tag) w.appendChild(document.createElement(it.tag));
      }
      const el = wrap && it.tag ? w.firstElementChild : w;
      if (el._h !== it.html) { el.innerHTML = it.html; el._h = it.html; }
      const cls = it.cls || '';
      if (el._c !== cls) { el.className = cls; el._c = cls; }
      if (it.attrs) {
        for (const k in it.attrs) {
          const v = it.attrs[k];
          if (v == null || v === false) el.removeAttribute(k);
          else if (el.getAttribute(k) !== String(v)) el.setAttribute(k, String(v));
        }
      }
      if (wrap && it.tag && it.wcls != null && w.className !== it.wcls) w.className = it.wcls;
      if (isNew && S.ready && it.animate) {
        w.classList.add('is-new');
        setTimeout(() => w.classList.remove('is-new'), 1400);
      }
      const want = prev ? prev.nextElementSibling : container.firstElementChild;
      if (w !== want) container.insertBefore(w, want);
      prev = w;
    }
    old.forEach(el => el.remove());
  }
  const setText = (el, txt) => { if (el && el.textContent !== txt) el.textContent = txt; };
  const setAttr = (el, k, v) => { if (el && el.getAttribute(k) !== String(v)) el.setAttribute(k, String(v)); };

  /* Smooth number tween (tabular numerals keep width stable). */
  function tweenNum(el, to, decimals) {
    if (!el) return;
    const fmt = v => v.toFixed(decimals);
    const from = el._v;
    el._v = to;
    if (from == null || from === to || U.reducedMotion() || !S.ready) { setText(el, fmt(to)); return; }
    cancelAnimationFrame(el._raf);
    const t0 = performance.now(), dur = 650;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      setText(el, fmt(from + (to - from) * e));
      if (k < 1) el._raf = requestAnimationFrame(step);
    };
    el._raf = requestAnimationFrame(step);
  }

    trig.setAttribute('aria-expanded', 'true');
    if (viaKeyboard) {

    if (!S.popover) return;

    if (pop) pop.hidden = true;

  /* ---------------- Search ---------------- */
  function searchItems(q) {
    const terms = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length || !S.snap) return [];
    const out = [];
    const score = (name, hay) => {
      if (!terms.every(t => hay.includes(t))) return -1;
      const n = name.toLowerCase(), q0 = terms[0];
      return n.startsWith(q0) ? 0 : n.includes(q0) ? 1 : 2;
    };
    S.snap.hosts.forEach(h => {
      const sc = score(h.name, [h.id, h.name, h.hardware, h.os, h.ip, h.role, 'host'].join(' ').toLowerCase());
      if (sc >= 0) out.push({ kind: 'host', id: h.id, sc, name: h.name, h });
    });
    S.snap.services.forEach(s => {
      const sc = score(s.name, [s.name, s.id, s.image, s.type, typeLabel(s.type), s.host, s.url, s.category].join(' ').toLowerCase());
      if (sc >= 0) out.push({ kind: 'service', id: s.id, sc, name: s.name, s });
    });
    return out.sort((a, b) => a.sc - b.sc || a.name.localeCompare(b.name)).slice(0, 8);
  }
  function renderSearch() {
    const q = E.input.value;
    const focused = document.activeElement === E.input;
